<svg xmlns="http://www.w3.org/2000/svg" width="480" height="312" viewBox="0 0 480 312" role="img" aria-labelledby="title desc">
<title id="title">Data is serial; control reaches every chip</title><desc id="desc">In the schematic scan chain, debugger TDI feeds chip A, chip A output feeds chip B, and chip B sends TDO back. TCK and TMS branch to both chips in parallel while captured data shifts through the cells in series.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/14/04.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
