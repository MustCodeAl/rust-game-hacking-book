<svg xmlns="http://www.w3.org/2000/svg" width="480" height="291" viewBox="0 0 480 291" role="img" aria-labelledby="title desc">
<title id="title">One call crosses back to the host</title><desc id="desc">The native host asks its Lua runtime to run a script. The script calls game.log with the exact message observer started, crossing back to the host-supplied logging callback.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/12/01.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">One call crosses back to the host</text>
<rect x="16" y="58" width="163" height="175" rx="5" class="box"/><text x="29" y="83" class="strong" text-anchor="start">Native host</text><rect x="29" y="148" width="136" height="55" rx="5" class="box"/><text x="97" y="170" class="sub" text-anchor="middle">game.log callback</text><text x="97" y="192" class="sub" text-anchor="middle">writes host log</text><rect x="231" y="58" width="233" height="175" rx="5" class="box"/><text x="244" y="83" class="strong" text-anchor="start">Lua runtime</text><text x="244" y="122" class="mono" text-anchor="start">game.log(</text><text x="244" y="143" class="mono" text-anchor="start">  &quot;observer started&quot;)</text><path d="M183 103H226" class="line" marker-end="url(#arrow)"/><text x="183" y="93" class="sub" text-anchor="start">run</text><path d="M244 158H170" class="line" marker-end="url(#arrow)"/><text x="278" y="192" class="sub" text-anchor="start">message argument</text><text x="16" y="269" class="sub" text-anchor="start">The host owns both execution and the exposed service.</text>
</svg>
