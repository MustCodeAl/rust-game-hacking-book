<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img" aria-labelledby="title description">
<title id="title">A wall contains a sampled sight point</title><desc id="description">In tick 8, the guard is at (4,0), the target is at (8,0), and the wall spans (5.5,-1) to (6.5,1). The selected sample (5.6,0) lies within both wall bounds. Any contained sample returns false and stops the walk. The actual sampling step is 0.1; selected dots are shown, without claiming a specific first boundary hit.</desc>
<metadata>Original geometric and pixel artwork. Public domain dedication: CC0 1.0 Universal.</metadata>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L6 3L0 6Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style>
<rect x="0" y="0" width="480" height="240" fill="#ffffff" stroke="none" stroke-width="1"/><text x="20" y="23" font-size="15" fill="#25343d" font-weight="700" text-anchor="start">A sample inside the wall stops the sight check</text><rect x="120" y="70" width="52" height="104" fill="#dae1e6" stroke="#95a4ae" stroke-width="1.5"/><path d="M120 70L172 70" fill="none" stroke="#b7c1c9" stroke-width="1"/><path d="M146 70L146 96" fill="none" stroke="#b7c1c9" stroke-width="1"/><path d="M120 96L172 96" fill="none" stroke="#b7c1c9" stroke-width="1"/><path d="M133 96L133 122" fill="none" stroke="#b7c1c9" stroke-width="1"/><path d="M120 122L172 122" fill="none" stroke="#b7c1c9" stroke-width="1"/><path d="M146 122L146 148" fill="none" stroke="#b7c1c9" stroke-width="1"/><path d="M120 148L172 148" fill="none" stroke="#b7c1c9" stroke-width="1"/><path d="M133 148L133 174" fill="none" stroke="#b7c1c9" stroke-width="1"/><path d="M42 122L125.2 122" fill="none" stroke="#218675" stroke-width="1"/><path d="M125.2 122L250 122" fill="none" stroke="#63727c" stroke-width="1" stroke-dasharray="3 4"/><circle cx="47.2" cy="122" r="2" fill="#218675" stroke="none" stroke-width="1"/><circle cx="52.4" cy="122" r="2" fill="#218675" stroke="none" stroke-width="1"/><circle cx="57.6" cy="122" r="2" fill="#218675" stroke="none" stroke-width="1"/><circle cx="62.8" cy="122" r="2" fill="#218675" stroke="none" stroke-width="1"/><circle cx="68" cy="122" r="2" fill="#218675" stroke="none" stroke-width="1"/><circle cx="73.2" cy="122" r="2" fill="#218675" stroke="none" stroke-width="1"/><circle cx="78.4" cy="122" r="2" fill="#218675" stroke="none" stroke-width="1"/><circle cx="83.6" cy="122" r="2" fill="#218675" stroke="none" stroke-width="1"/><circle cx="88.8" cy="122" r="2" fill="#218675" stroke="none" stroke-width="1"/><circle cx="94" cy="122" r="2" fill="#218675" stroke="none" stroke-width="1"/><circle cx="99.2" cy="122" r="2" fill="#218675" stroke="none" stroke-width="1"/><circle cx="104.4" cy="122" r="2" fill="#218675" stroke="none" stroke-width="1"/><circle cx="109.6" cy="122" r="2" fill="#218675" stroke="none" stroke-width="1"/><circle cx="114.8" cy="122" r="2" fill="#218675" stroke="none" stroke-width="1"/><circle cx="42" cy="122" r="5" fill="#25343d" stroke="none" stroke-width="1"/><circle cx="250" cy="122" r="5" fill="#ffffff" stroke="#63727c" stroke-width="1.5"/><circle cx="125.2" cy="122" r="4" fill="#bd493e" stroke="#ffffff" stroke-width="1"/><text x="22" y="150" font-size="11" fill="#25343d" font-weight="400" text-anchor="start" class="mono">(4, 0)</text><text x="223" y="150" font-size="11" fill="#25343d" font-weight="400" text-anchor="start" class="mono">(8, 0)</text><text x="120" y="188" font-size="10" fill="#63727c" font-weight="400" text-anchor="middle" class="mono">5.5</text><text x="172" y="188" font-size="10" fill="#63727c" font-weight="400" text-anchor="middle" class="mono">6.5</text><text x="149" y="61" font-size="12" fill="#63727c" font-weight="400" text-anchor="middle">wall</text><text x="290" y="62" font-size="12" fill="#25343d" font-weight="400" text-anchor="start" class="mono">min (5.5, −1)</text><text x="290" y="82" font-size="12" fill="#25343d" font-weight="400" text-anchor="start" class="mono">max (6.5,  1)</text><text x="290" y="115" font-size="12" fill="#bd493e" font-weight="400" text-anchor="start" class="mono">sample (5.6, 0)</text><text x="290" y="140" font-size="12" fill="#25343d" font-weight="400" text-anchor="start" class="mono">5.5 ≤ 5.6 ≤ 6.5</text><text x="290" y="161" font-size="12" fill="#25343d" font-weight="400" text-anchor="start" class="mono">−1 ≤ 0 ≤ 1</text><text x="290" y="188" font-size="13" fill="#bd493e" font-weight="700" text-anchor="start">inside → false</text><circle cx="22" cy="211" r="3" fill="#218675" stroke="none" stroke-width="1"/><text x="30" y="215" font-size="10" fill="#63727c" font-weight="400" text-anchor="start">clear samples</text><circle cx="133" cy="211" r="3" fill="#bd493e" stroke="none" stroke-width="1"/><text x="141" y="215" font-size="10" fill="#63727c" font-weight="400" text-anchor="start">inside wall</text><path d="M236 211L256 211" fill="none" stroke="#63727c" stroke-width="1" stroke-dasharray="3 4"/><text x="263" y="215" font-size="10" fill="#63727c" font-weight="400" text-anchor="start">remaining path need not be checked</text><text x="20" y="235" font-size="10.5" fill="#63727c" font-weight="400" text-anchor="start">Selected dots shown. The actual step is 0.1 world units.</text>
</svg>
