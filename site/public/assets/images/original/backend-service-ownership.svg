<svg xmlns="http://www.w3.org/2000/svg" width="480" height="576" viewBox="0 0 480 576" role="img" aria-labelledby="title desc">
<title id="title">One match, several service jobs</title><desc id="desc">Account and matchmaking requests use gateway checks. Auth sessions refer to durable account records. A matchmaker selects worker 7 for match 42. A coordination record identifies that owner. Versioned asset files reach the client through object storage and a CDN. A cache holds rebuildable views.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-09. Public domain dedication: CC0 1.0 Universal. Source is this original SVG markup. Conceptual teaching model, not a vendor deployment or literal wire-format specification. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:1rem}.title{font-size:1.125rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.875rem}.mono{font-family:ui-monospace,monospace;font-size:.875rem}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.group{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dash{fill:none;stroke:currentColor;stroke-width:.1rem;stroke-dasharray:.3rem .2rem}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
