<svg xmlns="http://www.w3.org/2000/svg" width="480" height="282" viewBox="0 0 480 282" role="img" aria-labelledby="title desc">
<title id="title">Two reads execute ADD #5</title><desc id="desc">The toy emulator fetches opcode 03 at 0x04 and operand 05 at 0x05. ADD #5 changes A from 10 to 15, advances PC from 0x04 to 0x06 and costs two cycles. The instruction bytes remain in memory.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/14/06.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">Two reads execute ADD #5</text>
<text x="16" y="60" class="strong" text-anchor="start">Memory</text><text x="172" y="60" class="mono" text-anchor="start">0x04</text><text x="282" y="60" class="mono" text-anchor="start">0x05</text><text x="391" y="60" class="mono" text-anchor="start">0x06</text><rect x="158" y="77" width="102" height="40" rx="0" class="box"/><text x="209.0" y="103.8" class="mono" text-anchor="middle">03</text><rect x="260" y="77" width="102" height="40" rx="0" class="box"/><text x="311.0" y="103.8" class="mono" text-anchor="middle">05</text><rect x="362" y="77" width="102" height="40" rx="0" class="box"/><text x="413.0" y="103.8" class="mono" text-anchor="middle">next</text><text x="16" y="140" class="mono" text-anchor="start">PC 0x04</text><path d="M126 135H208V122" class="line" marker-end="url(#arrow)"/><text x="170" y="150" class="sub" text-anchor="start">fetch opcode</text><path d="M310 123V172H404" class="line" marker-end="url(#arrow)"/><text x="16" y="187" class="mono" text-anchor="start">A = 10</text><text x="204" y="186" class="mono" text-anchor="start">ADD #5</text><text x="401" y="186" class="mono" text-anchor="middle">A = 15</text><path d="M112 180L184 180" class="line" marker-end="url(#arrow)"/><path d="M276 180L346 180" class="line" marker-end="url(#arrow)"/><text x="16" y="232" class="sub" text-anchor="start">PC advances twice: 0x04 → 0x05 → 0x06.</text><text x="16" y="259" class="sub" text-anchor="start">Two instruction-byte reads cost 2 toy cycles.</text>
</svg>
