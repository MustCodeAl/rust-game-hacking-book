<svg xmlns="http://www.w3.org/2000/svg" width="480" height="312" viewBox="0 0 480 312" role="img" aria-labelledby="title desc">
<title id="title">Layers share the caller’s process</title><desc id="desc">The application, its Win32 DLL implementation and an ntdll native stub are software layers in one user-mode process. A controlled system-call gate crosses to the kernel, which validates the request and returns a result.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/10/07.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
