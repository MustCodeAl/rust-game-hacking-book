<text x="16" y="26" class="title" text-anchor="start">Layers share the caller’s process</text>
<rect x="16" y="58" width="448" height="123" rx="5" class="box"/><text x="28" y="83" class="strong" text-anchor="start">One user-mode process</text><rect x="28" y="106" width="113" height="46" rx="5" class="box"/><text x="84" y="132" class="" text-anchor="middle">tool caller</text><path d="M144 129L172 129" class="line" marker-end="url(#arrow)"/><rect x="179" y="106" width="114" height="46" rx="5" class="box"/><text x="236" y="124" class="" text-anchor="middle">Win32 DLL</text><text x="236" y="144" class="sub" text-anchor="middle">contract</text><path d="M297 129L326 129" class="line" marker-end="url(#arrow)"/><rect x="333" y="106" width="116" height="46" rx="5" class="box"/><text x="391" y="124" class="" text-anchor="middle">native stub</text><text x="391" y="144" class="mono" text-anchor="middle">ntdll.dll</text><path d="M391 158L391 200" class="line" marker-end="url(#arrow)"/><path d="M16 207H345M433 207H464" class="line"/><rect x="347" y="192" width="84" height="31" rx="5" class="box"/><text x="389" y="213" class="mono" text-anchor="middle">syscall</text><text x="16" y="207" class="sub" text-anchor="start"></text><rect x="244" y="242" width="205" height="46" rx="5" class="box"/><text x="346" y="270" class="" text-anchor="middle">kernel validates request</text><path d="M389 226L389 236" class="line" marker-end="url(#arrow)"/><path d="M239 265H84V159" class="line" marker-end="url(#arrow)"/><text x="17" y="244" class="sub" text-anchor="start">result returns</text>
