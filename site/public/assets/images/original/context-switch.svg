<svg xmlns="http://www.w3.org/2000/svg" width="480" height="230" viewBox="0 0 480 230" role="img" aria-labelledby="t d"><title id="t">A context switch hands the processor from one thread to another</title><desc id="d">Thread A stops running. The kernel saves its registers, loads thread B's registers, and, only if B belongs to a different process, loads B's top-level page-table address into cr3. Thread B then runs and sees its registers exactly as they were.</desc><metadata>Original geometric artwork. Public domain dedication: CC0 1.0 Universal.</metadata><style>text{font-family:Arial,Helvetica,sans-serif;fill:#25343d}.m{font-family:Menlo,Consolas,monospace}</style><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#63727c"/></marker></defs><rect width="480" height="230" fill="#fff"/><text x="20" y="26" font-size="16" font-weight="700">One context switch, step by step</text>
<rect x="20" y="52" width="100" height="84" rx="4" fill="#e2f0f5" stroke="#4388aa" stroke-width="1.5"/><text x="70" y="90" font-size="14" font-weight="700" text-anchor="middle">Thread A</text><text x="70" y="108" font-size="12" text-anchor="middle">stops running</text>
<rect x="360" y="52" width="100" height="84" rx="4" fill="#e2f0f5" stroke="#4388aa" stroke-width="1.5"/><text x="410" y="90" font-size="14" font-weight="700" text-anchor="middle">Thread B</text><text x="410" y="108" font-size="12" text-anchor="middle">runs next</text>
<g stroke="#63727c" stroke-width="1.5" fill="none"><path d="M122 94H142" marker-end="url(#a)"/><path d="M338 94H358" marker-end="url(#a)"/></g>
<rect x="144" y="44" width="192" height="100" rx="4" fill="#fceddf" stroke="#bd592c" stroke-width="2"/><text x="240" y="64" font-size="13" font-weight="700" text-anchor="middle">Kernel</text>
<g font-size="12.5"><text x="156" y="86">1  save A's registers</text><text x="156" y="106">2  load B's registers</text><text x="156" y="126">3  cr3 = B's page tables</text></g>
<text x="20" y="166" font-size="13" style="fill:#63727c">Step 3 happens only if B belongs to a different process.</text><text x="20" y="188" font-size="13" style="fill:#63727c">The program never sees the switch: its registers</text><text x="20" y="206" font-size="13" style="fill:#63727c">come back exactly as they were.</text></svg>
