<svg xmlns="http://www.w3.org/2000/svg" width="480" height="279" viewBox="0 0 480 279" role="img" aria-labelledby="title desc">
<title id="title">Equal labels can hide different bytes</title><desc id="desc">In a separate three-byte example, 01 02 03 and 01 02 04 carry the same illustrative version label but have different SHA-256 digests. Compare bytes against a trusted baseline rather than relying on the label.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/10/02.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
