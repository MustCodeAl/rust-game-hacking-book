<title id="title">Parsing passes; the state can still refuse</title><desc id="desc">The same already-parsed Chat message is refused in Connected, which remains Connected, but accepted in InLobby, which remains InLobby. The state gate is distinct from the parser; no malformed bytes are involved.</desc>
