<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200" role="img" aria-labelledby="t d"><title id="t">A pointer chain from a module base to a value</title><desc id="d">Start at the module base, add an offset, read a pointer, add 0x18, read another pointer, add 0x30, and the final address holds the value.</desc><metadata>Original geometric artwork. Public domain dedication: CC0 1.0 Universal.</metadata><style>text{font-family:Arial,Helvetica,sans-serif;fill:#25343d}.m{font-family:Menlo,Consolas,monospace}.s{fill:#63727c}</style><defs><marker id="a" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#63727c"/></marker></defs><rect width="480" height="200" fill="#fff"/><text x="20" y="26" font-size="16" font-weight="700">Follow the pointers, add the offsets</text>
<g font-size="12" text-anchor="middle"><rect x="14" y="60" width="88" height="48" rx="6" fill="#e2f0f5" stroke="#4388aa"/><text x="58" y="82">module base</text><text x="58" y="98" class="m s">known</text><rect x="136" y="60" width="88" height="48" rx="6" fill="#e2f0f5" stroke="#4388aa"/><text x="180" y="82">pointer A</text><text x="180" y="98" class="m s">read here</text><rect x="258" y="60" width="88" height="48" rx="6" fill="#e2f0f5" stroke="#4388aa"/><text x="302" y="82">pointer B</text><text x="302" y="98" class="m s">read here</text><rect x="380" y="60" width="86" height="48" rx="6" fill="#fceddf" stroke="#bd592c" stroke-width="2"/><text x="423" y="82">the value</text><text x="423" y="98" class="m s">gold</text></g>
<g stroke="#63727c" stroke-width="1.6" fill="none" marker-end="url(#a)"><path d="M102 84H132"/><path d="M224 84H254"/><path d="M346 84H376"/></g>
<g class="m" font-size="12" text-anchor="middle"><text x="117" y="52">+ offset</text><text x="239" y="52">+ 0x18</text><text x="361" y="52">+ 0x30</text></g>
<text x="20" y="150" font-size="13">Each arrow is: add an offset to the address, then read what is stored there.</text><text x="20" y="170" font-size="13">The last step reads the value itself, not another pointer.</text></svg>
