<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="title desc">
<title id="title">Keep the hook alive while callers drain</title><desc id="desc">In a separate illustrative drain, new callback work is blocked while active calls fall from 2 to 1 to 0. Only after active callbacks reach zero can removal restore the exact site bytes and release the hook resources.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/13/05.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">Keep the hook alive while callers drain</text>
<text x="16" y="59" class="strong" text-anchor="start">Block new callback work</text><path d="M16 88H101" class="line" marker-end="url(#arrow)"/><path d="M111 72V103" class="line"/><path d="M103 79L119 95M103 95L119 79" class="line"/><text x="144" y="91" class="sub" text-anchor="start">existing calls may still return</text><rect x="16" y="122" width="138" height="74" rx="5" class="box"/><circle cx="52" cy="153" r="8" class="open"/><circle cx="87" cy="153" r="8" class="open"/><text x="85" y="185" class="sub" text-anchor="middle">2 active</text><path d="M160 158L194 158" class="line" marker-end="url(#arrow)"/><rect x="202" y="122" width="95" height="74" rx="5" class="box"/><circle cx="249" cy="153" r="8" class="open"/><text x="249" y="185" class="sub" text-anchor="middle">1 active</text><path d="M301 158L335 158" class="line" marker-end="url(#arrow)"/><rect x="342" y="122" width="122" height="74" rx="5" class="box"/><text x="403" y="156" class="strong" text-anchor="middle">0 active</text><text x="403" y="180" class="sub" text-anchor="middle">callbacks drained</text><text x="16" y="235" class="sub" text-anchor="start">Restore exact bytes, then release owned resources.</text><text x="16" y="258" class="sub" text-anchor="start">Zero is necessary; the other hook contracts still apply.</text>
</svg>
