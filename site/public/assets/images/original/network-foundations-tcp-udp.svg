<svg xmlns="http://www.w3.org/2000/svg" width="480" height="496" viewBox="0 0 480 496" role="img" aria-labelledby="title desc">
<title id="title">TCP waits for gaps; UDP keeps boundaries</title><desc id="desc">Illustrative TCP byte chunks A, B and C arrive with B lost. TCP exposes A, buffers C, then exposes B and C after recovery. Raw UDP datagrams A and C can arrive without recovering B; the application chooses its retry or replacement rule.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-09. Public domain dedication: CC0 1.0 Universal. Source is this original SVG markup. Conceptual teaching model, not a vendor deployment or literal wire-format specification. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:1rem}.title{font-size:1.125rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.875rem}.mono{font-family:ui-monospace,monospace;font-size:.875rem}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.group{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dash{fill:none;stroke:currentColor;stroke-width:.1rem;stroke-dasharray:.3rem .2rem}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="currentColor"/></marker></defs>
<text x="16" y="29" class="title" text-anchor="start">TCP waits for gaps; UDP keeps boundaries</text>
<rect x="16" y="58" width="448" height="204" rx="5" class="group"/>
<text x="32" y="85" class="strong" text-anchor="start">TCP: illustrative byte chunks</text>
<text x="32" y="109" class="sub" text-anchor="start">Sender</text>
<text x="300" y="109" class="sub" text-anchor="start">Receiver</text>
<text x="32" y="141" class="sub" text-anchor="start">A</text>
<text x="300" y="141" class="sub" text-anchor="start">deliver A</text>
<path d="M104 136H276" class="line" marker-end="url(#arrow)"/>
<text x="32" y="170" class="sub" text-anchor="start">B</text>
<text x="300" y="170" class="sub" text-anchor="start">missing B</text>
<path d="M104 165H174" class="dash"/>
<text x="32" y="199" class="sub" text-anchor="start">C</text>
<text x="300" y="199" class="sub" text-anchor="start">C waits</text>
<path d="M104 194H276" class="line" marker-end="url(#arrow)"/>
<text x="32" y="228" class="sub" text-anchor="start">retry B</text>
<text x="300" y="228" class="sub" text-anchor="start">deliver B, C</text>
<path d="M104 223H276" class="line" marker-end="url(#arrow)"/>
<path d="M170 157L186 173M170 173L186 157" class="line"/>
<text x="32" y="249" class="sub" text-anchor="start">Read calls still do not define game messages.</text>
<rect x="16" y="282" width="448" height="182" rx="5" class="group"/>
<text x="32" y="309" class="strong" text-anchor="start">UDP: whole datagrams</text>
<text x="32" y="333" class="sub" text-anchor="start">Sender</text>
<text x="300" y="333" class="sub" text-anchor="start">Receiver</text>
<text x="32" y="362" class="sub" text-anchor="start">A</text>
<text x="300" y="362" class="sub" text-anchor="start">deliver A</text>
<path d="M104 357H276" class="line" marker-end="url(#arrow)"/>
<text x="32" y="400" class="sub" text-anchor="start">B</text>
<text x="300" y="400" class="sub" text-anchor="start">missing B</text>
<path d="M104 395H174" class="dash"/>
<text x="32" y="438" class="sub" text-anchor="start">C</text>
<text x="300" y="438" class="sub" text-anchor="start">deliver C</text>
<path d="M104 433H276" class="line" marker-end="url(#arrow)"/>
<path d="M170 387L186 403M170 403L186 387" class="line"/>
<text x="16" y="487" class="sub" text-anchor="start">Game decides whether to retry or replace B.</text>
</svg>
