<svg xmlns="http://www.w3.org/2000/svg" width="480" height="305" viewBox="0 0 480 305" role="img" aria-labelledby="title desc">
<title id="title">The small sum hides a wrapped address</title><desc id="desc">On the lesson’s 64-bit example, offset 0xFFFFFFFFFFFFFFFC plus length 16 wraps modulo 2 to the power 64 to 12. Although 12 is within 4096, the start is invalid for that region. checked_add reports overflow instead.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/13/09.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">The small sum hides a wrapped address</text>
<text x="16" y="61" class="mono" text-anchor="start">offset = 0xFFFF_FFFF_FFFF_FFFC</text><path d="M20 99H461" class="line" marker-end="url(#arrow)"/><text x="23" y="88" class="sub" text-anchor="start">near 2⁶⁴</text><text x="426" y="88" class="sub" text-anchor="start">wrap</text><path d="M443 104C490 154 17 159 30 198" class="line" marker-end="url(#arrow)"/><text x="179" y="143" class="strong" text-anchor="start">+16 wraps to 12</text><path d="M20 215H461" class="line"/><circle cx="52" cy="215" r="6" class="open"/><text x="52" y="246" class="mono" text-anchor="middle">12</text><text x="17" y="241" class="mono" text-anchor="start">0</text><text x="390" y="195" class="mono" text-anchor="start">4096</text><text x="145" y="242" class="sub" text-anchor="start">12 ≤ 4096: weak check passes</text><text x="16" y="282" class="strong" text-anchor="start">checked_add returns None: reject the range.</text>
</svg>
