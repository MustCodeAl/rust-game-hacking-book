<text x="16" y="86" class="mono" text-anchor="start">FFFFFFFF</text>
<text x="16" y="217" class="mono" text-anchor="start">80000000</text>
<text x="16" y="348" class="mono" text-anchor="start">00000000</text>
<rect x="144" y="70" width="320" height="136" class="hatch"/>
<text x="304" y="114" class="key halo" text-anchor="middle">system range</text>
<text x="304" y="144" class="key halo" text-anchor="middle">2 GiB</text>
<text x="304" y="179" class="sub halo" text-anchor="middle">user-mode access is restricted</text>
<rect x="144" y="206" width="320" height="136" class="box"/>
<text x="160" y="229" class="key" text-anchor="start">user range · 2 GiB</text>
<rect x="160" y="244" width="128" height="32" class="box"/>
<text x="224" y="265" class="sub" text-anchor="middle">modules</text>
<rect x="312" y="254" width="136" height="32" class="box"/>
<text x="380" y="275" class="sub" text-anchor="middle">thread stacks</text>
<rect x="184" y="298" width="96" height="30" class="box"/>
<text x="232" y="318" class="sub" text-anchor="middle">heaps</text>
<text x="363" y="322" class="sub" text-anchor="middle">free holes</text>
<text x="16" y="378" class="sub" text-anchor="start">ASLR and allocation history change region locations.</text>
<text x="16" y="400" class="sub" text-anchor="start">Address ranges are not a promise of resident RAM.</text>
</svg>
