<svg xmlns="http://www.w3.org/2000/svg" width="480" height="410" viewBox="0 0 480 410" role="img" aria-labelledby="title desc">
<title id="title">Default split on 32-bit Windows</title>
<desc id="desc">For a default 32-bit process on 32-bit Windows, the lower 2 GiB from 0x00000000 through 0x7FFFFFFF is the user address range and the upper 2 GiB from 0x80000000 through 0xFFFFFFFF is the system address range. User memory contains separately mapped modules, heaps, thread stacks, and free holes. Their positions are schematic. This is a virtual map, not 4 GiB of physical RAM; configuration and 64-bit Windows change limits.</desc>
<metadata>Original geometric teaching artwork authored for Game Hacking Academy, 2026-10-09. Public domain dedication: CC0 1.0 Universal, https://creativecommons.org/publicdomain/zero/1.0/. Concept and illustrative values belong to site/src/content/docs/pages/11/06.mdx. No third-party image assets. Diagram dimensions and placements are schematic.</metadata>
