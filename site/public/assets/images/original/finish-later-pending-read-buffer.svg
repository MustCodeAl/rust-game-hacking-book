<svg xmlns="http://www.w3.org/2000/svg" width="480" height="315" viewBox="0 0 480 315" role="img" aria-labelledby="title desc">
<title id="title">A pending read finishes with a byte count</title><desc id="desc">The toy keypad read supplies an eight-byte buffer. With no key event, the driver parks the IRP and reports STATUS_PENDING. A key interrupt later supplies two event bytes; the driver completes the IRP with a returned count of two, leaving six buffer bytes unused.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/14/02.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
