<svg xmlns="http://www.w3.org/2000/svg" width="480" height="252" viewBox="0 0 480 252" role="img" aria-labelledby="title desc">
<title id="title">One address space, different owners</title><desc id="desc">An external tool receives a local copy through Windows. A guest DLL accesses game-owned bytes in the same address space; the game still owns their lifetime.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/8/01.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">One address space, different owners</text>
<rect x="16" y="58" width="138" height="140" rx="5" class="dashed"/><text x="28" y="80" class="strong" text-anchor="start">External tool</text><rect x="28" y="110" width="112" height="42" rx="5" class="box"/><text x="84" y="136" class="" text-anchor="middle">local copy</text><rect x="186" y="58" width="278" height="140" rx="5" class="box"/><text x="198" y="80" class="strong" text-anchor="start">Owned course process</text><rect x="198" y="101" width="115" height="40" rx="5" class="box"/><text x="256" y="126" class="" text-anchor="middle">guest DLL</text><rect x="338" y="104" width="27" height="32" rx="0" class="box"/><text x="351.5" y="125.44" class="mono" text-anchor="middle">G</text><rect x="365" y="104" width="27" height="32" rx="0" class="box"/><text x="378.5" y="125.44" class="mono" text-anchor="middle">A</text><rect x="392" y="104" width="27" height="32" rx="0" class="box"/><text x="405.5" y="125.44" class="mono" text-anchor="middle">M</text><rect x="419" y="104" width="27" height="32" rx="0" class="box"/><text x="432.5" y="125.44" class="mono" text-anchor="middle">E</text><text x="392" y="158" class="sub" text-anchor="middle">game-owned bytes</text><path d="M312 120L332 120" class="line" marker-end="url(#arrow)"/><text x="283" y="178" class="sub" text-anchor="start">direct pointer</text><path d="M339 105V91H84V104" class="line" marker-end="url(#arrow)"/><text x="167" y="50" class="sub" text-anchor="middle">Windows copies</text><text x="16" y="230" class="" text-anchor="start">Direct access still needs a valid object lifetime.</text>
</svg>
