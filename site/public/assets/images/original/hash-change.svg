<svg xmlns="http://www.w3.org/2000/svg" width="480" height="212" viewBox="0 0 480 212" role="img" aria-labelledby="t d"><title id="t">A hash changes completely when one byte changes</title><desc id="d">Two nearly identical files go through the same hash function. Each gives a fixed-length fingerprint, and the two fingerprints look unrelated. The values shown are illustrative, not real hashes.</desc><metadata>Original geometric artwork. Public domain dedication: CC0 1.0 Universal.</metadata><style>text{font-family:Arial,Helvetica,sans-serif;fill:#25343d}.m{font-family:Menlo,Consolas,monospace}.s{fill:#63727c}</style><rect width="480" height="212" fill="#fff"/><text x="20" y="26" font-size="16" font-weight="700">Same recipe, tiny change, new fingerprint</text>
<g font-size="12"><rect x="20" y="48" width="150" height="46" rx="6" fill="#e2f0f5" stroke="#4388aa"/><text x="30" y="68">file</text><text x="30" y="84" class="m">…gold=100…</text><rect x="20" y="118" width="150" height="46" rx="6" fill="#fceddf" stroke="#bd592c"/><text x="30" y="138">one byte changed</text><text x="30" y="154" class="m">…gold=101…</text></g>
<g stroke="#63727c" stroke-width="1.6" fill="none"><path d="M170 71H210M170 141H210"/></g>
<rect x="210" y="76" width="70" height="60" rx="8" fill="#edf0f1" stroke="#63727c"/><text x="245" y="104" font-size="12" text-anchor="middle">hash</text><text x="245" y="120" font-size="12" text-anchor="middle">function</text>
<g stroke="#63727c" stroke-width="1.6" fill="none"><path d="M280 96L318 71M280 116L318 141"/></g>
<g class="m" font-size="12"><rect x="318" y="48" width="146" height="46" rx="6" fill="#fff" stroke="#4388aa"/><text x="326" y="68">a3f9 1c02 77be…</text><text x="326" y="84" class="s">fixed length</text><rect x="318" y="118" width="146" height="46" rx="6" fill="#fff" stroke="#bd592c"/><text x="326" y="138">07c1 e4d8 92a5…</text><text x="326" y="154" class="s">looks unrelated</text></g>
<text x="20" y="184" font-size="12" class="s">Illustrative values, not real hashes.</text><text x="20" y="200" font-size="12" class="s">A match means the same bytes, not who made them.</text></svg>
