<text x="16" y="26" class="title" text-anchor="start">A signal earns a further question</text>
<text x="16" y="57" class="strong" text-anchor="start">Sample 1</text><circle cx="46" cy="86" r="13" class="open"/><path d="M42 76V88M42 94V96" class="line"/><path d="M64 86L100 86" class="line" marker-end="url(#arrow)"/><rect x="108" y="63" width="210" height="49" rx="5" class="box"/><text x="213" y="94" class="mono" text-anchor="middle">NeedsAnotherSample</text><text x="16" y="148" class="strong" text-anchor="start">Signal repeats</text><circle cx="46" cy="179" r="13" class="open"/><path d="M42 168V180M42 187V189" class="line"/><path d="M64 179L101 179" class="line" marker-end="url(#arrow)"/><rect x="108" y="155" width="210" height="49" rx="5" class="box"/><text x="213" y="187" class="mono" text-anchor="middle">NeedsDiagnosis</text><path d="M323 180L346 180" class="line" marker-end="url(#arrow)"/><text x="328" y="143" class="sub" text-anchor="start">explained</text><rect x="354" y="155" width="110" height="49" rx="5" class="box"/><text x="409" y="187" class="strong" text-anchor="middle">Baseline</text><text x="16" y="249" class="sub" text-anchor="start">An explained sample returns to the baseline.</text><text x="16" y="271" class="sub" text-anchor="start">Game-state validity is checked at its own boundary.</text>
