<svg xmlns="http://www.w3.org/2000/svg" width="480" height="190" viewBox="0 0 480 190" role="img" aria-labelledby="t d"><title id="t">A length-prefixed message</title><desc id="d">A frame starts with a four-byte big-endian length, 00 00 00 05, followed by exactly five payload bytes, 48 65 6C 6C 6F, which spell Hello.</desc><metadata>Original geometric artwork. Public domain dedication: CC0 1.0 Universal.</metadata><style>text{font-family:Arial,Helvetica,sans-serif;fill:#25343d}.m{font-family:Menlo,Consolas,monospace}.s{fill:#63727c}</style><rect width="480" height="190" fill="#fff"/><text x="20" y="26" font-size="16" font-weight="700">Length first, then exactly that many bytes</text>
<g class="m" font-size="14" text-anchor="middle"><rect x="20" y="52" width="48" height="32" fill="#fceddf" stroke="#bd592c"/><text x="44" y="73">00</text><rect x="68" y="52" width="48" height="32" fill="#fceddf" stroke="#bd592c"/><text x="92" y="73">00</text><rect x="116" y="52" width="48" height="32" fill="#fceddf" stroke="#bd592c"/><text x="140" y="73">00</text><rect x="164" y="52" width="48" height="32" fill="#fceddf" stroke="#bd592c"/><text x="188" y="73">05</text>
<rect x="228" y="52" width="46" height="32" fill="#e2f0f5" stroke="#4388aa"/><text x="251" y="73">48</text><rect x="274" y="52" width="46" height="32" fill="#e2f0f5" stroke="#4388aa"/><text x="297" y="73">65</text><rect x="320" y="52" width="46" height="32" fill="#e2f0f5" stroke="#4388aa"/><text x="343" y="73">6C</text><rect x="366" y="52" width="46" height="32" fill="#e2f0f5" stroke="#4388aa"/><text x="389" y="73">6C</text><rect x="412" y="52" width="46" height="32" fill="#e2f0f5" stroke="#4388aa"/><text x="435" y="73">6F</text></g>
<text x="20" y="108" font-size="12" class="s">length: 5 (four bytes, big-endian)</text><text x="228" y="108" font-size="12" class="s">payload: "Hello" (5 bytes)</text>
<text x="20" y="144" font-size="13">The reader checks the length against its limit and the bytes it really has,</text><text x="20" y="162" font-size="13">then takes exactly that many. Too large or too short means refuse the frame.</text></svg>
