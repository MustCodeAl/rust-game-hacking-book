<svg xmlns="http://www.w3.org/2000/svg" width="480" height="206" viewBox="0 0 480 206" role="img" aria-labelledby="title desc">
<title id="title">A collection can outgrow its allocation</title><desc id="desc">Appending a third item to storage for two can require a new allocation and invalidate old element addresses. Growth may move storage, so an old element address can become stale.</desc>
<metadata>Original geometric artwork. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-handoff-art.mjs and site/src/data/handoff-figures.json.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.84rem}.title{font-size:1rem;font-weight:700}.node{font-size:.82rem}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.08rem}.arrow{fill:none;stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker></defs>
<text class="title" x="12" y="24">A collection can outgrow its allocation</text>
<g><rect x="12" y="76" width="128" height="64" rx="6" class="box"/><text x="76" y="99" text-anchor="middle" class="node">Old capacity: 2</text><text x="76" y="117" text-anchor="middle" class="node">[A, B]</text></g><g><rect x="176" y="76" width="128" height="64" rx="6" class="box"/><text x="240" y="90" text-anchor="middle" class="node">Append C</text><text x="240" y="108" text-anchor="middle" class="node">capacity needed:</text><text x="240" y="126" text-anchor="middle" class="node">3</text></g><g><rect x="340" y="76" width="128" height="64" rx="6" class="box"/><text x="404" y="99" text-anchor="middle" class="node">New storage</text><text x="404" y="117" text-anchor="middle" class="node">[A, B, C]</text></g><path class="arrow" d="M145 108H169M309 108H333" marker-end="url(#arrow)"/>
<text x="12" y="170">Growth may move storage, so an old element address can become</text><text x="12" y="188">stale.</text>
</svg>
