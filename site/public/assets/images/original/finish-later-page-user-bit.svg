<svg xmlns="http://www.w3.org/2000/svg" width="480" height="272" viewBox="0 0 480 272" role="img" aria-labelledby="title desc">
<title id="title">One bit changes the leaf’s permission</title><desc id="desc">The teaching page-table leaf byte 0x67 is binary 01100111 with user bit 2 set. The byte 0x63 is 01100011 with bit 2 clear, so it refuses ring 3. Higher page-table levels also contribute to a full access decision.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/14/07.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">One bit changes the leaf’s permission</text>
<text x="16" y="60" class="strong" text-anchor="start">Ring 3 access</text><text x="214" y="60" class="sub" text-anchor="start">bits 7 … 0</text><text x="16" y="98" class="mono" text-anchor="start">0x67</text><rect x="116" y="73" width="42" height="38" rx="0" class="box"/><text x="137.0" y="98.46000000000001" class="mono" text-anchor="middle">0</text><rect x="158" y="73" width="42" height="38" rx="0" class="box"/><text x="179.0" y="98.46000000000001" class="mono" text-anchor="middle">1</text><rect x="200" y="73" width="42" height="38" rx="0" class="box"/><text x="221.0" y="98.46000000000001" class="mono" text-anchor="middle">1</text><rect x="242" y="73" width="42" height="38" rx="0" class="box"/><text x="263.0" y="98.46000000000001" class="mono" text-anchor="middle">0</text><rect x="284" y="73" width="42" height="38" rx="0" class="box"/><text x="305.0" y="98.46000000000001" class="mono" text-anchor="middle">0</text><rect x="326" y="73" width="42" height="38" rx="0" class="hatch"/><text x="347.0" y="98.46000000000001" class="mono halo" text-anchor="middle">1</text><rect x="368" y="73" width="42" height="38" rx="0" class="box"/><text x="389.0" y="98.46000000000001" class="mono" text-anchor="middle">1</text><rect x="410" y="73" width="42" height="38" rx="0" class="box"/><text x="431.0" y="98.46000000000001" class="mono" text-anchor="middle">1</text><text x="16" y="170" class="mono" text-anchor="start">0x63</text><rect x="116" y="145" width="42" height="38" rx="0" class="box"/><text x="137.0" y="170.46" class="mono" text-anchor="middle">0</text><rect x="158" y="145" width="42" height="38" rx="0" class="box"/><text x="179.0" y="170.46" class="mono" text-anchor="middle">1</text><rect x="200" y="145" width="42" height="38" rx="0" class="box"/><text x="221.0" y="170.46" class="mono" text-anchor="middle">1</text><rect x="242" y="145" width="42" height="38" rx="0" class="box"/><text x="263.0" y="170.46" class="mono" text-anchor="middle">0</text><rect x="284" y="145" width="42" height="38" rx="0" class="box"/><text x="305.0" y="170.46" class="mono" text-anchor="middle">0</text><rect x="326" y="145" width="42" height="38" rx="0" class="hatch"/><text x="347.0" y="170.46" class="mono halo" text-anchor="middle">0</text><rect x="368" y="145" width="42" height="38" rx="0" class="box"/><text x="389.0" y="170.46" class="mono" text-anchor="middle">1</text><rect x="410" y="145" width="42" height="38" rx="0" class="box"/><text x="431.0" y="170.46" class="mono" text-anchor="middle">1</text><text x="358" y="129" class="sub" text-anchor="middle">bit 2</text><text x="16" y="135" class="sub" text-anchor="start">user = 1: permitted by this leaf</text><text x="16" y="208" class="sub" text-anchor="start">user = 0: refused from ring 3</text><text x="16" y="249" class="sub" text-anchor="start">Other levels still contribute to the full access check.</text>
</svg>
