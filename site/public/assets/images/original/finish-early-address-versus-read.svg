<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">One location; two instruction effects</title><desc id="desc">Starting at 0x1000, index 2 times scale 4 advances eight bytes, and displacement 8 advances eight more, reaching 0x1010. LEA keeps that address; MOV with the memory source reads the bytes at that location. No stored byte value is assumed.</desc>
<metadata>Original Game Hacking Academy geometric teaching artwork. Dedicated to the public domain under CC0 1.0 Universal. No third-party imagery or fonts embedded. Reproduce with site/scripts/make-finish-early-art.py.</metadata>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" stroke="currentColor" stroke-width=".04rem"/></pattern></defs>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{fill:currentColor;font-family:Arial,Helvetica,sans-serif}.mono{font-family:"Courier New",monospace}.shape{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.08rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.08rem}.line{fill:none;stroke:currentColor;stroke-width:.08rem}.point{fill:currentColor}</style>
<text x="16" y="25" text-anchor="start" class="label" style="font-size:1rem;font-weight:700">One location; two instruction effects</text>
<text x="48" y="63" text-anchor="start" class="mono" style="font-size:.875rem">0x1000</text>
<text x="234" y="63" text-anchor="middle" class="mono" style="font-size:.875rem">+8</text>
<text x="420" y="63" text-anchor="end" class="mono" style="font-size:.875rem">0x1010</text>
<path class="line" d="M48 83L232 83"/>
<polygon fill="currentColor" points="232,83 225.00,80.00 225.00,86.00"/>
<path class="line" d="M236 83L420 83"/>
<polygon fill="currentColor" points="420,83 413.00,80.00 413.00,86.00"/>
<text x="140" y="110" text-anchor="middle" class="label" style="font-size:.875rem">2 × 4 bytes</text>
<text x="328" y="110" text-anchor="middle" class="label" style="font-size:.875rem">+8 bytes</text>
<rect class="shape" x="166" y="135" width="148" height="46" style="stroke-width:.15rem"/>
<text x="240" y="164" text-anchor="middle" class="mono" style="font-size:1rem;font-weight:700">0x1010</text>
<path class="line" d="M420 87L420 123" stroke-dasharray="4 3"/>
<path class="line" d="M420 123L240 123" stroke-dasharray="4 3"/>
<path class="line" d="M240 123L240 135" stroke-dasharray="4 3"/>
<polygon fill="currentColor" points="240,135 243.00,128.00 237.00,128.00"/>
<path class="line" d="M224 185L119 219"/>
<polygon fill="currentColor" points="119,219 126.58,219.70 124.74,213.99"/>
<path class="line" d="M256 185L362 219"/>
<polygon fill="currentColor" points="362,219 356.25,214.01 354.42,219.72"/>
<rect class="shape" x="16" y="223" width="206" height="58"/>
<text x="119" y="245" text-anchor="middle" class="mono" style="font-size:1rem;font-weight:700">lea</text>
<text x="119" y="269" text-anchor="middle" class="label" style="font-size:.875rem">keep the address</text>
<rect class="shape" x="256" y="223" width="208" height="58"/>
<text x="360" y="245" text-anchor="middle" class="mono" style="font-size:1rem;font-weight:700">mov from memory</text>
<text x="360" y="269" text-anchor="middle" class="label" style="font-size:.875rem">read the bytes there</text>
</svg>
