<svg xmlns="http://www.w3.org/2000/svg" width="480" height="297" viewBox="0 0 480 297" role="img" aria-labelledby="title desc">
<title id="title">A retry returns the committed result</title><desc id="desc">The toy server starts at score zero with coin C. The first valid pickup consumes C and commits score one. A repeated delivery of that same pickup returns the stored result and keeps the score at one instead of rewarding it again.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/15/09.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">A retry returns the committed result</text>
<circle cx="51" cy="113" r="20" class="open"/><text x="51" y="118" class="strong" text-anchor="middle">C</text><path d="M77 113L118 113" class="line" marker-end="url(#arrow)"/><rect x="126" y="69" width="218" height="111" rx="5" class="box"/><text x="139" y="92" class="strong" text-anchor="start">Server-owned pickup</text><text x="139" y="122" class="sub" text-anchor="start">consume C · score 0 → 1</text><text x="139" y="151" class="sub" text-anchor="start">store committed result</text><path d="M350 119L392 119" class="line" marker-end="url(#arrow)"/><rect x="399" y="86" width="65" height="59" rx="5" class="box"/><path d="M409 106H454M409 117H454M409 128H442" class="line"/><text x="431.5" y="164" class="sub" text-anchor="middle">result 1</text><path d="M45 139V223H233V185" class="dashed" marker-end="url(#arrow)"/><text x="51" y="207" class="sub" text-anchor="start">same C delivered again</text><path d="M348 147H375V250H231" class="line" marker-end="url(#arrow)"/><text x="16" y="275" class="strong" text-anchor="start">Return the stored result: score stays 1.</text>
</svg>
