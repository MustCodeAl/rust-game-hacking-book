<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200" role="img" aria-labelledby="t d"><title id="t">The short way around a circle</title><desc id="d">A heading of 179 degrees and a target of minus 179 degrees are only 2 degrees apart across the 180 degree line. Direct subtraction gives minus 358 degrees, a long spin the other way.</desc><metadata>Original geometric artwork. Public domain dedication: CC0 1.0 Universal.</metadata><style>text{font-family:Arial,Helvetica,sans-serif;fill:#25343d}.m{font-family:Menlo,Consolas,monospace}.s{fill:#63727c}</style><rect width="480" height="200" fill="#fff"/><text x="20" y="26" font-size="16" font-weight="700">179° and −179° are only 2° apart</text>
<circle cx="110" cy="116" r="62" fill="#f0f3f5" stroke="#63727c"/><path d="M110 54V178M48 116H172" stroke="#d9e0e5"/><text x="110" y="48" font-size="11" text-anchor="middle" class="s">0°</text><text x="110" y="192" font-size="11" text-anchor="middle" class="s">180°</text>
<path d="M110 116L106 178" stroke="#4388aa" stroke-width="3"/><path d="M110 116L114 178" stroke="#bd592c" stroke-width="3"/><circle cx="106" cy="178" r="4" fill="#4388aa"/><circle cx="114" cy="178" r="4" fill="#bd592c"/>
<g font-size="13"><text x="210" y="70" fill="#4388aa" style="fill:#4388aa">current: 179°</text><text x="210" y="90" style="fill:#bd592c">desired: −179°</text><text x="210" y="124">desired − current = −358°</text><text x="210" y="142" class="s">a long spin the wrong way</text><text x="210" y="168" font-weight="700">shortest turn = +2°</text><text x="210" y="186" class="s">normalize into −180° … 180°</text></g></svg>
