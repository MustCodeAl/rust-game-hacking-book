<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" role="img" aria-labelledby="t d"><title id="t">A 3-4-5 right triangle between two points</title><desc id="d">A player at (2, 3) and an enemy at (5, 7). The enemy is 3 units along x and 4 along y, so the straight-line distance is 5.</desc><metadata>Original geometric artwork. Public domain dedication: CC0 1.0 Universal.</metadata><style>text{font-family:Arial,Helvetica,sans-serif;fill:#25343d}.m{font-family:Menlo,Consolas,monospace}</style><rect width="480" height="220" fill="#fff"/><text x="20" y="26" font-size="16" font-weight="700">Subtract, then measure</text>
<g stroke="#d9e0e5"><path d="M60 60H300M60 100H300M60 140H300M60 180H300M60 60V180M120 60V180M180 60V180M240 60V180M300 60V180"/></g>
<path d="M120 180H240V60Z" fill="#e2f0f5" stroke="#4388aa" stroke-width="2"/><path d="M120 180L240 60" stroke="#bd592c" stroke-width="3"/>
<circle cx="120" cy="180" r="7" fill="#218675"/><circle cx="240" cy="60" r="7" fill="#bd592c"/>
<g class="m" font-size="13"><text x="86" y="198">player (2, 3)</text><text x="250" y="56">enemy (5, 7)</text><text x="168" y="196" style="fill:#4388aa">3 along x</text><text x="246" y="124" style="fill:#4388aa">4 along y</text><text x="146" y="110" style="fill:#bd592c" transform="rotate(-45 146 110)">length 5</text></g>
<g class="m" font-size="14"><text x="330" y="90">dx = 5 − 2 = 3</text><text x="330" y="115">dy = 7 − 3 = 4</text><text x="330" y="140">√(9 + 16) = 5</text></g></svg>
