<svg xmlns="http://www.w3.org/2000/svg" width="480" height="326" viewBox="0 0 480 326" role="img" aria-labelledby="title desc">
<title id="title">A page boundary needs another translation</title><desc id="desc">The lesson’s 32-byte read begins at virtual 0x00007FF612340FF8. Eight bytes remain in its first page, beginning physically at 0x05123FF8. The next 24 bytes come from the next virtual page mapped to physical 0x0091A000, then the reader joins both copies in an owned buffer.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/11/07.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">A page boundary needs another translation</text>
<text x="16" y="61" class="mono" text-anchor="start">32 bytes at virtual …1234_0FF8</text><rect x="16" y="78" width="112" height="38" rx="5" class="box"/><text x="72" y="102" class="strong" text-anchor="middle">8 bytes</text><rect x="128" y="78" width="336" height="38" rx="5" class="box"/><text x="296" y="102" class="strong" text-anchor="middle">24 bytes</text><text x="132" y="140" class="sub" text-anchor="start">virtual page boundary</text><path d="M72 119L72 155" class="line" marker-end="url(#arrow)"/><path d="M354 119L354 155" class="line" marker-end="url(#arrow)"/><rect x="16" y="163" width="194" height="68" rx="5" class="box"/><text x="28" y="188" class="mono" text-anchor="start">0x0512_3FF8</text><text x="28" y="212" class="sub" text-anchor="start">end of first physical page</text><rect x="250" y="163" width="214" height="68" rx="5" class="box"/><text x="262" y="188" class="mono" text-anchor="start">0x0091_A000</text><text x="262" y="212" class="sub" text-anchor="start">start of next mapped page</text><path d="M110 236V269H249M357 236V269H249" class="line"/><text x="16" y="304" class="sub" text-anchor="start">Join the copied 8 + 24 bytes in an owned buffer.</text>
</svg>
