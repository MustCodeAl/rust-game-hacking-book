<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200" role="img" aria-labelledby="t d"><title id="t">Records one stride apart</title><desc id="d">A table starts at offset 0. Each player record is 0x20 bytes long, so player 0 starts at 0x00, player 1 at 0x20, and player 2 at 0x40. A field at plus 4 inside player 2 is at offset 0x44.</desc><metadata>Original geometric artwork. Public domain dedication: CC0 1.0 Universal.</metadata><style>text{font-family:Arial,Helvetica,sans-serif;fill:#25343d}.m{font-family:Menlo,Consolas,monospace}</style><rect width="480" height="200" fill="#fff"/><text x="20" y="26" font-size="16" font-weight="700">Count whole records, then the field</text>
<g stroke="#4388aa" fill="#e2f0f5"><rect x="30" y="50" width="130" height="60"/><rect x="160" y="50" width="130" height="60"/><rect x="290" y="50" width="130" height="60" fill="#fceddf" stroke="#bd592c" stroke-width="2"/></g>
<rect x="290" y="50" width="26" height="60" fill="#bd592c" opacity=".35"/>
<g font-size="14" text-anchor="middle"><text x="95" y="86">player 0</text><text x="225" y="86">player 1</text><text x="355" y="86">player 2</text></g>
<g class="m" font-size="13" text-anchor="middle"><text x="30" y="132">0x00</text><text x="160" y="132">0x20</text><text x="290" y="132">0x40</text><text x="316" y="150" style="fill:#bd592c">+4</text></g>
<g stroke="#63727c" fill="none"><path d="M30 120V112M160 120V112M290 120V112"/><path d="M316 138V112"/></g>
<text x="20" y="182" class="m" font-size="14">2 × 0x20 = 0x40, then + 0x04 = 0x44</text></svg>
