<svg xmlns="http://www.w3.org/2000/svg" width="480" height="172" viewBox="0 0 480 172" role="img" aria-labelledby="t d"><title id="t">The rendering pipeline in four steps</title><desc id="d">Vertices are placed by the vertex stage, assembled into triangles, turned into pixel candidates by rasterization, then coloured by the pixel stage before the finished frame is shown.</desc><metadata>Original geometric artwork. Public domain dedication: CC0 1.0 Universal.</metadata><style>text{font-family:Arial,Helvetica,sans-serif;fill:#25343d}.m{font-family:Menlo,Consolas,monospace}.s{fill:#63727c}</style><defs><marker id="a" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#63727c"/></marker></defs><rect width="480" height="172" fill="#fff"/><text x="20" y="26" font-size="16" font-weight="700">From points to a picture</text>
<g font-size="12" text-anchor="middle"><rect x="14" y="52" width="96" height="58" rx="6" fill="#e2f0f5" stroke="#4388aa"/><text x="62" y="76">vertices</text><text x="62" y="94" class="s">place the points</text><rect x="130" y="52" width="96" height="58" rx="6" fill="#e2f0f5" stroke="#4388aa"/><text x="178" y="76">triangles</text><text x="178" y="94" class="s">join the points</text><rect x="246" y="52" width="96" height="58" rx="6" fill="#e2f0f5" stroke="#4388aa"/><text x="294" y="76">rasterize</text><text x="294" y="94" class="s">find the pixels</text><rect x="362" y="52" width="104" height="58" rx="6" fill="#fceddf" stroke="#bd592c" stroke-width="2"/><text x="414" y="76">pixel colour</text><text x="414" y="94" class="s">paint, then show</text></g>
<g stroke="#63727c" stroke-width="1.6" fill="none" marker-end="url(#a)"><path d="M110 81H126"/><path d="M226 81H242"/><path d="M342 81H358"/></g>
<text x="20" y="138" font-size="13">Every stage hands its result to the next,</text><text x="20" y="156" font-size="13">so a change early on shows up in the final frame.</text></svg>
