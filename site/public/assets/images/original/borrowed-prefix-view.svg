<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-labelledby="title desc">
<title id="title">A borrowed view points into one buffer</title><desc id="desc">The caller owns buffer [10, 20, 30, 40]. prefix(&amp;buffer, 2) returns a view of the first two bytes. No second byte array is created; the view cannot remain valid after its owner is gone.</desc>
<metadata>Original Game Hacking Academy geometric teaching artwork. CC0 1.0 Universal. Reproduce with site/scripts/make-foundation-art.py.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{fill:currentColor;font-family:Arial,Helvetica,sans-serif}.mono{font-family:"Courier New",monospace}.shape{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.08rem}.line{fill:none;stroke:currentColor;stroke-width:.08rem}</style>
<text x="16" y="22" style="font-size:1.0000rem;font-weight:700">A borrowed view points into one buffer</text>
<text x="16" y="52" style="font-size:0.7500rem">buffer: [u8; 4] owned by the caller</text>
<rect class="shape" x="46" y="75" width="97" height="44" rx="0" style="stroke-width:.15rem"/>
<text x="94.5" y="103" class="mono" text-anchor="middle" style="font-size:1.0625rem">10</text>
<text x="94.5" y="136" text-anchor="middle" style="font-size:0.6875rem">index 0</text>
<rect class="shape" x="143" y="75" width="97" height="44" rx="0" style="stroke-width:.15rem"/>
<text x="191.5" y="103" class="mono" text-anchor="middle" style="font-size:1.0625rem">20</text>
<text x="191.5" y="136" text-anchor="middle" style="font-size:0.6875rem">index 1</text>
<rect class="shape" x="240" y="75" width="97" height="44" rx="0"/>
<text x="288.5" y="103" class="mono" text-anchor="middle" style="font-size:1.0625rem">30</text>
<text x="288.5" y="136" text-anchor="middle" style="font-size:0.6875rem">index 2</text>
<rect class="shape" x="337" y="75" width="97" height="44" rx="0"/>
<text x="385.5" y="103" class="mono" text-anchor="middle" style="font-size:1.0625rem">40</text>
<text x="385.5" y="136" text-anchor="middle" style="font-size:0.6875rem">index 3</text>
<path class="line" d="M46 155L240 155"/>
<path class="line" d="M46 145L46 155"/>
<path class="line" d="M240 145L240 155"/>
<text x="143" y="178" class="mono" text-anchor="middle" style="font-size:0.7500rem">view: &amp;[u8], length 2</text>
<text x="16" y="207" class="mono" style="font-size:0.7500rem">prefix(&amp;buffer, 2) returns Some(view)</text>
<text x="16" y="232" style="font-size:0.7500rem">The bracket selects bytes that already belong to buffer.</text>
<text x="16" y="251" style="font-size:0.7500rem">The lifetime ties the view to that existing owner.</text>
</svg>
