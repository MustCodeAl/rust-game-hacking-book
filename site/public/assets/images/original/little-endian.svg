<svg xmlns="http://www.w3.org/2000/svg" width="480" height="190" viewBox="0 0 480 190" role="img" aria-labelledby="t d"><title id="t">The number 100 stored little-endian</title><desc id="d">The number 100 is 0x64. In a four-byte little-endian field the lowest byte comes first: addresses plus 0 to plus 3 hold 64, 00, 00, 00.</desc><metadata>Original geometric artwork. Public domain dedication: CC0 1.0 Universal.</metadata><style>text{font-family:Arial,Helvetica,sans-serif;fill:#25343d}.m{font-family:Menlo,Consolas,monospace}.s{fill:#63727c}</style><rect width="480" height="190" fill="#fff"/><text x="20" y="26" font-size="16" font-weight="700">The number 100, stored low byte first</text><text x="20" y="52" font-size="13" class="s">100 in hexadecimal is 0x64, written as the four-byte value 0x00000064</text>
<g class="m" font-size="18" text-anchor="middle"><rect x="40" y="76" width="90" height="44" fill="#fceddf" stroke="#bd592c" stroke-width="2"/><text x="85" y="106">64</text><rect x="130" y="76" width="90" height="44" fill="#e2f0f5" stroke="#4388aa"/><text x="175" y="106">00</text><rect x="220" y="76" width="90" height="44" fill="#e2f0f5" stroke="#4388aa"/><text x="265" y="106">00</text><rect x="310" y="76" width="90" height="44" fill="#e2f0f5" stroke="#4388aa"/><text x="355" y="106">00</text></g>
<g class="m s" font-size="12" text-anchor="middle"><text x="85" y="138">+0</text><text x="175" y="138">+1</text><text x="265" y="138">+2</text><text x="355" y="138">+3</text></g>
<text x="40" y="160" font-size="13">The lowest byte comes first in memory,</text><text x="40" y="178" font-size="13">so a scan for 100 looks for 64 00 00 00.</text></svg>
