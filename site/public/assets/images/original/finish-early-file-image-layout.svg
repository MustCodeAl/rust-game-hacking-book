<text x="101" y="55" text-anchor="middle" class="label" style="font-size:.875rem;font-weight:700">disk: file offsets</text>
<text x="382" y="55" text-anchor="middle" class="label" style="font-size:.875rem;font-weight:700">image: RVAs</text>
