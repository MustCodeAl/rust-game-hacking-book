<svg xmlns="http://www.w3.org/2000/svg" width="480" height="230" viewBox="0 0 480 230" role="img" aria-labelledby="t d"><title id="t">A handle is a table index, not an address</title><desc id="d">Two handle values in a program, 0x12C and 0x134, are looked up in the current process's handle table. Each table row stores access rights and points to a kernel object. Both rows point to the same process object, but 0x12C allows query and read while 0x134 allows query only.</desc><metadata>Original geometric artwork. Public domain dedication: CC0 1.0 Universal.</metadata><style>text{font-family:Arial,Helvetica,sans-serif;fill:#25343d}.m{font-family:Menlo,Consolas,monospace}</style><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#63727c"/></marker></defs><rect width="480" height="230" fill="#fff"/><text x="20" y="26" font-size="16" font-weight="700">A handle is a table index, not an address</text>
<text x="20" y="54" font-size="12" style="fill:#63727c">Your program holds</text><text x="190" y="54" font-size="12" style="fill:#63727c">This process's handle table</text><text x="388" y="54" font-size="12" style="fill:#63727c">Kernel object</text>
<g class="m" font-size="14" text-anchor="middle"><rect x="20" y="64" width="120" height="30" fill="#e2f0f5" stroke="#4388aa"/><text x="80" y="84">0x12C</text><rect x="20" y="108" width="120" height="30" fill="#e2f0f5" stroke="#4388aa"/><text x="80" y="128">0x134</text></g>
<g stroke="#63727c" stroke-width="1.5" fill="none"><path d="M142 79H186" marker-end="url(#a)"/><path d="M142 123H186" marker-end="url(#a)"/><path d="M352 79L384 94" marker-end="url(#a)"/><path d="M352 123L384 108" marker-end="url(#a)"/></g>
<rect x="190" y="64" width="160" height="30" fill="#fff" stroke="#4388aa" stroke-width="1.5"/><rect x="190" y="108" width="160" height="30" fill="#fff" stroke="#4388aa" stroke-width="1.5"/>
<g class="m" font-size="12.5"><text x="198" y="84">query, read</text><text x="198" y="128">query only</text></g>
<rect x="386" y="76" width="76" height="50" rx="4" fill="#fceddf" stroke="#bd592c" stroke-width="2"/><text x="424" y="98" font-size="13" font-weight="700" text-anchor="middle">process</text><text x="424" y="114" font-size="12" text-anchor="middle">object</text>
<text x="20" y="176" font-size="13" style="fill:#63727c">The number only means something inside this process's table.</text><text x="20" y="196" font-size="13" style="fill:#63727c">Two handles to one process can carry different rights.</text>
<text x="20" y="216" font-size="13" style="fill:#63727c">Reading memory at 0x12C reveals nothing about the object.</text></svg>
