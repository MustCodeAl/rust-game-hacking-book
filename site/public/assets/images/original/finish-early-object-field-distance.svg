<svg xmlns="http://www.w3.org/2000/svg" width="480" height="288" viewBox="0 0 480 288" role="img" aria-labelledby="title desc">
<title id="title">The offset travels with the layout</title><desc id="desc">The first object begins at 0x12340000 and its yaw field at offset 0x40 has address 0x12340040. Another player begins elsewhere but uses the same yaw offset. Only the first base is numbered; spacing is schematic and no whole-object size is claimed.</desc>
<metadata>Original Game Hacking Academy geometric teaching artwork. Dedicated to the public domain under CC0 1.0 Universal. No third-party imagery or fonts embedded. Reproduce with site/scripts/make-finish-early-art.py.</metadata>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" stroke="currentColor" stroke-width=".04rem"/></pattern></defs>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{fill:currentColor;font-family:Arial,Helvetica,sans-serif}.mono{font-family:"Courier New",monospace}.shape{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.08rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.08rem}.line{fill:none;stroke:currentColor;stroke-width:.08rem}.point{fill:currentColor}</style>
<text x="16" y="25" text-anchor="start" class="label" style="font-size:1rem;font-weight:700">The offset travels with the layout</text>
<text x="16" y="56" text-anchor="start" class="mono" style="font-size:.875rem">one player: base 0x12340000</text>
<rect class="shape" x="32" y="76" width="416" height="45"/>
<rect class="shape" x="299" y="76" width="112" height="45" style="stroke-width:.15rem"/>
<text x="355" y="105" text-anchor="middle" class="label" style="font-size:.875rem;font-weight:700">yaw</text>
<path class="line" d="M32 129L299 129"/>
<path class="line" d="M32 123L32 135"/>
<path class="line" d="M299 123L299 135"/>
<text x="166" y="149" text-anchor="middle" class="mono" style="font-size:.875rem">same distance: +0x40</text>
<rect class="shape" x="32" y="193" width="416" height="45"/>
<rect class="shape" x="299" y="193" width="112" height="45" style="stroke-width:.15rem"/>
<text x="355" y="222" text-anchor="middle" class="label" style="font-size:.875rem;font-weight:700">yaw</text>
<path class="line" d="M32 246L299 246"/>
<path class="line" d="M32 240L32 252"/>
<path class="line" d="M299 240L299 252"/>
<text x="166" y="266" text-anchor="middle" class="mono" style="font-size:.875rem">same distance: +0x40</text>
<text x="354" y="147" text-anchor="middle" class="mono" style="font-size:.875rem">0x12340040</text>
<text x="16" y="177" text-anchor="start" class="label" style="font-size:.875rem">another player: a different base</text>
<text x="16" y="281" text-anchor="start" class="label" style="font-size:.8125rem">A new base changes the address, not the field distance.</text>
</svg>
