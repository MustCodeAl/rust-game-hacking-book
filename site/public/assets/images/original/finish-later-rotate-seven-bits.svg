<svg xmlns="http://www.w3.org/2000/svg" width="480" height="311" viewBox="0 0 480 311" role="img" aria-labelledby="title desc">
<title id="title">The high seven bits wrap to the low end</title><desc id="desc">For value 100 and key 0x5A3C96E1, XOR produces 0x5A3C9685. Rotating its 32 bits left by seven moves the high seven bits to the low end, giving 0x1E4B42AD stored as little-endian bytes AD 42 4B 1E. The inverse recovers 100.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/13/04.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">The high seven bits wrap to the low end</text>
<text x="16" y="58" class="mono" text-anchor="start">100 XOR 0x5A3C96E1 = 0x5A3C9685</text><text x="16" y="91" class="sub" text-anchor="start">high 7 bits</text><text x="145" y="91" class="sub" text-anchor="start">remaining 25 bits</text><rect x="16" y="105" width="98" height="38" rx="0" class="hatch"/><text x="65" y="129" class="mono halo" text-anchor="middle">0101101</text><rect x="114" y="105" width="350" height="38" rx="0" class="box"/><text x="289" y="129" class="mono" text-anchor="middle">0001111001001011010000101</text><path d="M288 147L190 187" class="line" marker-end="url(#arrow)"/><path d="M65 148C65 170 416 166 416 187" class="line" marker-end="url(#arrow)"/><text x="16" y="174" class="sub" text-anchor="start">rotate left 7</text><rect x="16" y="195" width="350" height="38" rx="0" class="box"/><text x="191" y="219" class="mono" text-anchor="middle">0001111001001011010000101</text><rect x="366" y="195" width="98" height="38" rx="0" class="hatch"/><text x="415" y="219" class="mono halo" text-anchor="middle">0101101</text><text x="16" y="263" class="mono" text-anchor="start">Stored: 0x1E4B42AD · bytes AD 42 4B 1E</text><text x="16" y="288" class="sub" text-anchor="start">Rotate right 7, then XOR the key, to recover 100.</text>
</svg>
