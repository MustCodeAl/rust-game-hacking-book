<svg xmlns="http://www.w3.org/2000/svg" width="480" height="310" viewBox="0 0 480 310" role="img" aria-labelledby="title desc">
<title id="title">A name check misses the shared effect</title><desc id="desc">The toy read-only policy blocks WriteMemory by name but allows ApplyPatch to change state. Both commands have a state-changing effect, so the repaired invariant must classify the effect instead of only a command name.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/11/04.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
