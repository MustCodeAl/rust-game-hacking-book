<text x="16" y="26" class="title" text-anchor="start">A name check misses the shared effect</text>
<text x="16" y="61" class="strong" text-anchor="start">Weak read-only policy</text><rect x="16" y="82" width="154" height="46" rx="5" class="box"/><text x="93" y="110" class="mono" text-anchor="middle">WriteMemory</text><path d="M175 105L218 105" class="line" marker-end="url(#arrow)"/><path d="M234 95L254 115M234 115L254 95" class="line"/><text x="279" y="111" class="sub" text-anchor="start">blocked by name</text><rect x="16" y="160" width="154" height="46" rx="5" class="box"/><text x="93" y="188" class="mono" text-anchor="middle">ApplyPatch</text><path d="M175 183L251 183" class="line" marker-end="url(#arrow)"/><rect x="267" y="164" width="43" height="39" rx="0" class="box"/><text x="288.5" y="190.13" class="mono" text-anchor="middle">·</text><rect x="310" y="164" width="43" height="39" rx="0" class="hatch"/><text x="331.5" y="190.13" class="mono halo" text-anchor="middle">·</text><rect x="353" y="164" width="43" height="39" rx="0" class="box"/><text x="374.5" y="190.13" class="mono" text-anchor="middle">·</text><text x="330" y="225" class="strong" text-anchor="middle">state changed</text><text x="16" y="267" class="sub" text-anchor="start">Both commands have a state-changing effect.</text><text x="16" y="288" class="sub" text-anchor="start">The repaired policy checks that effect.</text>
