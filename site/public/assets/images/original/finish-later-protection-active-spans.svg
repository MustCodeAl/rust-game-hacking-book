<svg xmlns="http://www.w3.org/2000/svg" width="480" height="303" viewBox="0 0 480 303" role="img" aria-labelledby="title desc">
<title id="title">Lifetime and privilege are separate</title><desc id="desc">Illustrative boot-managed protection begins at boot and continues beyond game end, reaching the right boundary of the observation window. Session-managed protection starts with the game and stops when it ends. Both may have kernel privilege while active; these are not measured product timelines.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/15/08.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">Lifetime and privilege are separate</text>
<text x="130" y="62" class="sub" text-anchor="start">boot</text><text x="245" y="62" class="sub" text-anchor="start">game starts</text><text x="372" y="62" class="sub" text-anchor="start">game ends</text><path d="M138 73V233M272 73V233M415 73V233" class="dashed"/><text x="16" y="110" class="sub" text-anchor="start">boot-managed</text><rect x="138" y="90" width="313" height="36" rx="0" class="hatch"/><path d="M454 108L464 108" class="line" marker-end="url(#arrow)"/><text x="16" y="183" class="sub" text-anchor="start">session-managed</text><rect x="272" y="163" width="143" height="36" rx="0" class="hatch"/><path d="M464 76V218" class="dashed"/><text x="464" y="238" class="sub" text-anchor="end">observation window ends</text><text x="16" y="260" class="sub" text-anchor="start">Illustrative active spans; both can run in kernel mode.</text><text x="16" y="281" class="sub" text-anchor="start">Duration describes when, privilege describes access.</text>
</svg>
