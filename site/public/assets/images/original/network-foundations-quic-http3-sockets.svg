<svg xmlns="http://www.w3.org/2000/svg" width="480" height="454" viewBox="0 0 480 454" role="img" aria-labelledby="title desc">
<title id="title">Two message paths, two socket types</title><desc id="desc">The classic RFC 6455 secure WebSocket path uses WebSocket message framing after HTTP/1.1 Upgrade, then TLS and a TCP socket. HTTP/3 frames travel over QUIC version 1 streams with TLS 1.3 connection security and a UDP socket. Both continue through IP and link delivery. Later HTTP mappings for WebSocket are outside this classic left branch.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-09. Public domain dedication: CC0 1.0 Universal. Source is this original SVG markup. Conceptual teaching model, not a vendor deployment or literal wire-format specification. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:1rem}.title{font-size:1.125rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.875rem}.mono{font-family:ui-monospace,monospace;font-size:.875rem}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.group{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dash{fill:none;stroke:currentColor;stroke-width:.1rem;stroke-dasharray:.3rem .2rem}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="currentColor"/></marker></defs>
<text x="16" y="29" class="title" text-anchor="start">Two message paths, two socket types</text>
<text x="16" y="64" class="strong" text-anchor="start">Classic wss (RFC 6455)</text>
<text x="264" y="64" class="strong" text-anchor="start">HTTP/3</text>
<rect x="32" y="88" width="184" height="56" rx="5" class="box"/>
<text x="124.0" y="110.5" class="strong" text-anchor="middle">WebSocket frames</text>
<text x="124.0" y="131.5" class="sub" text-anchor="middle">after HTTP Upgrade</text>
<rect x="264" y="88" width="184" height="56" rx="5" class="box"/>
<text x="356.0" y="110.5" class="strong" text-anchor="middle">HTTP/3 frames</text>
<text x="356.0" y="131.5" class="sub" text-anchor="middle">on QUIC streams</text>
<path d="M124 144V180" class="line" marker-end="url(#arrow)"/>
<path d="M356 144V180" class="line" marker-end="url(#arrow)"/>
<rect x="32" y="180" width="184" height="64" rx="5" class="box"/>
<text x="124.0" y="206.5" class="strong" text-anchor="middle">TLS for wss</text>
<text x="124.0" y="227.5" class="sub" text-anchor="middle">protects the channel</text>
<rect x="264" y="180" width="184" height="64" rx="5" class="box"/>
<text x="356.0" y="206.5" class="strong" text-anchor="middle">QUIC v1</text>
<text x="356.0" y="227.5" class="sub" text-anchor="middle">TLS 1.3 security</text>
<path d="M124 244V280" class="line" marker-end="url(#arrow)"/>
<path d="M356 244V280" class="line" marker-end="url(#arrow)"/>
<rect x="32" y="280" width="184" height="56" rx="5" class="box"/>
<text x="124.0" y="302.5" class="strong" text-anchor="middle">TCP socket</text>
<text x="124.0" y="323.5" class="sub" text-anchor="middle">ordered byte stream</text>
<rect x="264" y="280" width="184" height="56" rx="5" class="box"/>
<text x="356.0" y="302.5" class="strong" text-anchor="middle">UDP socket</text>
<text x="356.0" y="323.5" class="sub" text-anchor="middle">QUIC adds recovery</text>
<path d="M124 336V380" class="line" marker-end="url(#arrow)"/>
<path d="M356 336V380" class="line" marker-end="url(#arrow)"/>
<rect x="16" y="380" width="448" height="48" rx="5" class="box"/>
<text x="240.0" y="409.0" class="strong" text-anchor="middle">IP packets and link delivery</text>
<text x="16" y="446" class="sub" text-anchor="start">Sockets are local endpoints, not message protocols.</text>
</svg>
