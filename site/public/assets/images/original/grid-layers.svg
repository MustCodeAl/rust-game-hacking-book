<title id="title">Grid coordinates join different map layers</title><desc id="description">A three-column, two-row terrain grid and a separate player-visibility grid both highlight tile (2,1). Row-major indexing puts it at 1 times 3 plus 2, or index 5. Terrain and fog symbols are illustrative.</desc>
<metadata>Original geometric and pixel artwork. Public domain dedication: CC0 1.0 Universal.</metadata>
