<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker></defs>
<text class="title" x="12" y="24">Successful translation is only one check</text>
<g><rect x="12" y="76" width="128" height="64" rx="6" class="box"/><text x="76" y="99" text-anchor="middle" class="node">Capture identity</text><text x="76" y="117" text-anchor="middle" class="node">source + time</text></g><g><rect x="176" y="76" width="128" height="64" rx="6" class="box"/><text x="240" y="99" text-anchor="middle" class="node">Address space</text><text x="240" y="117" text-anchor="middle" class="node">correct root</text></g><g><rect x="340" y="76" width="128" height="64" rx="6" class="box"/><text x="404" y="99" text-anchor="middle" class="node">Object evidence</text><text x="404" y="117" text-anchor="middle" class="node">layout + lifetime</text></g><path class="arrow" d="M145 108H169M309 108H333" marker-end="url(#arrow)"/>
<text x="12" y="170">A valid translation can still point to the wrong object or process.</text>
