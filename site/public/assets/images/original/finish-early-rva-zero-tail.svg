<svg xmlns="http://www.w3.org/2000/svg" width="480" height="311" viewBox="0 0 480 311" role="img" aria-labelledby="title desc">
<title id="title">The mapped tail has no file byte</title><desc id="desc">The raw section spans file offsets 0x0600 through 0x0E00, length 0x800. Its virtual span is RVA 0x2000 through 0x2900, length 0x900. Offset 0x340 maps RVA 0x2340 to file offset 0x0940. RVA 0x2880 has offset 0x880 in the virtual tail, past raw size 0x800, and has no file byte. Bar lengths and point distances share one scale.</desc>
<metadata>Original Game Hacking Academy geometric teaching artwork. Dedicated to the public domain under CC0 1.0 Universal. No third-party imagery or fonts embedded. Reproduce with site/scripts/make-finish-early-art.py.</metadata>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" stroke="currentColor" stroke-width=".04rem"/></pattern></defs>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{fill:currentColor;font-family:Arial,Helvetica,sans-serif}.mono{font-family:"Courier New",monospace}.shape{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.08rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.08rem}.line{fill:none;stroke:currentColor;stroke-width:.08rem}.point{fill:currentColor}</style>
<text x="16" y="25" text-anchor="start" class="label" style="font-size:1rem;font-weight:700">The mapped tail has no file byte</text>
<text x="16" y="54" text-anchor="start" class="label" style="font-size:.875rem;font-weight:700">file bytes: length 0x800</text>
<rect class="shape" x="48" y="82" width="320" height="44"/>
<path class="line" d="M178 82L178 126" style="stroke-width:.15rem"/>
<text x="178" y="75" text-anchor="middle" class="mono" style="font-size:.875rem">0x0940</text>
<text x="48" y="149" text-anchor="start" class="mono" style="font-size:.8125rem">0x0600</text>
<text x="368" y="149" text-anchor="end" class="mono" style="font-size:.8125rem">0x0E00</text>
<text x="16" y="183" text-anchor="start" class="label" style="font-size:.875rem;font-weight:700">mapped bytes: length 0x900</text>
<rect class="shape" x="48" y="207" width="320" height="44"/>
<rect class="hatch" x="368" y="207" width="40" height="44"/>
<path class="line" d="M178 207L178 251" style="stroke-width:.15rem"/>
<path class="line" d="M388 207L388 251" style="stroke-width:.15rem"/>
<path class="line" d="M178 130L178 203" stroke-dasharray="4 3"/>
<text x="191" y="164" text-anchor="start" class="mono" style="font-size:.8125rem">same +0x340</text>
<text x="48" y="275" text-anchor="start" class="mono" style="font-size:.8125rem">0x2000</text>
<text x="178" y="275" text-anchor="middle" class="mono" style="font-size:.8125rem">0x2340</text>
<text x="388" y="275" text-anchor="middle" class="mono" style="font-size:.8125rem">0x2880</text>
<text x="408" y="200" text-anchor="end" class="mono" style="font-size:.8125rem">end 0x2900</text>
<text x="16" y="303" text-anchor="start" class="label" style="font-size:.875rem">The hatched 0x100 tail is supplied as zeros.</text>
</svg>
