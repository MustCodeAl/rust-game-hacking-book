<text x="256.0" y="363.5" class="strong" text-anchor="middle">CDN edge</text>
<text x="256.0" y="384.5" class="sub" text-anchor="middle">eligible copy</text>
<rect x="352" y="334" width="112" height="70" rx="5" class="box"/>
<text x="408.0" y="363.5" class="strong" text-anchor="middle">Origin</text>
<text x="408.0" y="384.5" class="sub" text-anchor="middle">asset file</text>
