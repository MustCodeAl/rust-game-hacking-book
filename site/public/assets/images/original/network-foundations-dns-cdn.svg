<svg xmlns="http://www.w3.org/2000/svg" width="480" height="454" viewBox="0 0 480 454" role="img" aria-labelledby="title desc">
<title id="title">Name lookup is not asset delivery</title><desc id="desc">DHCP supplies the IPv4 client configuration. The client asks a DNS resolver about assets.example and obtains an address. A later HTTPS asset request goes to the CDN edge; an eligible cached copy is returned or a cache miss fetches the asset from origin storage.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-09. Public domain dedication: CC0 1.0 Universal. Source is this original SVG markup. Conceptual teaching model, not a vendor deployment or literal wire-format specification. No third-party image assets.</metadata>
