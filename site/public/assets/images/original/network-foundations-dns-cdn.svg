<text x="367.0" y="109.5" class="sub" text-anchor="middle">lease + options</text>
<path d="M286 94H176" class="line" marker-end="url(#arrow)"/>
<text x="16" y="166" class="strong" text-anchor="start">1. Resolve assets.example</text>
<rect x="16" y="188" width="128" height="70" rx="5" class="box"/>
<text x="80.0" y="217.5" class="strong" text-anchor="middle">Client</text>
<text x="80.0" y="238.5" class="sub" text-anchor="middle">assets.example</text>
<rect x="288" y="188" width="176" height="70" rx="5" class="box"/>
<text x="376.0" y="207.0" class="strong" text-anchor="middle">DNS resolver</text>
<text x="376.0" y="228.0" class="sub" text-anchor="middle">cached or queried</text>
<text x="376.0" y="249.0" class="sub" text-anchor="middle">name → address</text>
<path d="M144 211H288" class="line" marker-end="url(#arrow)"/>
<path d="M288 243H144" class="line" marker-end="url(#arrow)"/>
<text x="182" y="198" class="sub" text-anchor="start">lookup</text>
<text x="182" y="274" class="sub" text-anchor="start">answer</text>
<text x="16" y="310" class="strong" text-anchor="start">2. Fetch the map over HTTPS</text>
<rect x="16" y="334" width="128" height="70" rx="5" class="box"/>
<text x="80.0" y="363.5" class="strong" text-anchor="middle">Client</text>
<text x="80.0" y="384.5" class="sub" text-anchor="middle">asset request</text>
