<svg xmlns="http://www.w3.org/2000/svg" width="480" height="312" viewBox="0 0 480 312" role="img" aria-labelledby="title desc">
<title id="title">A dump saves one selected instant</title><desc id="desc">A capture point on a timeline produces saved module, thread and stack records. Earlier history is outside that saved state and needs logs or tracing. Missing streams may simply not have been captured.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/10/08.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">A dump saves one selected instant</text>
<path d="M23 66H450" class="line" marker-end="url(#arrow)"/><circle cx="64" cy="66" r="5" class="dot"/><circle cx="171" cy="66" r="5" class="dot"/><circle cx="295" cy="66" r="7" class="open"/><text x="56" y="52" class="sub" text-anchor="start">earlier</text><text x="255" y="52" class="strong" text-anchor="start">capture</text><path d="M295 76V103" class="line" marker-end="url(#arrow)"/><rect x="180" y="111" width="272" height="146" rx="5" class="box"/><text x="193" y="135" class="strong" text-anchor="start">Saved selected state</text><rect x="192" y="157" width="75" height="56" rx="5" class="box"/><path d="M202 177H257M202 188H257M202 199H245" class="line"/><text x="229.5" y="232" class="sub" text-anchor="middle">modules</text><rect x="279" y="157" width="75" height="56" rx="5" class="box"/><path d="M289 177H344M289 188H344M289 199H332" class="line"/><text x="316.5" y="232" class="sub" text-anchor="middle">threads</text><rect x="366" y="157" width="75" height="56" rx="5" class="box"/><path d="M376 177H431M376 188H431M376 199H419" class="line"/><text x="403.5" y="232" class="sub" text-anchor="middle">stacks</text><rect x="18" y="121" width="136" height="97" rx="5" class="dashed"/><text x="29" y="145" class="sub" text-anchor="start">Earlier timeline</text><text x="29" y="170" class="sub" text-anchor="start">needs logs</text><text x="29" y="191" class="sub" text-anchor="start">or an ETW trace</text><text x="16" y="291" class="sub" text-anchor="start">A missing stream may mean “not captured.”</text>
</svg>
