<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340" role="img" aria-labelledby="title desc">
<title id="title">A pointer and its object can live in different places</title>
<desc id="desc">A schematic process contains a thread stack, heap allocations, and module data. A pointer in a callee stack frame refers to object bytes in a heap allocation. Returning ends the frame lifetime; releasing the allocation ends the heap object lifetime. Globals and constants have module or program lifetime. Positions do not describe real Windows region addresses.</desc>
<metadata>Original geometric teaching artwork authored for Game Hacking Academy, 2026-10-09. Public domain dedication: CC0 1.0 Universal, https://creativecommons.org/publicdomain/zero/1.0/. Concept and illustrative values belong to site/src/content/docs/pages/2/05.mdx. No third-party image assets. Diagram dimensions and placements are schematic.</metadata>
