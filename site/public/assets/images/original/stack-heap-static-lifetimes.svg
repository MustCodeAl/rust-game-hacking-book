<text x="16" y="26" class="title" text-anchor="start">A pointer and its object can live in different places</text>
<rect x="16" y="48" width="448" height="224" class="box"/>
<text x="28" y="69" class="sub" text-anchor="start">One process virtual address space</text>
<rect x="32" y="82" width="136" height="174" class="box"/>
<text x="100" y="105" class="key" text-anchor="middle">thread stack</text>
<path d="M32 119H168" class="line"/>
<text x="100" y="143" class="sub" text-anchor="middle">caller frame</text>
<path d="M32 157H168" class="line"/>
<text x="100" y="182" class="sub" text-anchor="middle">callee locals</text>
<text x="100" y="232" class="sub" text-anchor="middle">object pointer</text>
<rect x="264" y="82" width="184" height="76" class="box"/>
<text x="356" y="105" class="key" text-anchor="middle">heap allocation</text>
<text x="356" y="133" class="sub" text-anchor="middle">object bytes</text>
<path d="M168 230C218 230 216 120 260 120" class="line" marker-end="url(#arrow)"/>
<text x="174" y="196" class="sub" text-anchor="start">points to</text>
<rect x="264" y="180" width="184" height="76" class="box"/>
<text x="356" y="203" class="key" text-anchor="middle">module data</text>
<text x="356" y="231" class="sub" text-anchor="middle">globals / constants</text>
<text x="16" y="295" class="sub" text-anchor="start">Return: the current frame ends.</text>
<text x="16" y="316" class="sub" text-anchor="start">Release: the allocated object ends separately.</text>
</svg>
