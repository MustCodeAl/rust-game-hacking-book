<svg xmlns="http://www.w3.org/2000/svg" width="480" height="307" viewBox="0 0 480 307" role="img" aria-labelledby="title desc">
<title id="title">The process contains more than the file</title><desc id="desc">The disk file wesnoth.exe is mapped into a running process. DLLs, a private heap, a thread stack, handles, security state and thread context are additional runtime resources.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/10/01.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
