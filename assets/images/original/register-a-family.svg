text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.9rem}
.title{font-size:1rem;font-weight:700}.key{font-weight:700}.sub{font-size:.82rem}
.mono{font-family:ui-monospace,monospace;font-size:.86rem}
.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}
.line{fill:none;stroke:currentColor;stroke-width:.1rem}
.dash{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}
.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}
.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">One register, several overlapping views</text>
<text x="80" y="56" class="mono" text-anchor="start">63</text>
<text x="272" y="56" class="mono" text-anchor="start">31</text>
<text x="368" y="56" class="mono" text-anchor="start">15</text>
<text x="416" y="56" class="mono" text-anchor="start">7</text>
<text x="464" y="56" class="mono" text-anchor="end">0</text>
<text x="16" y="91" class="mono" text-anchor="start">RAX</text>
<rect x="80" y="68" width="384" height="36" class="box"/>
<text x="272" y="91" class="mono" text-anchor="middle">64 bits</text>
<text x="16" y="139" class="mono" text-anchor="start">EAX</text>
<rect x="272" y="116" width="192" height="36" class="box"/>
<text x="368" y="139" class="mono" text-anchor="middle">low 32 bits</text>
<text x="16" y="187" class="mono" text-anchor="start">AX</text>
<rect x="368" y="164" width="96" height="36" class="box"/>
<text x="416" y="187" class="mono" text-anchor="middle">16 bits</text>
<text x="16" y="235" class="mono" text-anchor="start">AH / AL</text>
<rect x="368" y="212" width="48" height="36" class="box"/>
<rect x="416" y="212" width="48" height="36" class="box"/>
<text x="392" y="235" class="mono" text-anchor="middle">AH</text>
<text x="440" y="235" class="mono" text-anchor="middle">AL</text>
<text x="16" y="279" class="sub" text-anchor="start">An EAX write clears RAX bits 63–32 in 64-bit mode.</text>
<text x="16" y="302" class="sub" text-anchor="start">An AX, AH, or AL write changes only its own bits.</text>
</svg>
