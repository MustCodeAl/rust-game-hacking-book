<svg xmlns="http://www.w3.org/2000/svg" width="480" height="326" viewBox="0 0 480 326" role="img" aria-labelledby="title desc">
<title id="title">One register, several overlapping views</title>
<desc id="desc">In 64-bit mode RAX contains bits 63 through 0. EAX selects bits 31 through 0, AX bits 15 through 0, AH bits 15 through 8, and AL bits 7 through 0. EAX writes zero the upper half of RAX; AX, AH, and AL writes preserve bits outside their smaller ranges. The course 32-bit target uses EAX as the full-width register.</desc>
<metadata>Original geometric teaching artwork authored for Game Hacking Academy, 2026-10-09. Public domain dedication: CC0 1.0 Universal, https://creativecommons.org/publicdomain/zero/1.0/. Concept and illustrative values belong to site/src/content/docs/pages/2/04.mdx. No third-party image assets. Diagram dimensions and placements are schematic.</metadata>
