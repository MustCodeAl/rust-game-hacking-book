<svg xmlns="http://www.w3.org/2000/svg" width="480" height="337" viewBox="0 0 480 337" role="img" aria-labelledby="title desc">
<title id="title">Follow two pointers to Present</title><desc id="desc">The swap-chain object at 0x000001F48A200000 supplies vtable pointer 0x00007FFA1C305000. In this 64-bit example, slot 8 is eight times eight bytes, offset 0x40, giving slot address 0x00007FFA1C305040. Reading that slot yields function address 0x00007FFA1C289A10. Slot spacing is schematic.</desc>
<metadata>Original Game Hacking Academy geometric teaching artwork. Dedicated to the public domain under CC0 1.0 Universal. No third-party imagery or fonts embedded. Reproduce with site/scripts/make-finish-early-art.py.</metadata>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" stroke="currentColor" stroke-width=".04rem"/></pattern></defs>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{fill:currentColor;font-family:Arial,Helvetica,sans-serif}.mono{font-family:"Courier New",monospace}.shape{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.08rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.08rem}.line{fill:none;stroke:currentColor;stroke-width:.08rem}.point{fill:currentColor}</style>
<text x="16" y="25" text-anchor="start" class="label" style="font-size:1rem;font-weight:700">Follow two pointers to Present</text>
<rect class="shape" x="16" y="61" width="194" height="104"/>
<text x="113" y="84" text-anchor="middle" class="label" style="font-size:.875rem;font-weight:700">swap-chain object</text>
<text x="113" y="109" text-anchor="middle" class="mono" style="font-size:.8125rem">0x000001F48A200000</text>
<text x="113" y="145" text-anchor="middle" class="label" style="font-size:.75rem">first field: vtable pointer</text>
<rect class="shape" x="250" y="61" width="214" height="130"/>
<text x="357" y="84" text-anchor="middle" class="label" style="font-size:.875rem;font-weight:700">vtable</text>
<text x="357" y="109" text-anchor="middle" class="mono" style="font-size:.8125rem">0x00007FFA1C305000</text>
<path class="line" d="M265 124L449 124" stroke-dasharray="4 3"/>
<rect class="shape" x="264" y="143" width="186" height="37" style="stroke-width:.15rem"/>
<text x="357" y="168" text-anchor="middle" class="label" style="font-size:.8125rem">slot 8: function pointer</text>
<path class="line" d="M213 130L244 130"/>
<polygon fill="currentColor" points="244,130 237.00,127.00 237.00,133.00"/>
<text x="16" y="205" text-anchor="start" class="mono" style="font-size:.8125rem">slot address: 0x00007FFA1C305040</text>
<text x="16" y="226" text-anchor="start" class="mono" style="font-size:.8125rem">8 slots × 8 bytes = 0x40</text>
<path class="line" d="M421 194L421 245"/>
<polygon fill="currentColor" points="421,245 424.00,238.00 418.00,238.00"/>
<rect class="shape" x="144" y="251" width="320" height="59" style="stroke-width:.15rem"/>
<text x="304" y="275" text-anchor="middle" class="label" style="font-size:.875rem;font-weight:700">Present implementation</text>
<text x="304" y="299" text-anchor="middle" class="mono" style="font-size:.875rem">0x00007FFA1C289A10</text>
<text x="16" y="329" text-anchor="start" class="label" style="font-size:.8125rem">The index is fixed; this implementation supplies the address.</text>
</svg>
