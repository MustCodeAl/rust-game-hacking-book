<text x="16" y="62" class="sub" text-anchor="start">Separate call examples</text><rect x="16" y="80" width="194" height="48" rx="5" class="box"/><text x="113" y="110" class="mono" text-anchor="middle">log(&quot;sample&quot;)</text><path d="M214 104L258 104" class="line" marker-end="url(#arrow)"/><rect x="265" y="80" width="199" height="48" rx="5" class="box"/><text x="364" y="110" class="mono" text-anchor="middle">String → host log</text><rect x="16" y="171" width="194" height="48" rx="5" class="box"/><text x="113" y="201" class="mono" text-anchor="middle">log({})</text><path d="M214 195L258 195" class="line" marker-end="url(#arrow)"/><rect x="265" y="171" width="199" height="48" rx="5" class="dashed"/><text x="364" y="201" class="strong" text-anchor="middle">Lua type error</text><text x="16" y="153" class="sub" text-anchor="start">The registered callback requires a String.</text><text x="16" y="263" class="sub" text-anchor="start">Value conversion happens at the boundary.</text>
