<title id="title">The bridge checks the argument type</title><desc id="desc">For the registered log callback requiring a Rust String, a separate illustrative log(&quot;sample&quot;) call reaches the host. Passing a table as log({}) produces a Lua type error instead of an unchecked cast.</desc>
