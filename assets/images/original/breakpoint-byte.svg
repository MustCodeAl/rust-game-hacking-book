<svg xmlns="http://www.w3.org/2000/svg" width="480" height="190" viewBox="0 0 480 190" role="img" aria-labelledby="t d"><title id="t">A software breakpoint replaces one byte</title><desc id="d">An instruction starts with the byte 8B. The debugger saves that byte and writes CC in its place. When the CC runs the program stops, and the debugger restores 8B.</desc><metadata>Original geometric artwork. Public domain dedication: CC0 1.0 Universal.</metadata><style>text{font-family:Arial,Helvetica,sans-serif;fill:#25343d}.m{font-family:Menlo,Consolas,monospace}.s{fill:#63727c}</style><rect width="480" height="190" fill="#fff"/><text x="20" y="26" font-size="16" font-weight="700">A breakpoint swaps one byte, then puts it back</text>
<g class="m" font-size="16" text-anchor="middle"><text x="20" y="62" text-anchor="start" font-size="12" class="s">before</text><rect x="100" y="44" width="60" height="30" fill="#e2f0f5" stroke="#4388aa"/><text x="130" y="65">8B</text><rect x="160" y="44" width="60" height="30" fill="#e2f0f5" stroke="#4388aa"/><text x="190" y="65">45</text><rect x="220" y="44" width="60" height="30" fill="#e2f0f5" stroke="#4388aa"/><text x="250" y="65">08</text>
<text x="20" y="112" text-anchor="start" font-size="12" class="s">while set</text><rect x="100" y="94" width="60" height="30" fill="#fceddf" stroke="#bd592c" stroke-width="2"/><text x="130" y="115">CC</text><rect x="160" y="94" width="60" height="30" fill="#e2f0f5" stroke="#4388aa"/><text x="190" y="115">45</text><rect x="220" y="94" width="60" height="30" fill="#e2f0f5" stroke="#4388aa"/><text x="250" y="115">08</text></g>
<text x="300" y="64" font-size="12">original byte</text><text x="300" y="84" font-size="12" class="s">saved by the debugger</text><text x="300" y="112" font-size="12">CC stops the program</text><text x="300" y="132" font-size="12" class="s">the debugger puts 8B back</text>
<text x="20" y="168" font-size="13">The program never sees the swap if the debugger restores the byte first.</text></svg>
