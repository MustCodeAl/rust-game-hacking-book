<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200" role="img" aria-labelledby="t d"><title id="t">Four characters become five UTF-8 bytes</title><desc id="d">The word café has four characters. The letters c, a, and f use one byte each: 63, 61, and 66. The letter é uses two bytes: C3 and A9. The total is five bytes.</desc><metadata>Original geometric artwork. Public domain dedication: CC0 1.0 Universal.</metadata><style>text{font-family:Arial,Helvetica,sans-serif;fill:#25343d}.m{font-family:Menlo,Consolas,monospace}</style><rect width="480" height="200" fill="#fff"/><text x="20" y="26" font-size="16" font-weight="700">4 characters, 5 bytes</text>
<g font-size="26" text-anchor="middle"><text x="70" y="75">c</text><text x="150" y="75">a</text><text x="230" y="75">f</text><text x="340" y="75">é</text></g>
<g stroke="#63727c" fill="none" stroke-width="1.4"><path d="M70 88V108"/><path d="M150 88V108"/><path d="M230 88V108"/><path d="M340 88L310 108M340 88L370 108"/></g>
<g class="m" font-size="18" text-anchor="middle"><rect x="46" y="110" width="48" height="36" fill="#e2f0f5" stroke="#4388aa"/><text x="70" y="134">63</text><rect x="126" y="110" width="48" height="36" fill="#e2f0f5" stroke="#4388aa"/><text x="150" y="134">61</text><rect x="206" y="110" width="48" height="36" fill="#e2f0f5" stroke="#4388aa"/><text x="230" y="134">66</text><rect x="286" y="110" width="48" height="36" fill="#fceddf" stroke="#bd592c" stroke-width="2"/><text x="310" y="134">C3</text><rect x="346" y="110" width="48" height="36" fill="#fceddf" stroke="#bd592c" stroke-width="2"/><text x="370" y="134">A9</text></g>
<text x="20" y="172" font-size="13" style="fill:#63727c">Plain ASCII letters take one byte each. é needs two,</text><text x="20" y="190" font-size="13" style="fill:#63727c">so a byte count is not a character count.</text></svg>
