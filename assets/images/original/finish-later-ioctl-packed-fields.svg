<svg xmlns="http://www.w3.org/2000/svg" width="480" height="291" viewBox="0 0 480 291" role="img" aria-labelledby="title desc">
<title id="title">Four fields form the control code</title><desc id="desc">The toy keypad control code packs device type 0x8000 into bits 31 to 16, read access 1 into bits 15 to 14, function 0x801 into bits 13 to 2, and buffered method 0 into bits 1 to 0. The shifted contributions sum to 0x80006004.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/14/08.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">Four fields form the control code</text>
<text x="16" y="60" class="mono" text-anchor="start">31 … 16</text><text x="254" y="60" class="sub" text-anchor="middle">15–14</text><text x="352" y="60" class="mono" text-anchor="middle">13 … 2</text><text x="450" y="60" class="sub" text-anchor="middle">1–0</text><rect x="16" y="76" width="224" height="40" rx="5" class="box"/><rect x="240" y="76" width="28" height="40" rx="0" class="hatch"/><rect x="268" y="76" width="168" height="40" rx="5" class="box"/><rect x="436" y="76" width="28" height="40" rx="0" class="hatch"/><text x="128" y="102" class="mono" text-anchor="middle">device 0x8000</text><text x="352" y="102" class="sub" text-anchor="middle">function 0x801</text><text x="16" y="149" class="mono" text-anchor="start">device &lt;&lt; 16</text><text x="270" y="149" class="mono" text-anchor="start">0x8000_0000</text><text x="16" y="176" class="mono" text-anchor="start">read access 1 &lt;&lt; 14</text><text x="270" y="176" class="mono" text-anchor="start">0x0000_4000</text><text x="16" y="203" class="mono" text-anchor="start">function 0x801 &lt;&lt; 2</text><text x="270" y="203" class="mono" text-anchor="start">0x0000_2004</text><text x="16" y="230" class="mono" text-anchor="start">buffered method 0</text><text x="270" y="230" class="mono" text-anchor="start">0x0000_0000</text><path d="M265 242H464" class="line"/><text x="270" y="269" class="mono" text-anchor="start">0x8000_6004</text>
</svg>
