<svg xmlns="http://www.w3.org/2000/svg" width="480" height="466" viewBox="0 0 480 466" role="img" aria-labelledby="title desc">
<title id="title">Linked code still needs a file-to-image map</title>
<desc id="desc">Static linking copies the needed library implementation into an output module. DLL linking keeps the implementation in a separately mapped DLL and connects calls through imports; both images live in the calling process. In a separate schematic PE section example, raw file offset 0x400 corresponds to RVA 0x1000. File byte 0x520 is 0x120 bytes into that section, giving RVA 0x1120 and live virtual address 0x00401120 at module base 0x00400000. PE32+ has no BaseOfData field.</desc>
<metadata>Original geometric teaching artwork authored for Game Hacking Academy, 2026-10-09. Public domain dedication: CC0 1.0 Universal, https://creativecommons.org/publicdomain/zero/1.0/. Concept and illustrative values belong to site/src/content/docs/pages/7/01.mdx. No third-party image assets. Diagram dimensions and placements are schematic.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}
text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.9rem}
.title{font-size:1rem;font-weight:700}.key{font-weight:700}.sub{font-size:.82rem}
.mono{font-family:ui-monospace,monospace;font-size:.86rem}
.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}
.line{fill:none;stroke:currentColor;stroke-width:.1rem}
.dash{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}
.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}
.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">Linked code still needs a file-to-image map</text>
<rect x="16" y="48" width="216" height="170" class="box"/>
<text x="28" y="72" class="key" text-anchor="start">Static library</text>
<text x="28" y="97" class="sub" text-anchor="start">needed implementation</text>
<path d="M124 107V129" class="line" marker-end="url(#arrow)"/>
<rect x="32" y="137" width="184" height="64" class="box"/>
<text x="124" y="160" class="mono" text-anchor="middle">game.exe</text>
<text x="124" y="184" class="sub" text-anchor="middle">contains linked code</text>
<rect x="248" y="48" width="216" height="170" class="box"/>
<text x="260" y="72" class="key" text-anchor="start">DLL linking</text>
<text x="260" y="96" class="sub" text-anchor="start">game.exe has an import</text>
<path d="M356 106V128" class="line" marker-end="url(#arrow)"/>
<rect x="264" y="136" width="184" height="64" class="box"/>
<text x="356" y="160" class="mono" text-anchor="middle">library.dll</text>
<text x="356" y="184" class="sub" text-anchor="middle">separate mapped image</text>
<text x="16" y="242" class="sub" text-anchor="start">At runtime, EXE and DLL are in the same process.</text>
<rect x="16" y="258" width="448" height="142" class="box"/>
<text x="28" y="282" class="key" text-anchor="start">Independent .text section example</text>
<text x="28" y="308" class="mono" text-anchor="start">raw start 0400 ↔ RVA start 1000</text>
<text x="28" y="334" class="mono" text-anchor="start">file 0520 → section +0120 → RVA 1120</text>
<text x="28" y="365" class="mono" text-anchor="start">live base 00400000 + 1120 = VA 00401120</text>
<text x="28" y="389" class="sub" text-anchor="start">A file offset, an RVA, and a VA are different numbers.</text>
<text x="16" y="427" class="sub" text-anchor="start">PE32: BaseOfData at +24; ImageBase at +28.</text>
<text x="16" y="451" class="sub" text-anchor="start">PE32+: no BaseOfData; 8-byte ImageBase at +24.</text>
</svg>
