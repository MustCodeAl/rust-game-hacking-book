<rect class="shape" x="249" y="90" width="98" height="38" rx="15"/>
<text x="298" y="114" class="mono" text-anchor="middle" style="font-size:0.8125rem">Some(4)</text>
<rect class="shape" x="363" y="90" width="98" height="38" rx="15"/>
<text x="412" y="114" class="mono" text-anchor="middle" style="font-size:0.8125rem">Ok(4)</text>
