<svg xmlns="http://www.w3.org/2000/svg" width="480" height="263" viewBox="0 0 480 263" role="img" aria-labelledby="title desc">
<title id="title">A missing value skips the closures</title><desc id="desc">With slot 1 and budget 20, Some(8) maps to Some(16), checked subtraction gives Some(4), and ok_or gives Ok(4). Slot 4 is missing: None passes through map and and_then, then becomes Err(not affordable). These are conceptual variants, not memory layout.</desc>
<metadata>Original Game Hacking Academy geometric teaching artwork. CC0 1.0 Universal. Reproduce with site/scripts/make-foundation-art.py.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{fill:currentColor;font-family:Arial,Helvetica,sans-serif}.mono{font-family:"Courier New",monospace}.shape{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.08rem}.line{fill:none;stroke:currentColor;stroke-width:.08rem}</style>
<text x="16" y="22" style="font-size:1.0000rem;font-weight:700">A missing value skips the closures</text>
<text x="70" y="52" text-anchor="middle" style="font-size:0.6875rem">get + copied</text>
<text x="184" y="52" text-anchor="middle" style="font-size:0.6875rem">map: double</text>
<text x="298" y="52" text-anchor="middle" style="font-size:0.6875rem">and_then: subtract</text>
<text x="412" y="52" text-anchor="middle" style="font-size:0.6875rem">ok_or</text>
<text x="16" y="78" style="font-size:0.7500rem;font-weight:700">slot 1, budget 20</text>
<rect class="shape" x="21" y="90" width="98" height="38" rx="15"/>
