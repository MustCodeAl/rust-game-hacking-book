<svg xmlns="http://www.w3.org/2000/svg" width="480" height="308" viewBox="0 0 480 308" role="img" aria-labelledby="title desc">
<title id="title">An old read can overwrite a new result</title><desc id="desc">Both threads read 1,000 gold. The reward thread writes 1,500, then the purchase thread overwrites it with 700 calculated from the old value. The correct combined result would be 1,200.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/10/06.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">An old read can overwrite a new result</text>
<text x="16" y="57" class="strong" text-anchor="start">Reward thread</text><text x="198" y="57" class="strong" text-anchor="start">Purchase thread</text><text x="428" y="57" class="mono" text-anchor="middle">gold</text><path d="M76 72V217M261 72V217M428 72V217" class="dashed"/><circle cx="76" cy="91" r="5" class="dot"/><text x="19" y="113" class="sub halo" text-anchor="start">read 1,000</text><circle cx="261" cy="91" r="5" class="dot"/><text x="205" y="113" class="sub halo" text-anchor="start">read 1,000</text><text x="19" y="143" class="mono halo" text-anchor="start">+500 → 1,500</text><text x="200" y="143" class="mono halo" text-anchor="start">−300 → 700</text><path d="M80 165L392 165" class="line" marker-end="url(#arrow)"/><rect x="397" y="146" width="67" height="34" rx="5" class="box"/><text x="430" y="169" class="mono" text-anchor="middle">1,500</text><path d="M266 202L392 202" class="line" marker-end="url(#arrow)"/><rect x="397" y="186" width="67" height="50" rx="5" class="dashed"/><text x="430" y="219" class="mono halo" text-anchor="middle">700</text><text x="16" y="264" class="strong" text-anchor="start">Expected: 1,000 + 500 − 300 = 1,200.</text><text x="16" y="286" class="sub" text-anchor="start">The last write overwrites the reward’s result.</text>
</svg>
