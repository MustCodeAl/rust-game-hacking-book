<svg xmlns="http://www.w3.org/2000/svg" width="480" height="292" viewBox="0 0 480 292" role="img" aria-labelledby="title desc">
<title id="title">One scalar lives in a wider register</title><desc id="desc">Each drawn XMM register is 128 bits: the upper 96 bits take three quarters of its width, and the low binary32 float takes one quarter. Legacy MOVSS loading from memory clears the upper 96 bits, while a register-to-register copy preserves them.</desc>
<metadata>Original Game Hacking Academy geometric teaching artwork. Dedicated to the public domain under CC0 1.0 Universal. No third-party imagery or fonts embedded. Reproduce with site/scripts/make-finish-early-art.py.</metadata>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" stroke="currentColor" stroke-width=".04rem"/></pattern></defs>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{fill:currentColor;font-family:Arial,Helvetica,sans-serif}.mono{font-family:"Courier New",monospace}.shape{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.08rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.08rem}.line{fill:none;stroke:currentColor;stroke-width:.08rem}.point{fill:currentColor}</style>
<text x="16" y="25" text-anchor="start" class="label" style="font-size:1rem;font-weight:700">One scalar lives in a wider register</text>
<text x="16" y="56" text-anchor="start" class="label" style="font-size:.875rem">XMM = 128 bits; only the low float is copied</text>
<text x="16" y="85" text-anchor="start" class="label" style="font-size:.875rem;font-weight:700">memory → XMM</text>
<rect class="shape" x="16" y="99" width="336" height="52"/>
<rect class="shape" x="352" y="99" width="112" height="52" style="stroke-width:.15rem"/>
<text x="184" y="131" text-anchor="middle" class="label" style="font-size:.875rem">upper 96 bits become zero</text>
<text x="408" y="121" text-anchor="middle" class="label" style="font-size:.875rem;font-weight:700">low 32</text>
<text x="408" y="140" text-anchor="middle" class="label" style="font-size:.8125rem">one float</text>
<text x="16" y="190" text-anchor="start" class="label" style="font-size:.875rem;font-weight:700">XMM → XMM</text>
<rect class="shape" x="16" y="204" width="336" height="52"/>
<rect class="shape" x="352" y="204" width="112" height="52" style="stroke-width:.15rem"/>
<text x="184" y="236" text-anchor="middle" class="label" style="font-size:.875rem">upper 96 bits stay unchanged</text>
<text x="408" y="226" text-anchor="middle" class="label" style="font-size:.875rem;font-weight:700">low 32</text>
<text x="408" y="245" text-anchor="middle" class="label" style="font-size:.8125rem">one float</text>
<text x="16" y="280" text-anchor="start" class="label" style="font-size:.875rem">Same scalar width; different upper-bit effects.</text>
</svg>
