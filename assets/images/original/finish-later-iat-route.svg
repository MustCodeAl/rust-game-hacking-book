<svg xmlns="http://www.w3.org/2000/svg" width="480" height="278" viewBox="0 0 480 278" role="img" aria-labelledby="title desc">
<title id="title">One slot changes the destination</title><desc id="desc">The same call through the MessageBoxW IAT slot reaches MessageBoxW before installation and hooked_message_box afterward. The replacement calls the saved original, and removal restores the saved slot.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/8/04.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">One slot changes the destination</text>
<text x="16" y="62" class="strong" text-anchor="start">Before</text><rect x="84" y="43" width="108" height="42" rx="5" class="box"/><text x="138" y="69" class="mono" text-anchor="middle">call [IAT]</text><path d="M195 64L225 64" class="line" marker-end="url(#arrow)"/><rect x="232" y="43" width="232" height="42" rx="5" class="box"/><text x="348" y="69" class="mono" text-anchor="middle">slot → MessageBoxW</text><text x="16" y="119" class="strong" text-anchor="start">Hooked</text><rect x="84" y="101" width="108" height="42" rx="5" class="box"/><text x="138" y="127" class="mono" text-anchor="middle">call [IAT]</text><path d="M195 122L225 122" class="line" marker-end="url(#arrow)"/><rect x="232" y="101" width="232" height="42" rx="5" class="box"/><text x="348" y="127" class="mono" text-anchor="middle">slot → replacement</text><path d="M349 146L349 170" class="line" marker-end="url(#arrow)"/><rect x="232" y="178" width="232" height="47" rx="5" class="box"/><text x="348" y="199" class="mono" text-anchor="middle">hooked_message_box</text><text x="348" y="216" class="sub" text-anchor="middle">calls saved MessageBoxW</text><text x="16" y="257" class="sub" text-anchor="start">Dropping the patch owner restores the saved slot.</text>
</svg>
