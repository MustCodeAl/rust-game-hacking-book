<svg xmlns="http://www.w3.org/2000/svg" width="480" height="274" viewBox="0 0 480 274" role="img" aria-labelledby="title desc">
<title id="title">Keep the original byte while setting int3</title><desc id="desc">At illustrative address 0x007CCD91 the original subtraction bytes are 29 42 04. A debugger saves 29, writes CC at the first byte, and restores 29 before stepping the original subtraction. The other two bytes are unchanged.</desc>
<metadata>Original Game Hacking Academy geometric teaching artwork. CC0 1.0 Universal. Reproduce with site/scripts/make-foundation-art.py.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{fill:currentColor;font-family:Arial,Helvetica,sans-serif}.mono{font-family:"Courier New",monospace}.shape{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.08rem}.line{fill:none;stroke:currentColor;stroke-width:.08rem}</style>
<text x="16" y="22" style="font-size:1.0000rem;font-weight:700">Keep the original byte while setting int3</text>
<text x="16" y="50" class="mono" style="font-size:0.7500rem">Instruction starts at 0x007CCD91</text>
<text x="16" y="92" style="font-size:0.7500rem">original</text>
<rect class="shape" x="149" y="67" width="58" height="40" rx="0" style="stroke-width:.15rem"/>
<text x="178" y="93" class="mono" text-anchor="middle" style="font-size:1.0625rem">29</text>
<rect class="shape" x="207" y="67" width="58" height="40" rx="0"/>
<text x="236" y="93" class="mono" text-anchor="middle" style="font-size:1.0625rem">42</text>
<rect class="shape" x="265" y="67" width="58" height="40" rx="0"/>
<text x="294" y="93" class="mono" text-anchor="middle" style="font-size:1.0625rem">04</text>
<text x="16" y="149" style="font-size:0.7500rem">breakpoint set</text>
<rect class="shape" x="149" y="124" width="58" height="40" rx="0" style="stroke-width:.15rem"/>
<text x="178" y="150" class="mono" text-anchor="middle" style="font-size:1.0625rem">CC</text>
<rect class="shape" x="207" y="124" width="58" height="40" rx="0"/>
<text x="236" y="150" class="mono" text-anchor="middle" style="font-size:1.0625rem">42</text>
<rect class="shape" x="265" y="124" width="58" height="40" rx="0"/>
<text x="294" y="150" class="mono" text-anchor="middle" style="font-size:1.0625rem">04</text>
<text x="16" y="206" style="font-size:0.7500rem">restored for step</text>
<rect class="shape" x="149" y="181" width="58" height="40" rx="0" style="stroke-width:.15rem"/>
<text x="178" y="207" class="mono" text-anchor="middle" style="font-size:1.0625rem">29</text>
<rect class="shape" x="207" y="181" width="58" height="40" rx="0"/>
<text x="236" y="207" class="mono" text-anchor="middle" style="font-size:1.0625rem">42</text>
<rect class="shape" x="265" y="181" width="58" height="40" rx="0"/>
<text x="294" y="207" class="mono" text-anchor="middle" style="font-size:1.0625rem">04</text>
<rect class="shape" x="348" y="73" width="112" height="60" rx="0" stroke-dasharray="4 3"/>
<text x="404" y="94" text-anchor="middle" style="font-size:0.7500rem">saved byte</text>
<text x="404" y="119" class="mono" text-anchor="middle" style="font-size:1.1250rem">29</text>
<text x="16" y="246" style="font-size:0.7500rem">CC executes int3 and causes the breakpoint exception.</text>
<text x="16" y="264" style="font-size:0.7500rem">The debugger retains 29 so the original code can resume.</text>
</svg>
