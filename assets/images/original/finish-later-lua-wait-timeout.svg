<svg xmlns="http://www.w3.org/2000/svg" width="480" height="308" viewBox="0 0 480 308" role="img" aria-labelledby="title desc">
<title id="title">One request, then a bounded wait</title><desc id="desc">After sending one selection request, the script waits with 20 ticks. Unconfirmed updates decrement the counter, confirmation returns to Observe, and reaching zero enters Stop rather than sending endlessly.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/12/05.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">One request, then a bounded wait</text>
<rect x="16" y="69" width="134" height="51" rx="5" class="box"/><text x="83" y="94" class="strong" text-anchor="middle">Request once</text><text x="83" y="113" class="sub" text-anchor="middle">wait_ticks = 20</text><path d="M154 95L191 95" class="line" marker-end="url(#arrow)"/><circle cx="251" cy="111" r="48" class="open"/><text x="251" y="104" class="strong" text-anchor="middle">WAIT</text><text x="251" y="125" class="mono" text-anchor="middle">20 → 19 → …</text><path d="M294 84C332 30 348 163 300 137" class="line" marker-end="url(#arrow)"/><text x="351" y="55" class="sub" text-anchor="start">not confirmed:</text><text x="351" y="75" class="sub" text-anchor="start">subtract 1</text><path d="M252 163V209H140" class="line" marker-end="url(#arrow)"/><text x="159" y="195" class="sub" text-anchor="start">confirmed</text><rect x="16" y="189" width="122" height="47" rx="5" class="box"/><text x="77" y="218" class="sub" text-anchor="middle">Observe again</text><path d="M301 135H386V208" class="line" marker-end="url(#arrow)"/><text x="357" y="186" class="sub" text-anchor="start">0 ticks left</text><rect x="337" y="216" width="126" height="44" rx="5" class="box"/><text x="400" y="244" class="strong" text-anchor="middle">STOP</text><text x="16" y="287" class="sub" text-anchor="start">The wait budget gives the script a bounded ending.</text>
</svg>
