<svg xmlns="http://www.w3.org/2000/svg" width="480" height="264" viewBox="0 0 480 264" role="img" aria-labelledby="title desc">
<title id="title">A setting travels as a command</title><desc id="desc">A menu checkbox changes the owned Settings value. A command carries a settings copy through a channel to the worker, which owns process effects and cleanup.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/8/07.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">A setting travels as a command</text>
<rect x="16" y="60" width="147" height="145" rx="5" class="box"/><text x="29" y="83" class="strong" text-anchor="start">Menu</text><rect x="29" y="99" width="18" height="18" rx="5" class="box"/><path d="M32 107L37 112L44 102" class="line"/><text x="56" y="113" class="mono" text-anchor="start">show_names</text><text x="29" y="144" class="mono" text-anchor="start">Settings</text><text x="29" y="168" class="sub" text-anchor="start">ordinary data</text><path d="M165 132L205 132" class="line" marker-end="url(#arrow)"/><rect x="216" y="100" width="92" height="59" rx="5" class="box"/><path d="M226 120H298M226 131H298M226 142H286" class="line"/><text x="262.0" y="178" class="sub" text-anchor="middle">command copy</text><path d="M309 131L343 131" class="line" marker-end="url(#arrow)"/><rect x="350" y="60" width="114" height="145" rx="5" class="box"/><text x="363" y="83" class="strong" text-anchor="start">Worker</text><path d="M378 106a10 10 0 1 0 0 20a10 10 0 1 0 0 -20M386 120L404 138H412V147H420" class="line"/><text x="363" y="169" class="sub" text-anchor="start">owns effects</text><text x="363" y="190" class="sub" text-anchor="start">and cleanup</text><text x="16" y="241" class="sub" text-anchor="start">Painting a checkbox changes settings; the worker acts.</text>
</svg>
