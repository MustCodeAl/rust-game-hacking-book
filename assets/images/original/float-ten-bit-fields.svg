<svg xmlns="http://www.w3.org/2000/svg" width="480" height="310" viewBox="0 0 480 310" role="img" aria-labelledby="title desc">
<title id="title">The same 32 bits, grouped two ways</title><desc id="desc">10.0 as f32 is stored little endian as 00 00 20 41. Read most significant bit first it is sign 0, exponent 10000010 or 130, and fraction 010 followed by twenty zeros. The exponent is 130 minus 127, or 3. The significand is 1.25, giving 1.25 times 2 cubed, or 10.</desc>
<metadata>Original Game Hacking Academy geometric teaching artwork. CC0 1.0 Universal. Reproduce with site/scripts/make-foundation-art.py.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{fill:currentColor;font-family:Arial,Helvetica,sans-serif}.mono{font-family:"Courier New",monospace}.shape{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.08rem}.line{fill:none;stroke:currentColor;stroke-width:.08rem}</style>
<text x="16" y="22" style="font-size:1.0000rem;font-weight:700">The same 32 bits, grouped two ways</text>
<text x="16" y="52" style="font-size:0.7500rem;font-weight:700">Memory: low byte first</text>
<rect class="shape" x="16" y="63" width="112" height="39" rx="0"/>
<text x="72" y="89" class="mono" text-anchor="middle" style="font-size:1.0625rem">00</text>
<text x="72" y="118" class="mono" text-anchor="middle" style="font-size:0.6875rem">+0</text>
<rect class="shape" x="128" y="63" width="112" height="39" rx="0"/>
<text x="184" y="89" class="mono" text-anchor="middle" style="font-size:1.0625rem">00</text>
<text x="184" y="118" class="mono" text-anchor="middle" style="font-size:0.6875rem">+1</text>
<rect class="shape" x="240" y="63" width="112" height="39" rx="0"/>
<text x="296" y="89" class="mono" text-anchor="middle" style="font-size:1.0625rem">20</text>
<text x="296" y="118" class="mono" text-anchor="middle" style="font-size:0.6875rem">+2</text>
<rect class="shape" x="352" y="63" width="112" height="39" rx="0"/>
<text x="408" y="89" class="mono" text-anchor="middle" style="font-size:1.0625rem">41</text>
<text x="408" y="118" class="mono" text-anchor="middle" style="font-size:0.6875rem">+3</text>
<text x="16" y="150" class="mono" style="font-size:0.7500rem">Significant order: 41 20 00 00</text>
<text x="16" y="178" style="font-size:0.6875rem">sign: 1 bit</text>
<text x="132" y="178" style="font-size:0.6875rem">exponent: 8 bits</text>
<text x="277" y="178" style="font-size:0.6875rem">fraction: 23 bits</text>
<rect class="shape" x="16" y="188" width="33" height="36" rx="0"/>
<text x="32.5" y="212" class="mono" text-anchor="middle" style="font-size:0.6875rem">0</text>
<rect class="shape" x="49" y="188" width="126" height="36" rx="0"/>
<text x="112.0" y="212" class="mono" text-anchor="middle" style="font-size:0.6875rem">10000010</text>
<rect class="shape" x="175" y="188" width="289" height="36" rx="0"/>
<text x="319.5" y="212" class="mono" text-anchor="middle" style="font-size:0.6875rem">01000000000000000000000</text>
<text x="16" y="250" style="font-size:0.7500rem">positive; exponent 130 - 127 = 3; fraction = 1/4</text>
<text x="16" y="278" style="font-size:1.0625rem;font-weight:700">(1 + 1/4) × 2³ = 1.25 × 8 = 10.0</text>
<text x="16" y="299" style="font-size:0.6875rem">The field boundaries do not match the byte boundaries.</text>
</svg>
