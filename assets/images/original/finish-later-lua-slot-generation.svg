<svg xmlns="http://www.w3.org/2000/svg" width="480" height="285" viewBox="0 0 480 285" role="img" aria-labelledby="title desc">
<title id="title">Reusing a slot changes its generation</title><desc id="desc">Lua remembers slot 3 at generation 6. After the old entity dies, the host reuses slot 3 at generation 7. The stored generation does not match, so the host rejects the stale handle instead of acting on the new entity.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/12/04.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">Reusing a slot changes its generation</text>
<text x="16" y="60" class="strong" text-anchor="start">Lua remembers</text><rect x="16" y="76" width="174" height="52" rx="5" class="box"/><text x="103" y="108" class="sub" text-anchor="middle">slot 3 · generation 6</text><path d="M195 102L257 102" class="line" marker-end="url(#arrow)"/><rect x="267" y="63" width="197" height="138" rx="5" class="box"/><text x="279" y="87" class="strong" text-anchor="start">Current host slot 3</text><rect x="280" y="102" width="171" height="30" rx="5" class="dashed"/><text x="365" y="123" class="sub" text-anchor="middle">old entity · gen 6</text><path d="M425 109L441 125M425 125L441 109" class="line"/><rect x="280" y="151" width="171" height="32" rx="5" class="box"/><text x="365" y="173" class="sub" text-anchor="middle">new entity · gen 7</text><path d="M363 205V235H218" class="line" marker-end="url(#arrow)"/><text x="16" y="237" class="mono" text-anchor="start">6 ≠ 7</text><text x="128" y="237" class="strong" text-anchor="start">REJECT</text><text x="16" y="263" class="sub" text-anchor="start">Reject the stale pair; keep the new occupant untouched.</text>
</svg>
