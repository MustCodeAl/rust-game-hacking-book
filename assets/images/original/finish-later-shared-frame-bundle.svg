<svg xmlns="http://www.w3.org/2000/svg" width="480" height="296" viewBox="0 0 480 296" role="img" aria-labelledby="title desc">
<title id="title">Camera and players travel together</title><desc id="desc">One owned FrameSnapshot contains players and the camera. Radar and overlay read that same captured set. Sharing the copy does not prove the live game stayed unchanged while capture was in progress.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/8/08.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">Camera and players travel together</text>
<rect x="16" y="58" width="230" height="180" rx="5" class="box"/><text x="28" y="83" class="mono" text-anchor="start">FrameSnapshot</text><rect x="28" y="98" width="91" height="94" rx="5" class="box"/><text x="74" y="119" class="strong" text-anchor="middle">players</text><circle cx="55" cy="143" r="5" class="dot"/><path d="M55 149V169M44 158H66M55 169L44 184M55 169L66 184" class="line"/><circle cx="96" cy="154" r="4" class="dot"/><rect x="130" y="98" width="103" height="94" rx="5" class="box"/><text x="181" y="119" class="strong" text-anchor="middle">camera</text><path d="M155 148L204 126V175Z" class="line"/><circle cx="155" cy="148" r="4" class="dot"/><text x="28" y="218" class="sub" text-anchor="start">one owned capture</text><path d="M250 114L287 91" class="line" marker-end="url(#arrow)"/><path d="M250 178L287 196" class="line" marker-end="url(#arrow)"/><circle cx="355" cy="90" r="48" class="open"/><path d="M309 90H401M355 44V136" class="line"/><circle cx="375" cy="73" r="4" class="dot"/><text x="355" y="156" class="strong" text-anchor="middle">radar</text><rect x="292" y="174" width="124" height="66" rx="5" class="box"/><circle cx="326" cy="204" r="4" class="dot"/><text x="337" y="210" class="sub" text-anchor="start">label</text><text x="353" y="230" class="strong" text-anchor="middle">overlay</text><text x="16" y="275" class="sub" text-anchor="start">Validate capture: a shared copy alone is not atomic.</text>
</svg>
