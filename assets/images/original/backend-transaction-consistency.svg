<svg xmlns="http://www.w3.org/2000/svg" width="480" height="522" viewBox="0 0 480 522" role="img" aria-labelledby="title desc">
<title id="title">Choose guarantees for each action</title><desc id="desc">Purchase P7 atomically debits 300 coins from a balance of 1000, grants one item and records its receipt. After commit a retry returns the existing receipt. Separately, an accepted leaderboard score of 12 can coexist temporarily with a stale derived display of 10 until propagation succeeds.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-09. Public domain dedication: CC0 1.0 Universal. Source is this original SVG markup. Conceptual teaching model, not a vendor deployment or literal wire-format specification. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:1rem}.title{font-size:1.125rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.875rem}.mono{font-family:ui-monospace,monospace;font-size:.875rem}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.group{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dash{fill:none;stroke:currentColor;stroke-width:.1rem;stroke-dasharray:.3rem .2rem}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="currentColor"/></marker></defs>
<text x="16" y="29" class="title" text-anchor="start">Choose guarantees for each action</text>
<text x="16" y="64" class="strong" text-anchor="start">Purchase P7: one item costs 300 coins</text>
<rect x="16" y="83" width="448" height="196" rx="5" class="group"/>
<text x="32" y="110" class="strong" text-anchor="start">One protected database transaction</text>
<rect x="32" y="130" width="192" height="56" rx="5" class="box"/>
<text x="128.0" y="152.5" class="strong" text-anchor="middle">Debit coins</text>
<text x="128.0" y="173.5" class="sub" text-anchor="middle">1,000 → 700</text>
<rect x="256" y="130" width="192" height="56" rx="5" class="box"/>
<text x="352.0" y="152.5" class="strong" text-anchor="middle">Grant item</text>
<text x="352.0" y="173.5" class="sub" text-anchor="middle">0 items → 1 item</text>
<path d="M128 186V204H240V215" class="line"/>
<path d="M352 186V204H240V215" class="line" marker-end="url(#arrow)"/>
<rect x="100" y="216" width="280" height="45" rx="5" class="box"/>
<text x="240.0" y="243.5" class="strong" text-anchor="middle">Record P7 → accepted</text>
<path d="M240 279V307" class="line" marker-end="url(#arrow)"/>
<rect x="16" y="308" width="216" height="56" rx="5" class="box"/>
<text x="124.0" y="330.5" class="strong" text-anchor="middle">Recorded result</text>
<text x="124.0" y="351.5" class="sub" text-anchor="middle">700 coins; 1 item</text>
<rect x="256" y="308" width="208" height="56" rx="5" class="box"/>
<text x="360.0" y="330.5" class="strong" text-anchor="middle">Retry P7</text>
<text x="360.0" y="351.5" class="sub" text-anchor="middle">return its receipt</text>
<path d="M256 336H232" class="line" marker-end="url(#arrow)"/>
<text x="16" y="398" class="strong" text-anchor="start">Separate leaderboard event E9</text>
<rect x="16" y="421" width="132" height="60" rx="5" class="box"/>
<text x="82.0" y="445.5" class="strong" text-anchor="middle">Accepted score</text>
<text x="82.0" y="466.5" class="sub" text-anchor="middle">10 → 12</text>
<rect x="178" y="421" width="128" height="60" rx="5" class="box"/>
<text x="242.0" y="445.5" class="strong" text-anchor="middle">Async update</text>
<text x="242.0" y="466.5" class="sub" text-anchor="middle">may be delayed</text>
<rect x="336" y="421" width="128" height="60" rx="5" class="box"/>
<text x="400.0" y="445.5" class="strong" text-anchor="middle">Display view</text>
<text x="400.0" y="466.5" class="sub" text-anchor="middle">10, later 12</text>
<path d="M148 451H178" class="line" marker-end="url(#arrow)"/>
<path d="M306 451H336" class="line" marker-end="url(#arrow)"/>
<text x="16" y="509" class="sub" text-anchor="start">A stale display cannot authorize another purchase.</text>
</svg>
