<svg xmlns="http://www.w3.org/2000/svg" width="480" height="310" viewBox="0 0 480 310" role="img" aria-labelledby="title desc">
<title id="title">A changed value closes the write gate</title><desc id="desc">A separate snapshot example starts with observed gold 100. Income adds ten, so the fresh snapshot has gold 110. Because one field differs, the full snapshot equality check fails and the requested replacement 888 is not written. This gate reduces stale observations but is not an atomic transaction.</desc>
<metadata>Original Game Hacking Academy geometric teaching artwork. Dedicated to the public domain under CC0 1.0 Universal. No third-party imagery or fonts embedded. Reproduce with site/scripts/make-finish-early-art.py.</metadata>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" stroke="currentColor" stroke-width=".04rem"/></pattern></defs>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{fill:currentColor;font-family:Arial,Helvetica,sans-serif}.mono{font-family:"Courier New",monospace}.shape{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.08rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.08rem}.line{fill:none;stroke:currentColor;stroke-width:.08rem}.point{fill:currentColor}</style>
<text x="16" y="25" text-anchor="start" class="label" style="font-size:1rem;font-weight:700">A changed value closes the write gate</text>
<rect class="shape" x="16" y="64" width="114" height="65"/>
<text x="73" y="88" text-anchor="middle" class="label" style="font-size:.8125rem;font-weight:700">observe</text>
<text x="73" y="115" text-anchor="middle" class="mono" style="font-size:.875rem">gold 100</text>
<rect class="shape" x="184" y="64" width="114" height="65"/>
<text x="241" y="88" text-anchor="middle" class="label" style="font-size:.8125rem;font-weight:700">income +10</text>
<text x="241" y="115" text-anchor="middle" class="mono" style="font-size:.875rem">gold 110</text>
<rect class="shape" x="350" y="64" width="114" height="65"/>
<text x="407" y="88" text-anchor="middle" class="label" style="font-size:.8125rem;font-weight:700">fresh capture</text>
<text x="407" y="115" text-anchor="middle" class="mono" style="font-size:.875rem">gold 110</text>
<path class="line" d="M135 96L177 96"/>
<polygon fill="currentColor" points="177,96 170.00,93.00 170.00,99.00"/>
<path class="line" d="M303 96L342 96"/>
<polygon fill="currentColor" points="342,96 335.00,93.00 335.00,99.00"/>
<rect class="shape" x="16" y="184" width="188" height="62"/>
<text x="110" y="210" text-anchor="middle" class="label" style="font-size:.8125rem">requested replacement</text>
<text x="110" y="234" text-anchor="middle" class="mono" style="font-size:1rem;font-weight:700">888</text>
<rect class="shape" x="285" y="177" width="179" height="72" style="stroke-width:.15rem"/>
<text x="374" y="203" text-anchor="middle" class="label" style="font-size:.875rem;font-weight:700">same snapshot?</text>
<text x="374" y="231" text-anchor="middle" class="mono" style="font-size:1rem;font-weight:700">100 ≠ 110</text>
<path class="line" d="M208 214L279 214"/>
<polygon fill="currentColor" points="279,214 272.00,211.00 272.00,217.00"/>
<path class="line" d="M407 133L407 170"/>
<polygon fill="currentColor" points="407,170 410.00,163.00 404.00,163.00"/>
<path class="line" d="M374 254L374 278"/>
<polygon fill="currentColor" points="374,278 377.00,271.00 371.00,271.00"/>
<text x="374" y="301" text-anchor="middle" class="label" style="font-size:.875rem;font-weight:700">stop; write nothing</text>
<text x="16" y="276" text-anchor="start" class="label" style="font-size:.8125rem">One changed field</text>
<text x="16" y="296" text-anchor="start" class="label" style="font-size:.8125rem">breaks whole-snapshot equality.</text>
</svg>
