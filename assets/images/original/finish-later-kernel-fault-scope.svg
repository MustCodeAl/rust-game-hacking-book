<svg xmlns="http://www.w3.org/2000/svg" width="480" height="347" viewBox="0 0 480 347" role="img" aria-labelledby="title desc">
<title id="title">Fault scope follows authority</title><desc id="desc">Three user-mode processes have separately bounded memory. A user-mode fault usually ends one process. Kernel and driver authority spans mappings, devices, processes and security, so a kernel fault can reach the whole system. This is a conceptual boundary drawing, not a driver experiment.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/11/05.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
