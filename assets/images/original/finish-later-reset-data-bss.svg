<svg xmlns="http://www.w3.org/2000/svg" width="480" height="352" viewBox="0 0 480 352" role="img" aria-labelledby="title desc">
<title id="title">Reset prepares writable memory</title><desc id="desc">In the lesson’s emulated Cortex-M3 board, flash has 256 KiB at 0x00000000 through 0x0003FFFF and SRAM has 64 KiB at 0x20000000 through 0x2000FFFF. Reset startup copies a .data counter initial value 7 from flash to RAM and fills a reserved .bss counter with zero before Rust uses either.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/14/12.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">Reset prepares writable memory</text>
<rect x="16" y="61" width="191" height="184" rx="5" class="box"/><text x="28" y="85" class="strong" text-anchor="start">Flash · 256 KiB</text><text x="28" y="109" class="mono" text-anchor="start">0x0000_0000</text><text x="28" y="129" class="mono" text-anchor="start">… 0x0003_FFFF</text><rect x="29" y="160" width="164" height="49" rx="5" class="box"/><text x="111" y="188" class="sub" text-anchor="middle">.data initial = 7</text><path d="M212 184L267 184" class="line" marker-end="url(#arrow)"/><text x="225" y="165" class="sub" text-anchor="start">copy</text><rect x="278" y="61" width="186" height="234" rx="5" class="box"/><text x="290" y="85" class="strong" text-anchor="start">SRAM · 64 KiB</text><text x="290" y="109" class="mono" text-anchor="start">0x2000_0000</text><text x="290" y="129" class="mono" text-anchor="start">… 0x2000_FFFF</text><rect x="291" y="160" width="160" height="49" rx="5" class="box"/><text x="371" y="188" class="sub" text-anchor="middle">.data counter = 7</text><rect x="291" y="239" width="160" height="39" rx="5" class="box"/><text x="371" y="264" class="sub" text-anchor="middle">.bss counter = 0</text><path d="M232 243H286" class="line" marker-end="url(#arrow)"/><text x="17" y="257" class="sub" text-anchor="start">startup writes zeros</text><text x="16" y="330" class="sub" text-anchor="start">Prepare the RAM ranges before entering Rust code.</text>
</svg>
