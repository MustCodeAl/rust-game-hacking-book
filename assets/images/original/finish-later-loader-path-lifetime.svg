<svg xmlns="http://www.w3.org/2000/svg" width="480" height="278" viewBox="0 0 480 278" role="img" aria-labelledby="title desc">
<title id="title">The path buffer is temporary</title><desc id="desc">The injector copies a NUL-terminated UTF-16 path to the exact course target. LoadLibraryW loads the DLL. After waiting for loading, the injector can release the path buffer and then call gha_start.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/8/02.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">The path buffer is temporary</text>
<rect x="18" y="70" width="130" height="68" rx="5" class="box"/><path d="M28 90H138M28 101H138M28 112H126" class="line"/><text x="83.0" y="157" class="sub" text-anchor="middle">injector: wide path</text><path d="M151 104L182 104" class="line" marker-end="url(#arrow)"/><rect x="190" y="54" width="274" height="172" rx="5" class="box"/><text x="202" y="76" class="strong" text-anchor="start">Exact course target</text><rect x="202" y="92" width="112" height="46" rx="5" class="box"/><text x="258" y="115" class="mono" text-anchor="middle">path + NUL</text><text x="258" y="132" class="sub" text-anchor="middle">temporary buffer</text><path d="M318 114L342 114" class="line" marker-end="url(#arrow)"/><rect x="350" y="92" width="101" height="46" rx="5" class="box"/><text x="400" y="120" class="sub" text-anchor="middle">LoadLibraryW</text><path d="M400 142L400 166" class="line" marker-end="url(#arrow)"/><rect x="346" y="172" width="110" height="34" rx="5" class="box"/><path d="M356 192H446M356 203H446M356 214H434" class="line"/><text x="401.0" y="225" class="sub" text-anchor="middle">loaded DLL</text><text x="20" y="189" class="strong" text-anchor="start">wait for load</text><path d="M145 185L199 185" class="line" marker-end="url(#arrow)"/><path d="M206 172L220 186M206 186L220 172" class="line"/><text x="227" y="185" class="sub" text-anchor="start">release buffer</text><text x="16" y="257" class="sub" text-anchor="start">Loading succeeds first; call gha_start afterward.</text>
