<svg xmlns="http://www.w3.org/2000/svg" width="480" height="292" viewBox="0 0 480 292" role="img" aria-labelledby="title desc">
<title id="title">Both ordinary returns restore the byte</title><desc id="desc">The local ByteGuard saves 75 and writes temporary value 90. Both an early Err(stopped early) and a normal Ok return leave scope, drop the guard and restore 75. This describes ordinary returns from the example, not abrupt process termination.</desc>
<metadata>Original Game Hacking Academy geometric teaching artwork. CC0 1.0 Universal. Reproduce with site/scripts/make-foundation-art.py.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{fill:currentColor;font-family:Arial,Helvetica,sans-serif}.mono{font-family:"Courier New",monospace}.shape{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.08rem}.line{fill:none;stroke:currentColor;stroke-width:.08rem}</style>
<text x="16" y="22" style="font-size:1.0000rem;font-weight:700">Both ordinary returns restore the byte</text>
<rect class="shape" x="16" y="51" width="91" height="49" rx="0"/>
<text x="61.5" y="72" text-anchor="middle" style="font-size:0.7500rem">before</text>
<text x="61.5" y="91" class="mono" text-anchor="middle" style="font-size:1.1250rem">75</text>
<path class="line" d="M110 76L156 76"/>
<polygon fill="currentColor" points="156.00,76.00 149.70,79.04 149.70,72.96"/>
<rect class="shape" x="161" y="51" width="137" height="49" rx="0" style="stroke-width:.15rem"/>
<text x="229.5" y="72" text-anchor="middle" style="font-size:0.7500rem">temporary byte</text>
<text x="229.5" y="91" class="mono" text-anchor="middle" style="font-size:1.1250rem">90</text>
<rect class="shape" x="331" y="51" width="131" height="49" rx="0" stroke-dasharray="4 3"/>
<text x="396.5" y="72" class="mono" text-anchor="middle" style="font-size:0.7500rem">guard.saved</text>
<text x="396.5" y="91" class="mono" text-anchor="middle" style="font-size:1.1250rem">75</text>
<path class="line" d="M229 104L104 144"/>
<polygon fill="currentColor" points="104.00,144.00 109.08,139.18 110.93,144.98"/>
<path class="line" d="M229 104L356 144"/>
<polygon fill="currentColor" points="356.00,144.00 349.07,145.01 350.90,139.20"/>
<text x="104" y="162" class="mono" text-anchor="middle" style="font-size:0.7500rem">Err(&quot;stopped early&quot;)</text>
<text x="356" y="162" class="mono" text-anchor="middle" style="font-size:0.7500rem">Ok(())</text>
<path class="line" d="M104 173L183 205"/>
<polygon fill="currentColor" points="183.00,205.00 176.01,205.46 178.30,199.81"/>
<path class="line" d="M356 173L297 205"/>
<polygon fill="currentColor" points="297.00,205.00 301.09,199.32 303.99,204.67"/>
<rect class="shape" x="160" y="208" width="160" height="49" rx="0" style="stroke-width:.15rem"/>
<text x="240" y="228" text-anchor="middle" style="font-size:0.7500rem">scope ends → Drop</text>
<text x="240" y="248" class="mono" text-anchor="middle" style="font-size:0.7500rem">byte = saved = 75</text>
<text x="16" y="278" style="font-size:0.7500rem">One owner holds the saved value and the cleanup duty.</text>
</svg>
