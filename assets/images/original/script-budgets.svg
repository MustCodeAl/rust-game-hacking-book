<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-labelledby="t d"><title id="t">Seven separate script budgets</title><desc id="d">A small script is not automatically cheap, so a host bounds seven things separately, each with its own cap and reset window: source and bytecode size at script load, Lua memory per script session, VM instructions per update, call frames per call chain, host callbacks per update, wall-clock work per update, and queued actions and logs per update.</desc><metadata>Original geometric artwork. Public domain dedication: CC0 1.0 Universal.</metadata><style>text{font-family:Arial,Helvetica,sans-serif;fill:#25343d}.m{font-family:Menlo,Consolas,monospace}</style><rect width="480" height="270" fill="#fff"/><text x="20" y="26" font-size="16" font-weight="700">Seven budgets, each with its own cap</text>
<g font-size="12" style="fill:#63727c"><text x="20" y="52">Resource</text><text x="200" y="52">its own cap</text><text x="350" y="52">resets every</text></g>
<g font-size="13">
<text x="20" y="76">Source and bytecode</text><text x="20" y="102">Lua-managed memory</text><text x="20" y="128">VM instructions</text><text x="20" y="154">Call frames</text><text x="20" y="180">Host callbacks</text><text x="20" y="206">Wall-clock work</text><text x="20" y="232">Actions and logs</text></g>
<g fill="#e2f0f5" stroke="#4388aa" stroke-width="1.2"><rect x="200" y="62" width="130" height="14"/><rect x="200" y="88" width="130" height="14"/><rect x="200" y="114" width="130" height="14"/><rect x="200" y="140" width="130" height="14"/><rect x="200" y="166" width="130" height="14"/><rect x="200" y="192" width="130" height="14"/><rect x="200" y="218" width="130" height="14"/></g>
<g stroke="#bd592c" stroke-width="3"><path d="M330 58V80"/><path d="M330 84V106"/><path d="M330 110V132"/><path d="M330 136V158"/><path d="M330 162V184"/><path d="M330 188V210"/><path d="M330 214V236"/></g>
<g font-size="13"><text x="350" y="76">script load</text><text x="350" y="102">script session</text><text x="350" y="128">one update</text><text x="350" y="154">one call chain</text><text x="350" y="180">one update</text><text x="350" y="206">one update</text><text x="350" y="232">one update</text></g>
<text x="20" y="258" font-size="13" style="fill:#63727c">When one cap is crossed, record which one stopped the script.</text></svg>
