<title id="title">The client receives selected door state</title><desc id="desc">The server door object contains position, opening state and scheduling data. SendTable selects position and door state for network encoding; RecvTable receives those properties for the client view. Scheduling stays on the server. The drawing is schematic, not a raw Source packet format.</desc>
<metadata>Original Game Hacking Academy geometric teaching artwork. Dedicated to the public domain under CC0 1.0 Universal. No third-party imagery or fonts embedded. Reproduce with site/scripts/make-finish-early-art.py.</metadata>
