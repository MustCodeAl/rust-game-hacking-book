<svg xmlns="http://www.w3.org/2000/svg" width="480" height="316" viewBox="0 0 480 316" role="img" aria-labelledby="title desc">
<title id="title">Three notifications keep one origin</title><desc id="desc">The game log, plugin forward and player reference all describe toy event A. Three notifications still represent one event. A later distinct event B raises the event count to two, without proving statistical independence.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/15/06.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">Three notifications keep one origin</text>
<circle cx="72" cy="135" r="32" class="open"/><text x="72" y="141" class="strong" text-anchor="middle">event A</text><path d="M108 135L171 85" class="line" marker-end="url(#arrow)"/><rect x="179" y="63" width="164" height="44" rx="5" class="box"/><text x="261" y="90" class="sub" text-anchor="middle">game log</text><text x="358" y="90" class="mono" text-anchor="start">A</text><path d="M108 135L171 145" class="line" marker-end="url(#arrow)"/><rect x="179" y="123" width="164" height="44" rx="5" class="box"/><text x="261" y="150" class="sub" text-anchor="middle">plugin forward</text><text x="358" y="150" class="mono" text-anchor="start">A</text><path d="M108 135L171 205" class="line" marker-end="url(#arrow)"/><rect x="179" y="183" width="164" height="44" rx="5" class="box"/><text x="261" y="210" class="sub" text-anchor="middle">player reference</text><text x="358" y="210" class="mono" text-anchor="start">A</text><path d="M382 64H393V226H382" class="line"/><text x="16" y="271" class="sub" text-anchor="start">3 notifications share origin A → 1 observed event.</text><text x="16" y="294" class="sub" text-anchor="start">A later event B makes 2 distinct events.</text>
