<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img" aria-labelledby="title description">
<title id="title">Range and alignment inside a guard view cone</title><desc id="description">A guard at (0,0) faces (1,0). Its cone extends 60 degrees to each side, 120 degrees total, with range 10. Target (4,3) is distance 5. The normalized direction (0.8,0.6) has dot product 0.8 with the facing, above the 0.5 threshold. Walls still require a separate check.</desc>
<metadata>Original geometric and pixel artwork. Public domain dedication: CC0 1.0 Universal.</metadata>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L6 3L0 6Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style>
<rect x="0" y="0" width="480" height="240" fill="#ffffff" stroke="none" stroke-width="1"/><text x="20" y="23" font-size="16" fill="#25343d" font-weight="700" text-anchor="start">A view cone is an angle and a range</text><path d="M60 120L110 33.397A100 100 0 0 1 110 206.603Z" fill="#fceddf" stroke="#bd592c" stroke-width="1.5"/><path d="M60 120L160 120" fill="none" stroke="#63727c" stroke-width="1" stroke-dasharray="3 3"/><path d="M60 120L100 120" fill="none" stroke="#218675" stroke-width="1" stroke-dasharray="3 3"/><path d="M100 120L100 90" fill="none" stroke="#218675" stroke-width="1" stroke-dasharray="3 3"/><path d="M60 120L100 90" fill="none" stroke="#218675" stroke-width="2" marker-end="url(#arrow)"/><path d="M77 90.555A34 34 0 0 1 94 120A34 34 0 0 1 77 149.445" fill="none" stroke="#bd592c" stroke-width="1"/><circle cx="60" cy="120" r="4" fill="#25343d" stroke="none" stroke-width="1"/><circle cx="100" cy="90" r="4" fill="#218675" stroke="none" stroke-width="1"/><text x="19" y="142" font-size="10" fill="#25343d" font-weight="400" text-anchor="start">guard</text><text x="9" y="156" font-size="10" fill="#25343d" font-weight="400" text-anchor="start" class="mono">(0, 0)</text><text x="110" y="82" font-size="11" fill="#25343d" font-weight="400" text-anchor="start" class="mono">(4, 3)</text><text x="108" y="62" font-size="11" fill="#bd592c" font-weight="400" text-anchor="start">60°</text><text x="108" y="184" font-size="11" fill="#bd592c" font-weight="400" text-anchor="start">60°</text><text x="162" y="181" font-size="11" fill="#bd592c" font-weight="400" text-anchor="start">range 10</text><text x="80" y="135" font-size="11" fill="#218675" font-weight="400" text-anchor="start" class="mono">4</text><text x="108" y="114" font-size="11" fill="#218675" font-weight="400" text-anchor="start" class="mono">3</text><text x="77" y="100" font-size="11" fill="#218675" font-weight="400" text-anchor="start" class="mono">5</text><text x="267" y="52" font-size="12" fill="#25343d" font-weight="400" text-anchor="start">Normalize, then compare</text><circle cx="327" cy="123" r="50" fill="none" stroke="#d9e0e5" stroke-width="1.5"/><path d="M277 123L377 123" fill="none" stroke="#d9e0e5" stroke-width="1"/><path d="M327 73L327 173" fill="none" stroke="#d9e0e5" stroke-width="1"/><path d="M327 123L377 123" fill="none" stroke="#25343d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M327 123L367 93" fill="none" stroke="#218675" stroke-width="2" marker-end="url(#arrow)"/><path d="M367 93L367 123" fill="none" stroke="#218675" stroke-width="1" stroke-dasharray="3 3"/><path d="M327 123L367 123" fill="none" stroke="#218675" stroke-width="3"/><circle cx="367" cy="93" r="3.5" fill="#218675" stroke="none" stroke-width="1"/><circle cx="327" cy="123" r="2.5" fill="#25343d" stroke="none" stroke-width="1"/><text x="349" y="79" font-size="11" fill="#218675" font-weight="400" text-anchor="start" class="mono">(0.8, 0.6)</text><text x="382" y="138" font-size="11" fill="#25343d" font-weight="400" text-anchor="start" class="mono">(1, 0)</text><text x="337" y="144" font-size="11" fill="#218675" font-weight="400" text-anchor="start" class="mono">0.8</text><text x="376" y="113" font-size="11" fill="#218675" font-weight="400" text-anchor="start" class="mono">0.6</text><text x="20" y="226" font-size="11.5" fill="#25343d" font-weight="400" text-anchor="start" class="mono">√(4² + 3²) = 5; (0.8, 0.6) · (1, 0) = 0.8 ≥ 0.5</text>
</svg>
