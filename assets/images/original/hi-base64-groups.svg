<svg xmlns="http://www.w3.org/2000/svg" width="480" height="330" viewBox="0 0 480 330" role="img" aria-labelledby="title desc">
  <title id="title">HI: bytes become Base64 groups</title>
  <desc id="desc">The ASCII and UTF-8 bytes for HI are hexadecimal 48 and 49: bits 01001000 and 01001001. Keeping their order and adding two zero pad bits gives six-bit groups 010010, 000100, and 100100. Their decimal indices 18, 4, and 36 select S, E, and k. One equals-sign padding symbol completes SEk=; the added zero bits are not an extra input byte.</desc>
  <metadata>Original geometric teaching artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal, https://creativecommons.org/publicdomain/zero/1.0/. Worked values independently calculated from the bytes of HI and the RFC 4648 alphabet. No third-party image assets.</metadata>
  <style>
    svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}
    text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}
    .title{font-size:1rem;font-weight:700}
    .sub{font-size:.82rem}
    .mono{font-family:ui-monospace,monospace;font-size:.88rem}
    .output{font-family:ui-monospace,monospace;font-size:1.2rem;font-weight:700}
    .box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}
    .line{fill:none;stroke:currentColor;stroke-width:.1rem}
    .hatch{fill:url(#pad-hatch);stroke:currentColor;stroke-width:.09rem}
    .halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker>
    <pattern id="pad-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern>
  </defs>
  <text x="16" y="26" class="title">HI: bytes become Base64 groups</text>
  <text x="112" y="59" class="mono" text-anchor="middle">H · 48 hex</text>
  <text x="304" y="59" class="mono" text-anchor="middle">I · 49 hex</text>
  <text x="424" y="59" class="sub" text-anchor="middle">add 00</text>
  <rect x="16" y="72" width="192" height="40" class="box"/>
  <rect x="208" y="72" width="192" height="40" class="box"/>
  <rect x="400" y="72" width="48" height="40" class="hatch"/>
  <text x="28" y="97" class="mono" text-anchor="middle">0</text>
  <text x="52" y="97" class="mono" text-anchor="middle">1</text>
  <text x="76" y="97" class="mono" text-anchor="middle">0</text>
  <text x="100" y="97" class="mono" text-anchor="middle">0</text>
  <text x="124" y="97" class="mono" text-anchor="middle">1</text>
  <text x="148" y="97" class="mono" text-anchor="middle">0</text>
  <text x="172" y="97" class="mono" text-anchor="middle">0</text>
  <text x="196" y="97" class="mono" text-anchor="middle">0</text>
  <text x="220" y="97" class="mono" text-anchor="middle">0</text>
  <text x="244" y="97" class="mono" text-anchor="middle">1</text>
  <text x="268" y="97" class="mono" text-anchor="middle">0</text>
  <text x="292" y="97" class="mono" text-anchor="middle">0</text>
  <text x="316" y="97" class="mono" text-anchor="middle">1</text>
  <text x="340" y="97" class="mono" text-anchor="middle">0</text>
  <text x="364" y="97" class="mono" text-anchor="middle">0</text>
  <text x="388" y="97" class="mono" text-anchor="middle">1</text>
  <text x="412" y="97" class="mono halo" text-anchor="middle">0</text>
  <text x="436" y="97" class="mono halo" text-anchor="middle">0</text>
  <path d="M232 122V158" class="line" marker-end="url(#arrow)"/>
  <text x="16" y="145" class="sub">Keep the bit order</text>
  <rect x="16" y="170" width="144" height="40" class="box"/>
  <rect x="160" y="170" width="144" height="40" class="box"/>
  <rect x="304" y="170" width="144" height="40" class="box"/>
  <rect x="400" y="170" width="48" height="40" class="hatch"/>
  <text x="28" y="195" class="mono" text-anchor="middle">0</text>
  <text x="52" y="195" class="mono" text-anchor="middle">1</text>
  <text x="76" y="195" class="mono" text-anchor="middle">0</text>
  <text x="100" y="195" class="mono" text-anchor="middle">0</text>
  <text x="124" y="195" class="mono" text-anchor="middle">1</text>
  <text x="148" y="195" class="mono" text-anchor="middle">0</text>
  <text x="172" y="195" class="mono" text-anchor="middle">0</text>
  <text x="196" y="195" class="mono" text-anchor="middle">0</text>
  <text x="220" y="195" class="mono" text-anchor="middle">0</text>
  <text x="244" y="195" class="mono" text-anchor="middle">1</text>
  <text x="268" y="195" class="mono" text-anchor="middle">0</text>
  <text x="292" y="195" class="mono" text-anchor="middle">0</text>
  <text x="316" y="195" class="mono" text-anchor="middle">1</text>
  <text x="340" y="195" class="mono" text-anchor="middle">0</text>
  <text x="364" y="195" class="mono" text-anchor="middle">0</text>
  <text x="388" y="195" class="mono" text-anchor="middle">1</text>
  <text x="412" y="195" class="mono halo" text-anchor="middle">0</text>
  <text x="436" y="195" class="mono halo" text-anchor="middle">0</text>
  <text x="88" y="235" class="sub" text-anchor="middle">6 bits → index 18</text>
  <text x="232" y="235" class="sub" text-anchor="middle">6 bits → index 4</text>
  <text x="376" y="235" class="sub" text-anchor="middle">6 bits → index 36</text>
  <text x="88" y="260" class="output" text-anchor="middle">S</text>
  <text x="232" y="260" class="output" text-anchor="middle">E</text>
  <text x="376" y="260" class="output" text-anchor="middle">k</text>
  <text x="16" y="298" class="output">SEk=</text>
  <text x="102" y="298" class="sub">One = pad: the input ended with 2 bytes.</text>
  <text x="16" y="321" class="sub">The two zero bits complete a group, not another byte.</text>
</svg>
