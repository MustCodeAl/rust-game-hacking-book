<svg xmlns="http://www.w3.org/2000/svg" width="480" height="278" viewBox="0 0 480 278" role="img" aria-labelledby="title desc">
<title id="title">One image, two loaded addresses</title><desc id="desc">The same instruction is 0x1350 bytes from the module start. Loading at 0x00400000 puts it at 0x00401350; loading at 0x00600000 puts it at 0x00601350. Diagram spacing is schematic.</desc>
<metadata>Original Game Hacking Academy geometric teaching artwork. CC0 1.0 Universal. Reproduce with site/scripts/make-foundation-art.py.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{fill:currentColor;font-family:Arial,Helvetica,sans-serif}.mono{font-family:"Courier New",monospace}.shape{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.08rem}.line{fill:none;stroke:currentColor;stroke-width:.08rem}</style>
<text x="16" y="22" style="font-size:1.0000rem;font-weight:700">One image, two loaded addresses</text>
<rect class="shape" x="16" y="58" width="108" height="118" rx="0"/>
<text x="70" y="79" text-anchor="middle" style="font-size:0.7500rem;font-weight:700">EXE on disk</text>
<path class="line" d="M28 91L110 91"/>
<path class="line" d="M28 105L110 105"/>
<path class="line" d="M28 119L110 119"/>
<text x="70" y="143" text-anchor="middle" style="font-size:0.7500rem">instruction</text>
<text x="70" y="161" class="mono" text-anchor="middle" style="font-size:0.7500rem">+0x1350</text>
<text x="178" y="54" style="font-size:0.7500rem;font-weight:700">Run 1</text>
<rect class="shape" x="176" y="63" width="282" height="49" rx="0"/>
<path class="line" d="M342 63L342 112"/>
<text x="187" y="84" class="mono" style="font-size:0.7500rem">base 00400000</text>
<text x="351" y="84" style="font-size:0.7500rem">code</text>
<text x="187" y="102" style="font-size:0.6875rem">same module layout</text>
<text x="351" y="102" class="mono" style="font-size:0.7500rem">1350</text>
<text x="178" y="131" class="mono" style="font-size:0.7500rem">address = 0x00401350</text>
<text x="178" y="149" style="font-size:0.7500rem;font-weight:700">Run 2</text>
<rect class="shape" x="176" y="158" width="282" height="49" rx="0"/>
<path class="line" d="M342 158L342 207"/>
<text x="187" y="179" class="mono" style="font-size:0.7500rem">base 00600000</text>
<text x="351" y="179" style="font-size:0.7500rem">code</text>
<text x="187" y="197" style="font-size:0.6875rem">same module layout</text>
<text x="351" y="197" class="mono" style="font-size:0.7500rem">1350</text>
<text x="178" y="226" class="mono" style="font-size:0.7500rem">address = 0x00601350</text>
<path class="line" d="M124 109L168 88"/>
<polygon fill="currentColor" points="168.00,88.00 163.62,93.46 161.00,87.97"/>
<path class="line" d="M124 130L168 181"/>
<polygon fill="currentColor" points="168.00,181.00 161.58,178.22 166.19,174.24"/>
<text x="16" y="255" style="font-size:0.7500rem">Keep the offset; rediscover the loaded base for this run.</text>
</svg>
