<svg xmlns="http://www.w3.org/2000/svg" width="480" height="302" viewBox="0 0 480 302" role="img" aria-labelledby="title desc">
<title id="title">A program becomes another program’s input</title><desc id="desc">The increment rules are encoded as input data to one fixed interpreter. It reads and applies the rules to a work tape, changing the same worked input 1011 to 1100 after three transitions. The head starts on the rightmost 1 in state carry.</desc>
<metadata>Original Game Hacking Academy geometric teaching artwork. Dedicated to the public domain under CC0 1.0 Universal. No third-party imagery or fonts embedded. Reproduce with site/scripts/make-finish-early-art.py.</metadata>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" stroke="currentColor" stroke-width=".04rem"/></pattern></defs>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{fill:currentColor;font-family:Arial,Helvetica,sans-serif}.mono{font-family:"Courier New",monospace}.shape{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.08rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.08rem}.line{fill:none;stroke:currentColor;stroke-width:.08rem}.point{fill:currentColor}</style>
<text x="16" y="25" text-anchor="start" class="label" style="font-size:1rem;font-weight:700">A program becomes another program’s input</text>
<rect class="shape" x="16" y="60" width="154" height="66"/>
<text x="93" y="84" text-anchor="middle" class="label" style="font-size:.875rem;font-weight:700">increment rules</text>
<text x="93" y="108" text-anchor="middle" class="label" style="font-size:.8125rem">encoded as symbols</text>
<path class="line" d="M174 93L202 93"/>
<polygon fill="currentColor" points="202,93 195.00,90.00 195.00,96.00"/>
<rect class="shape" x="210" y="60" width="254" height="66" style="stroke-width:.15rem"/>
<text x="337" y="84" text-anchor="middle" class="label" style="font-size:.875rem;font-weight:700">one fixed interpreter</text>
<text x="337" y="108" text-anchor="middle" class="label" style="font-size:.8125rem">read rule → write → move</text>
<path class="line" d="M337 130L337 163"/>
<polygon fill="currentColor" points="337,163 340.00,156.00 334.00,156.00"/>
<text x="30" y="162" text-anchor="start" class="label" style="font-size:.875rem;font-weight:700">work tape</text>
<rect class="shape" x="42" y="177" width="62" height="51"/>
<text x="73" y="210" text-anchor="middle" class="mono" style="font-size:1.25rem">_</text>
<rect class="shape" x="104" y="177" width="62" height="51"/>
<text x="135" y="210" text-anchor="middle" class="mono" style="font-size:1.25rem">1</text>
<rect class="shape" x="166" y="177" width="62" height="51"/>
<text x="197" y="210" text-anchor="middle" class="mono" style="font-size:1.25rem">0</text>
<rect class="shape" x="228" y="177" width="62" height="51"/>
<text x="259" y="210" text-anchor="middle" class="mono" style="font-size:1.25rem">1</text>
<rect class="shape" x="290" y="177" width="62" height="51" style="stroke-width:.15rem"/>
<text x="321" y="210" text-anchor="middle" class="mono" style="font-size:1.25rem">1</text>
<rect class="shape" x="352" y="177" width="62" height="51"/>
<text x="383" y="210" text-anchor="middle" class="mono" style="font-size:1.25rem">_</text>
<path class="line" d="M321 168L321 177"/>
<polygon fill="currentColor" points="321,177 324.00,170.00 318.00,170.00"/>
<text x="240" y="253" text-anchor="middle" class="label" style="font-size:.875rem">head starts in carry on the rightmost 1</text>
<text x="240" y="282" text-anchor="middle" class="mono" style="font-size:.875rem;font-weight:700">three steps: 1011 → 1100; state done</text>
</svg>
