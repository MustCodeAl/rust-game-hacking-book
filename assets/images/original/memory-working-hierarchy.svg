<svg xmlns="http://www.w3.org/2000/svg" width="480" height="416" viewBox="0 0 480 416" role="img" aria-labelledby="title desc">
<title id="title">Working values and persistent files</title>
<desc id="desc">Registers hold operands selected by instructions. L1, L2, and L3 caches hold memory lines. RAM holds resident code and data. File I/O transfers data between RAM and persistent SSD or HDD storage. This is a common conceptual hierarchy, without fixed capacities or timing promises.</desc>
<metadata>Original geometric teaching artwork authored for Game Hacking Academy, 2026-10-09. Public domain dedication: CC0 1.0 Universal, https://creativecommons.org/publicdomain/zero/1.0/. Concept and illustrative values belong to site/src/content/docs/pages/1/02.mdx. No third-party image assets. Diagram dimensions and placements are schematic.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}
text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.9rem}
.title{font-size:1rem;font-weight:700}.key{font-weight:700}.sub{font-size:.82rem}
.mono{font-family:ui-monospace,monospace;font-size:.86rem}
.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}
.line{fill:none;stroke:currentColor;stroke-width:.1rem}
.dash{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}
.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}
.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">Working values and persistent files</text>
<rect x="128" y="48" width="224" height="48" class="box"/>
<text x="240" y="69" class="key" text-anchor="middle">CPU registers</text>
<text x="240" y="87" class="sub" text-anchor="middle">explicit instruction operands</text>
<path d="M240 99V118" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="96" y="124" width="288" height="72" class="box"/>
<text x="240" y="146" class="key" text-anchor="middle">CPU caches: L1 · L2 · L3</text>
<text x="240" y="166" class="sub" text-anchor="middle">memory lines already near the CPU</text>
<text x="240" y="184" class="sub" text-anchor="middle">a hit can avoid a slower fetch</text>
<path d="M240 200V221" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="64" y="226" width="352" height="54" class="box"/>
<text x="240" y="248" class="key" text-anchor="middle">RAM: resident code and data</text>
<text x="240" y="268" class="sub" text-anchor="middle">larger working storage</text>
<path d="M240 284V307" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="254" y="301" class="sub" text-anchor="start">file I/O</text>
<rect x="16" y="315" width="216" height="55" class="box"/>
<text x="124" y="339" class="key" text-anchor="middle">SSD</text>
<text x="124" y="359" class="sub" text-anchor="middle">persistent files</text>
<rect x="248" y="315" width="216" height="55" class="box"/>
<text x="356" y="339" class="key" text-anchor="middle">HDD</text>
<text x="356" y="359" class="sub" text-anchor="middle">persistent files</text>
<text x="16" y="395" class="sub" text-anchor="start">Capacity and access time depend on the machine.</text>
</svg>
