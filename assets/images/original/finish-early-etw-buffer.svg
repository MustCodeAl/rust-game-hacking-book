<svg xmlns="http://www.w3.org/2000/svg" width="480" height="310" viewBox="0 0 480 310" role="img" aria-labelledby="title desc">
<title id="title">A burst can outrun a finite buffer</title><desc id="desc">A separate schematic buffer has three illustrative slots. Four events arrive before the consumer drains: records one through three occupy the slots, while the fourth cannot enter and is lost from this capture. Three slots are not an ETW capacity setting. A later drain makes room for future records but cannot reconstruct the lost one.</desc>
<metadata>Original Game Hacking Academy geometric teaching artwork. Dedicated to the public domain under CC0 1.0 Universal. No third-party imagery or fonts embedded. Reproduce with site/scripts/make-finish-early-art.py.</metadata>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" stroke="currentColor" stroke-width=".04rem"/></pattern></defs>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{fill:currentColor;font-family:Arial,Helvetica,sans-serif}.mono{font-family:"Courier New",monospace}.shape{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.08rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.08rem}.line{fill:none;stroke:currentColor;stroke-width:.08rem}.point{fill:currentColor}</style>
<text x="16" y="25" text-anchor="start" class="label" style="font-size:1rem;font-weight:700">A burst can outrun a finite buffer</text>
<text x="16" y="54" text-anchor="start" class="label" style="font-size:.875rem">illustration: three slots, four arriving events</text>
<rect class="shape" x="16" y="94" width="113" height="89"/>
<text x="72" y="120" text-anchor="middle" class="label" style="font-size:.875rem;font-weight:700">provider</text>
<text x="72" y="146" text-anchor="middle" class="label" style="font-size:.875rem">events</text>
<rect class="shape" x="159" y="81" width="216" height="122" style="stroke-width:.15rem"/>
<text x="267" y="106" text-anchor="middle" class="label" style="font-size:.875rem;font-weight:700">finite session buffer</text>
<rect class="shape" x="178" y="124" width="53" height="47" style="stroke-width:.15rem"/>
<text x="204.5" y="155" text-anchor="middle" class="mono" style="font-size:1rem;font-weight:700">1</text>
<rect class="shape" x="239" y="124" width="53" height="47" style="stroke-width:.15rem"/>
<text x="265.5" y="155" text-anchor="middle" class="mono" style="font-size:1rem;font-weight:700">2</text>
<rect class="shape" x="300" y="124" width="53" height="47" style="stroke-width:.15rem"/>
<text x="326.5" y="155" text-anchor="middle" class="mono" style="font-size:1rem;font-weight:700">3</text>
<path class="line" d="M132 143L153 143"/>
<polygon fill="currentColor" points="153,143 146.00,140.00 146.00,146.00"/>
<path class="line" d="M379 143L397 143"/>
<polygon fill="currentColor" points="397,143 390.00,140.00 390.00,146.00"/>
<rect class="shape" x="403" y="108" width="61" height="70"/>
<text x="433" y="137" text-anchor="middle" class="label" style="font-size:.8125rem;font-weight:700">drain</text>
<text x="433" y="160" text-anchor="middle" class="label" style="font-size:.75rem">later</text>
<rect class="shape" x="16" y="222" width="104" height="47"/>
<text x="68" y="252" text-anchor="middle" class="mono" style="font-size:.875rem">record 4</text>
<path class="line" d="M124 245L163 216"/>
<path class="line" d="M157 210L169 222" style="stroke-width:.15rem"/>
<path class="line" d="M157 222L169 210" style="stroke-width:.15rem"/>
<text x="185" y="244" text-anchor="start" class="label" style="font-size:.875rem;font-weight:700">full: not recorded</text>
<text x="16" y="297" text-anchor="start" class="label" style="font-size:.8125rem">Missing from a capture does not mean never happened.</text>
</svg>
