<svg xmlns="http://www.w3.org/2000/svg" width="480" height="317" viewBox="0 0 480 317" role="img" aria-labelledby="title desc">
<title id="title">Pair the effect by correlation ID</title><desc id="desc">Sequence 41 denies correlation 7; sequence 42 allows correlation 8. Sequence 43 records changed state for correlation 7 at generation 13, and sequence 44 records a change for correlation 8 at generation 14. Matching IDs exposes correlation 7 changing after denial.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/13/07.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">Pair the effect by correlation ID</text>
<text x="16" y="58" class="mono" text-anchor="start">seq</text><text x="65" y="58" class="mono" text-anchor="start">corr</text><text x="129" y="58" class="mono" text-anchor="start">event</text><rect x="16" y="77" width="404" height="36" rx="0" class="hatch"/><rect x="16" y="77" width="104" height="36" rx="0" class="box"/><text x="25" y="101" class="mono" text-anchor="start">41</text><text x="75" y="101" class="mono" text-anchor="start">7</text><text x="130" y="101" class="sub halo" text-anchor="start">Denied: ValueOutOfRange</text><rect x="16" y="124" width="404" height="36" rx="0" class="box"/><rect x="16" y="124" width="104" height="36" rx="0" class="box"/><text x="25" y="148" class="mono" text-anchor="start">42</text><text x="75" y="148" class="mono" text-anchor="start">8</text><text x="130" y="148" class="sub" text-anchor="start">Allowed</text><rect x="16" y="171" width="404" height="36" rx="0" class="hatch"/><rect x="16" y="171" width="104" height="36" rx="0" class="box"/><text x="25" y="195" class="mono" text-anchor="start">43</text><text x="75" y="195" class="mono" text-anchor="start">7</text><text x="130" y="195" class="sub halo" text-anchor="start">Effect: changed, gen 13</text><rect x="16" y="218" width="404" height="36" rx="0" class="box"/><rect x="16" y="218" width="104" height="36" rx="0" class="box"/><text x="25" y="242" class="mono" text-anchor="start">44</text><text x="75" y="242" class="mono" text-anchor="start">8</text><text x="130" y="242" class="sub" text-anchor="start">Effect: changed, gen 14</text><path d="M425 94H443V188H425" class="line"/><path d="M425 141H459V235H425" class="dashed"/><text x="16" y="295" class="sub" text-anchor="start">corr 7 changed state after denial. Adjacency hid it.</text>
</svg>
