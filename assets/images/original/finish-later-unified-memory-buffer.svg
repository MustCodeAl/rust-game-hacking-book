<svg xmlns="http://www.w3.org/2000/svg" width="480" height="310" viewBox="0 0 480 310" role="img" aria-labelledby="title desc">
<title id="title">One shared buffer has two users</title><desc id="desc">The lesson’s PC model uses CPU system RAM and GPU video RAM with a copy between them. The console model puts CPU and GPU on one SoC and lets both use the same shared-memory buffer.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/14/05.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">One shared buffer has two users</text>
<text x="16" y="61" class="strong" text-anchor="start">PC: separate memories</text><rect x="16" y="81" width="100" height="40" rx="5" class="box"/><text x="66" y="107" class="strong" text-anchor="middle">CPU</text><rect x="16" y="164" width="100" height="40" rx="5" class="box"/><text x="66" y="190" class="sub" text-anchor="middle">system RAM</text><path d="M66 126L66 158" class="line" marker-end="url(#arrow)"/><rect x="167" y="81" width="100" height="40" rx="5" class="box"/><text x="217" y="107" class="strong" text-anchor="middle">GPU</text><rect x="167" y="164" width="100" height="40" rx="5" class="box"/><text x="217" y="190" class="sub" text-anchor="middle">video RAM</text><path d="M217 126L217 158" class="line" marker-end="url(#arrow)"/><path d="M120 182L160 182" class="line" marker-end="url(#arrow)"/><text x="144" y="148" class="sub" text-anchor="middle">copy</text><rect x="304" y="73" width="160" height="82" rx="5" class="dashed"/><text x="384" y="94" class="sub" text-anchor="middle">console SoC</text><rect x="314" y="108" width="62" height="32" rx="5" class="box"/><text x="345" y="130" class="" text-anchor="middle">CPU</text><rect x="391" y="108" width="62" height="32" rx="5" class="box"/><text x="422" y="130" class="" text-anchor="middle">GPU</text><path d="M345 159L345 184" class="line" marker-end="url(#arrow)"/><path d="M422 159L422 184" class="line" marker-end="url(#arrow)"/><rect x="304" y="190" width="160" height="60" rx="5" class="box"/><text x="384" y="215" class="strong" text-anchor="middle">shared RAM</text><rect x="323" y="222" width="31" height="23" rx="0" class="box"/><text x="338.5" y="237.41" class="mono" text-anchor="middle">·</text><rect x="354" y="222" width="31" height="23" rx="0" class="box"/><text x="369.5" y="237.41" class="mono" text-anchor="middle">·</text><rect x="385" y="222" width="31" height="23" rx="0" class="box"/><text x="400.5" y="237.41" class="mono" text-anchor="middle">·</text><rect x="416" y="222" width="31" height="23" rx="0" class="box"/><text x="431.5" y="237.41" class="mono" text-anchor="middle">·</text><text x="16" y="288" class="sub" text-anchor="start">The console GPU reads the buffer the CPU wrote.</text>
