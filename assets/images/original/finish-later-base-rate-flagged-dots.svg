<title id="title">False flags dominate this example</title><desc id="desc">The lesson’s hypothetical flagged group contains 99 cheating players and 999 honest players, 1,098 total. Exactly 11 filled dots represent the 99 true flags and 111 open dots represent the 999 false flags, with nine players per dot.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/15/05.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
