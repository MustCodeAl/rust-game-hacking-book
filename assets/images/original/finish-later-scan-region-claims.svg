<svg xmlns="http://www.w3.org/2000/svg" width="480" height="256" viewBox="0 0 480 256" role="img" aria-labelledby="title desc">
<title id="title">Each region is claimed once</title><desc id="desc">In a separate two-worker example, the atomic region index advances from 0 to 1 for Worker 1 and from 1 to 2 for Worker 2. The workers scan different immutable copied regions.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/8/05.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">Each region is claimed once</text>
<text x="16" y="59" class="strong" text-anchor="start">Owned, immutable snapshots</text><rect x="16" y="72" width="183" height="52" rx="5" class="box"/><text x="28" y="93" class="mono" text-anchor="start">region 0</text><rect x="113" y="82" width="24" height="30" rx="0" class="box"/><text x="125.0" y="102.1" class="mono" text-anchor="middle">·</text><rect x="137" y="82" width="24" height="30" rx="0" class="box"/><text x="149.0" y="102.1" class="mono" text-anchor="middle">·</text><rect x="161" y="82" width="24" height="30" rx="0" class="box"/><text x="173.0" y="102.1" class="mono" text-anchor="middle">·</text><rect x="16" y="147" width="183" height="52" rx="5" class="box"/><text x="28" y="168" class="mono" text-anchor="start">region 1</text><rect x="113" y="157" width="24" height="30" rx="0" class="box"/><text x="125.0" y="177.1" class="mono" text-anchor="middle">·</text><rect x="137" y="157" width="24" height="30" rx="0" class="box"/><text x="149.0" y="177.1" class="mono" text-anchor="middle">·</text><rect x="161" y="157" width="24" height="30" rx="0" class="box"/><text x="173.0" y="177.1" class="mono" text-anchor="middle">·</text><path d="M203 98L263 98" class="line" marker-end="url(#arrow)"/><path d="M203 174L263 174" class="line" marker-end="url(#arrow)"/><rect x="270" y="72" width="194" height="52" rx="5" class="box"/><text x="282" y="93" class="strong" text-anchor="start">Worker 1 claims 0</text><text x="282" y="114" class="mono" text-anchor="start">next_region: 0 → 1</text><rect x="270" y="147" width="194" height="52" rx="5" class="box"/><text x="282" y="168" class="strong" text-anchor="start">Worker 2 claims 1</text><text x="282" y="189" class="mono" text-anchor="start">next_region: 1 → 2</text><text x="16" y="233" class="sub" text-anchor="start">Workers compare copied bytes, not live process pages.</text>
</svg>
