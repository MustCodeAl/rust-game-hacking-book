<svg xmlns="http://www.w3.org/2000/svg" width="480" height="296" viewBox="0 0 480 296" role="img" aria-labelledby="title desc">
<title id="title">Equal addresses can name different pages</title><desc id="desc">Process A and Process B both use virtual address 0x1000. Their different page-table roots map that number to different physical places, labelled A and B symbolically.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/11/06.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">Equal addresses can name different pages</text>
<rect x="16" y="61" width="170" height="57" rx="5" class="box"/><text x="29" y="82" class="strong" text-anchor="start">Process A · root A</text><text x="29" y="105" class="mono" text-anchor="start">virtual 0x1000</text><rect x="16" y="170" width="170" height="57" rx="5" class="box"/><text x="29" y="191" class="strong" text-anchor="start">Process B · root B</text><text x="29" y="214" class="mono" text-anchor="start">virtual 0x1000</text><rect x="301" y="60" width="163" height="182" rx="5" class="box"/><text x="313" y="84" class="strong" text-anchor="start">Physical RAM</text><rect x="313" y="102" width="45" height="35" rx="0" class="hatch"/><text x="335.5" y="125.45" class="mono halo" text-anchor="middle">A</text><rect x="358" y="102" width="45" height="35" rx="0" class="box"/><text x="380.5" y="125.45" class="mono" text-anchor="middle">·</text><rect x="403" y="102" width="45" height="35" rx="0" class="box"/><text x="425.5" y="125.45" class="mono" text-anchor="middle">·</text><rect x="313" y="171" width="45" height="35" rx="0" class="box"/><text x="335.5" y="194.45" class="mono" text-anchor="middle">·</text><rect x="358" y="171" width="45" height="35" rx="0" class="box"/><text x="380.5" y="194.45" class="mono" text-anchor="middle">·</text><rect x="403" y="171" width="45" height="35" rx="0" class="hatch"/><text x="425.5" y="194.45" class="mono halo" text-anchor="middle">B</text><path d="M190 89H230V119H304" class="line" marker-end="url(#arrow)"/><path d="M190 198H248V207H436" class="line" marker-end="url(#arrow)"/><text x="212" y="161" class="sub" text-anchor="start">different maps</text><text x="16" y="275" class="sub" text-anchor="start">The root is part of an address’s meaning.</text>
