<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340" role="img" aria-labelledby="title desc">
<title id="title">Parents point back; a route runs forward</title><desc id="desc">For the unchanged three-by-two worked grid with start (0,0), goal (2,0), and wall (1,0), follow parents backward as (2,0), (2,1), (1,1), (0,1), (0,0). The start has no parent. Reversing that list yields (0,0), (0,1), (1,1), (2,1), (2,0), a route of four moves through row one. This drawing does not track the optional scene wall controls.</desc>
<metadata>Original Game Hacking Academy geometric teaching artwork. Dedicated to the public domain under CC0 1.0 Universal. No third-party imagery or fonts embedded. Reproduce with site/scripts/make-finish-early-art.py.</metadata>
