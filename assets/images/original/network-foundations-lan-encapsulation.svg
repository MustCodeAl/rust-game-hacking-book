<svg xmlns="http://www.w3.org/2000/svg" width="480" height="448" viewBox="0 0 480 448" role="img" aria-labelledby="title desc">
<title id="title">Game bytes gain wrappers on the link</title><desc id="desc">Nested conceptual boxes show game bytes in a UDP datagram, an IP packet and an Ethernet frame. A client sends across a local switch to a router, which forwards onto a new link frame. The OSI and TCP/IP responsibility mapping is conceptual rather than seven mandatory headers.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-09. Public domain dedication: CC0 1.0 Universal. Source is this original SVG markup. Conceptual teaching model, not a vendor deployment or literal wire-format specification. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:1rem}.title{font-size:1.125rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.875rem}.mono{font-family:ui-monospace,monospace;font-size:.875rem}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.group{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dash{fill:none;stroke:currentColor;stroke-width:.1rem;stroke-dasharray:.3rem .2rem}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="currentColor"/></marker></defs>
<text x="16" y="29" class="title" text-anchor="start">Game bytes gain wrappers on the link</text>
<rect x="16" y="68" width="448" height="206" rx="5" class="box"/>
<text x="32" y="95" class="strong" text-anchor="start">Ethernet frame: this link</text>
<rect x="40" y="112" width="400" height="142" rx="5" class="box"/>
<text x="56" y="138" class="strong" text-anchor="start">IP packet: routed destination</text>
<rect x="64" y="155" width="352" height="80" rx="5" class="box"/>
<text x="80" y="181" class="strong" text-anchor="start">UDP datagram: endpoint ports</text>
<rect x="88" y="196" width="304" height="28" rx="5" class="box"/>
<text x="240.0" y="215.0" class="strong" text-anchor="middle">Game bytes</text>
<rect x="16" y="295" width="288" height="99" rx="5" class="group"/>
<text x="32" y="317" class="sub" text-anchor="start">LAN: client and switch</text>
<rect x="32" y="333" width="96" height="46" rx="5" class="box"/>
<text x="80.0" y="361.0" class="strong" text-anchor="middle">Client</text>
<rect x="192" y="333" width="96" height="46" rx="5" class="box"/>
<text x="240.0" y="361.0" class="strong" text-anchor="middle">Switch</text>
<rect x="352" y="333" width="96" height="46" rx="5" class="box"/>
<text x="400.0" y="361.0" class="strong" text-anchor="middle">Router</text>
<path d="M128 356H192" class="line" marker-end="url(#arrow)"/>
<path d="M288 356H352" class="line" marker-end="url(#arrow)"/>
<path d="M448 356H468" class="line" marker-end="url(#arrow)"/>
<text x="322" y="398" class="sub" text-anchor="start">new frame → next link</text>
<text x="16" y="418" class="sub" text-anchor="start">OSI 7–5 → application; 4 → transport</text>
<text x="16" y="439" class="sub" text-anchor="start">OSI 3 → IP; 2–1 → link and physical signaling</text>
</svg>
