<svg xmlns="http://www.w3.org/2000/svg" width="480" height="326" viewBox="0 0 480 326" role="img" aria-labelledby="title desc">
<title id="title">A call saves a route back</title><desc id="desc">The caller reads gold, calls grant_coin, and will resume at the store. CALL saves that continuation on the ordinary 32-bit stack and lowers ESP by four. The helper adds one to EAX. RET pops the saved continuation, advances ESP by four, and resumes the store; RET does not calculate the result.</desc>
<metadata>Original Game Hacking Academy geometric teaching artwork. Dedicated to the public domain under CC0 1.0 Universal. No third-party imagery or fonts embedded. Reproduce with site/scripts/make-finish-early-art.py.</metadata>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" stroke="currentColor" stroke-width=".04rem"/></pattern></defs>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{fill:currentColor;font-family:Arial,Helvetica,sans-serif}.mono{font-family:"Courier New",monospace}.shape{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.08rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.08rem}.line{fill:none;stroke:currentColor;stroke-width:.08rem}.point{fill:currentColor}</style>
<text x="16" y="25" text-anchor="start" class="label" style="font-size:1rem;font-weight:700">A call saves a route back</text>
<rect class="shape" x="16" y="60" width="181" height="132"/>
<text x="106" y="85" text-anchor="middle" class="label" style="font-size:.875rem;font-weight:700">caller</text>
<text x="32" y="113" text-anchor="start" class="label" style="font-size:.875rem">read gold</text>
<text x="32" y="143" text-anchor="start" class="mono" style="font-size:.8125rem">call grant_coin</text>
<text x="32" y="177" text-anchor="start" class="label" style="font-size:.8125rem;font-weight:700">resume: store gold</text>
<rect class="shape" x="306" y="60" width="158" height="132"/>
<text x="385" y="85" text-anchor="middle" class="mono" style="font-size:.875rem;font-weight:700">grant_coin</text>
<text x="385" y="113" text-anchor="middle" class="label" style="font-size:.8125rem">adds one in eax</text>
<text x="385" y="163" text-anchor="middle" class="mono" style="font-size:1rem;font-weight:700">ret</text>
<path class="line" d="M201 133L298 133"/>
<polygon fill="currentColor" points="298,133 291.00,130.00 291.00,136.00"/>
<text x="250" y="118" text-anchor="middle" class="label" style="font-size:.8125rem">call</text>
<path class="line" d="M299 166L205 166"/>
<polygon fill="currentColor" points="205,166 212.00,169.00 212.00,163.00"/>
<text x="250" y="189" text-anchor="middle" class="label" style="font-size:.8125rem">resume</text>
<text x="16" y="230" text-anchor="start" class="label" style="font-size:.875rem;font-weight:700">32-bit stack</text>
<rect class="shape" x="148" y="222" width="316" height="39" style="stroke-width:.15rem"/>
<text x="306" y="247" text-anchor="middle" class="label" style="font-size:.875rem">address of “store gold”</text>
<rect class="shape" x="148" y="261" width="316" height="34" stroke-dasharray="4 3"/>
<text x="306" y="283" text-anchor="middle" class="label" style="font-size:.8125rem">older stack data</text>
<path class="line" d="M109 177L158 216" stroke-dasharray="4 3"/>
<polygon fill="currentColor" points="158,216 154.39,209.29 150.65,213.99"/>
<text x="16" y="254" text-anchor="start" class="mono" style="font-size:.75rem">call: esp −4</text>
<text x="16" y="278" text-anchor="start" class="mono" style="font-size:.75rem">ret: esp +4</text>
<text x="16" y="316" text-anchor="start" class="label" style="font-size:.875rem">The saved address selects the next instruction.</text>
</svg>
