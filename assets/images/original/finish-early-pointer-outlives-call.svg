<svg xmlns="http://www.w3.org/2000/svg" width="480" height="304" viewBox="0 0 480 304" role="img" aria-labelledby="title desc">
<title id="title">A pointer can outlive the call</title><desc id="desc">In this timing illustration the caller releases its buffer after return. A callee that reads only during the call completes before release. A callee that keeps the pointer for a later read needs the buffer to live longer; that later read would otherwise be past the lifetime of the data. Horizontal distances are not times.</desc>
<metadata>Original Game Hacking Academy geometric teaching artwork. Dedicated to the public domain under CC0 1.0 Universal. No third-party imagery or fonts embedded. Reproduce with site/scripts/make-finish-early-art.py.</metadata>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" stroke="currentColor" stroke-width=".04rem"/></pattern></defs>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{fill:currentColor;font-family:Arial,Helvetica,sans-serif}.mono{font-family:"Courier New",monospace}.shape{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.08rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.08rem}.line{fill:none;stroke:currentColor;stroke-width:.08rem}.point{fill:currentColor}</style>
<text x="16" y="25" text-anchor="start" class="label" style="font-size:1rem;font-weight:700">A pointer can outlive the call</text>
<text x="44" y="66" text-anchor="middle" class="label" style="font-size:.8125rem;font-weight:700">call</text>
<path class="line" d="M44 74L44 260" stroke-dasharray="4 3"/>
<text x="230" y="66" text-anchor="middle" class="label" style="font-size:.8125rem;font-weight:700">return</text>
<path class="line" d="M230 74L230 260" stroke-dasharray="4 3"/>
<text x="375" y="66" text-anchor="middle" class="label" style="font-size:.8125rem;font-weight:700">release</text>
<path class="line" d="M375 74L375 260" stroke-dasharray="4 3"/>
<text x="446" y="66" text-anchor="middle" class="label" style="font-size:.8125rem;font-weight:700">later</text>
<path class="line" d="M446 74L446 260" stroke-dasharray="4 3"/>
<rect class="shape" x="44" y="99" width="331" height="37" style="stroke-width:.15rem"/>
<text x="209" y="124" text-anchor="middle" class="label" style="font-size:.875rem">caller’s buffer exists</text>
<rect class="shape" x="44" y="162" width="186" height="37"/>
<text x="137" y="187" text-anchor="middle" class="label" style="font-size:.875rem">read inside call</text>
<text x="249" y="186" text-anchor="start" class="label" style="font-size:.8125rem">borrow ends</text>
<path class="line" d="M44 238L446 238"/>
<polygon fill="currentColor" points="446,238 439.00,235.00 439.00,241.00"/>
<path class="line" d="M394 232L406 244" style="stroke-width:.15rem"/>
<path class="line" d="M394 244L406 232" style="stroke-width:.15rem"/>
<text x="150" y="225" text-anchor="middle" class="label" style="font-size:.875rem">saved pointer</text>
<text x="446" y="261" text-anchor="middle" class="label" style="font-size:.8125rem">read?</text>
<text x="16" y="292" text-anchor="start" class="label" style="font-size:.875rem">Keeping the pointer requires a longer data lifetime.</text>
</svg>
