<svg xmlns="http://www.w3.org/2000/svg" width="480" height="206" viewBox="0 0 480 206" role="img" aria-labelledby="title desc">
<title id="title">Compare one action at a time</title><desc id="desc">100 gold becomes 101 after one coin; repeat the controlled action before explaining its cause. An observed change gives a lead. Repeating it helps test an explanation.</desc>
<metadata>Original geometric artwork. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-handoff-art.mjs and site/src/data/handoff-figures.json.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.84rem}.title{font-size:1rem;font-weight:700}.node{font-size:.82rem}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.08rem}.arrow{fill:none;stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker></defs>
<text class="title" x="12" y="24">Compare one action at a time</text>
<g><rect x="12" y="76" width="128" height="64" rx="6" class="box"/><text x="76" y="108" text-anchor="middle" class="node">Start: 100 gold</text></g><g><rect x="176" y="76" width="128" height="64" rx="6" class="box"/><text x="240" y="108" text-anchor="middle" class="node">Collect one coin</text></g><g><rect x="340" y="76" width="128" height="64" rx="6" class="box"/><text x="404" y="108" text-anchor="middle" class="node">Observe: 101 gold</text></g><path class="arrow" d="M145 108H169M309 108H333" marker-end="url(#arrow)"/>
<text x="12" y="170">An observed change gives a lead. Repeating it helps test an</text><text x="12" y="188">explanation.</text>
</svg>
