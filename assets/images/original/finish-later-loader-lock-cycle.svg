<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-labelledby="title desc">
<title id="title">Two held locks can form a wait cycle</title><desc id="desc">Thread A holds game_lock and waits for loader_lock. Thread B is in DllMain holding loader_lock and waits for game_lock. The closed wait cycle prevents either thread from continuing.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/11/02.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">Two held locks can form a wait cycle</text>
<rect x="22" y="61" width="202" height="80" rx="5" class="box"/><text x="35" y="85" class="strong" text-anchor="start">Thread A</text><text x="35" y="110" class="mono" text-anchor="start">holds game_lock</text><rect x="257" y="61" width="202" height="80" rx="5" class="box"/><text x="270" y="85" class="strong" text-anchor="start">Thread B: DllMain</text><text x="270" y="110" class="mono" text-anchor="start">holds loader_lock</text><path d="M121 146V197H358V147" class="line" marker-end="url(#arrow)"/><text x="239" y="190" class="sub" text-anchor="middle">A waits for loader_lock</text><path d="M360 57V43H121V57" class="line" marker-end="url(#arrow)"/><text x="239" y="41" class="sub" text-anchor="middle">B waits for game_lock</text><text x="16" y="238" class="sub" text-anchor="start">Each thread needs the lock the other thread holds.</text>
</svg>
