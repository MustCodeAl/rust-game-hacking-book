<svg xmlns="http://www.w3.org/2000/svg" width="480" height="298" viewBox="0 0 480 298" role="img" aria-labelledby="title desc">
<title id="title">Bytecodes change the value stack</title><desc id="desc">The teaching VM executes Constant(0) at bytecode index 0 to push 5, Constant(1) at index 1 to push 2, then Add at index 2 to pop both values and push 7. The dashed outlines are the stack with its top above the older value.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/12/07.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.88rem}.title{font-size:1rem;font-weight:700}.strong{font-weight:700}.sub{font-size:.82rem}.mono{font-family:ui-monospace,monospace;font-size:.88rem}.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}.line{fill:none;stroke:currentColor;stroke-width:.1rem}.dashed{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}.dot{fill:currentColor;stroke:currentColor}.open{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.1rem}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">Bytecodes change the value stack</text>
<text x="25" y="62" class="mono" text-anchor="start">PC 0: Constant(0)</text><text x="180" y="62" class="mono" text-anchor="start">PC 1: Constant(1)</text><text x="338" y="62" class="mono" text-anchor="start">PC 2: Add</text><rect x="28" y="84" width="95" height="131" rx="5" class="dashed"/><rect x="34" y="170" width="83" height="38" rx="5" class="box"/><text x="76" y="195" class="mono" text-anchor="middle">5</text><rect x="184" y="84" width="95" height="131" rx="5" class="dashed"/><rect x="190" y="170" width="83" height="38" rx="5" class="box"/><text x="232" y="195" class="mono" text-anchor="middle">5</text><rect x="190" y="127" width="83" height="38" rx="5" class="box"/><text x="232" y="152" class="mono" text-anchor="middle">2</text><rect x="340" y="84" width="95" height="131" rx="5" class="dashed"/><rect x="346" y="170" width="83" height="38" rx="5" class="box"/><text x="388" y="195" class="mono" text-anchor="middle">7</text><path d="M128 143L177 143" class="line" marker-end="url(#arrow)"/><path d="M283 143L333 143" class="line" marker-end="url(#arrow)"/><text x="76" y="239" class="sub" text-anchor="middle">push 5</text><text x="232" y="239" class="sub" text-anchor="middle">push 2</text><text x="388" y="239" class="sub" text-anchor="middle">pop 2; push 7</text><text x="16" y="276" class="sub" text-anchor="start">Constant pool: index 0 = 5, index 1 = 2.</text>
</svg>
