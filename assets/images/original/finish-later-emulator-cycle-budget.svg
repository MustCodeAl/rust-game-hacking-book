="box"/><text x="210.0" y="203.46" class="mono" text-anchor="middle">15</text><rect x="298" y="178" width="90" height="38" rx="0" class="box"/><text x="343.0" y="203.46" class="mono" text-anchor="middle">20</text><path d="M127 197L158 197" class="line" marker-end="url(#arrow)"/><path d="M260 197L291 197" class="line" marker-end="url(#arrow)"/><text x="77" y="241" class="sub" text-anchor="middle">initial gold</text><text x="210" y="241" class="sub" text-anchor="middle">after pass 1</text><text x="343" y="241" class="sub" text-anchor="middle">after pass 2</text><text x="16" y="278" class="sub" text-anchor="start">The ending writes display 20 and halts.</text>
