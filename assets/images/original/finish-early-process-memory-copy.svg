<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">The copy crosses the process boundary</title><desc id="desc">In a separate four-byte example, the game stores 64 00 00 00 at address 0x5000, which represents little-endian u32 100. Windows checks the target handle and copies those bytes into the tool-owned buffer. The tool decodes its own copy; its local pointer 0x5000 would use a different address map.</desc>
<metadata>Original Game Hacking Academy geometric teaching artwork. Dedicated to the public domain under CC0 1.0 Universal. No third-party imagery or fonts embedded. Reproduce with site/scripts/make-finish-early-art.py.</metadata>
