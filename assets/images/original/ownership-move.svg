<svg xmlns="http://www.w3.org/2000/svg" width="480" height="190" viewBox="0 0 480 190" role="img" aria-labelledby="t d"><title id="t">Moving ownership of a String</title><desc id="d">Before the move, s1 owns the heap text gold. After let s2 equals s1, s2 owns it and s1 can no longer be used. The text is not copied.</desc><metadata>Original geometric artwork. Public domain dedication: CC0 1.0 Universal.</metadata><style>text{font-family:Arial,Helvetica,sans-serif;fill:#25343d}.m{font-family:Menlo,Consolas,monospace}.s{fill:#63727c}</style><defs><marker id="a" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#bd592c"/></marker></defs><rect width="480" height="190" fill="#fff"/><text x="20" y="26" font-size="16" font-weight="700">A move hands over the owner; nothing is copied</text>
<g class="m" font-size="13" text-anchor="middle"><rect x="30" y="52" width="100" height="34" rx="6" fill="#edf0f1" stroke="#63727c" stroke-dasharray="4 3"/><text x="80" y="74" class="s">s1 (moved)</text><rect x="30" y="104" width="100" height="34" rx="6" fill="#fceddf" stroke="#bd592c" stroke-width="2"/><text x="80" y="126">s2 (owner)</text><rect x="300" y="78" width="150" height="40" rx="6" fill="#e2f0f5" stroke="#4388aa"/><text x="375" y="103">"gold" on the heap</text></g>
<g stroke="#bd592c" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M130 121C210 121 230 104 296 100"/></g><path d="M130 69C200 69 220 90 296 94" stroke="#63727c" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
<text x="20" y="168" font-size="13">After the move only s2 may use the text, so it is freed exactly once.</text></svg>
