<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200" role="img" aria-labelledby="t d"><title id="t">The server decides what a client may do</title><desc id="d">A client sends a request to move to x equals 900. The server knows the player was at x equals 100 and may move at most 5 per tick, so it refuses the jump and keeps the player near 100.</desc><metadata>Original geometric artwork. Public domain dedication: CC0 1.0 Universal.</metadata><style>text{font-family:Arial,Helvetica,sans-serif;fill:#25343d}.m{font-family:Menlo,Consolas,monospace}.s{fill:#63727c}</style><defs><marker id="a" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#63727c"/></marker></defs><rect width="480" height="200" fill="#fff"/><text x="20" y="26" font-size="16" font-weight="700">The server checks; the client only asks</text>
<g font-size="13"><rect x="20" y="52" width="130" height="70" rx="8" fill="#e2f0f5" stroke="#4388aa"/><text x="85" y="76" text-anchor="middle" font-weight="700">client</text><text x="85" y="98" text-anchor="middle" class="m" font-size="12">"move to x = 900"</text><rect x="330" y="52" width="130" height="70" rx="8" fill="#fceddf" stroke="#bd592c" stroke-width="2"/><text x="395" y="76" text-anchor="middle" font-weight="700">server</text><text x="395" y="96" text-anchor="middle" class="m" font-size="11">was at 100</text><text x="395" y="112" text-anchor="middle" class="m" font-size="11">max step 5</text></g>
<g stroke="#63727c" stroke-width="1.6" fill="none" marker-end="url(#a)"><path d="M150 76H326"/><path d="M326 104H154" stroke-dasharray="5 4"/></g>
<text x="240" y="68" font-size="11" text-anchor="middle" class="s">request</text><text x="240" y="122" font-size="11" text-anchor="middle" class="s">reply: still near 100</text>
<text x="20" y="160" font-size="13">A jump of 800 is more than 5 per tick, so the server refuses it.</text><text x="20" y="180" font-size="13">Whatever the client claims, the server's rules decide the game state.</text></svg>
