<svg xmlns="http://www.w3.org/2000/svg" width="480" height="312" viewBox="0 0 480 312" role="img" aria-labelledby="title desc">
<title id="title">Field evidence includes relationships</title><desc id="desc">The candidate object has four-byte health at 0x138 through 0x13B and max health at 0x13C through 0x13F. A clamp relates their symbolic values H and M by zero less than or equal to H less than or equal to M. These offsets belong to one exact build.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/13/06.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
