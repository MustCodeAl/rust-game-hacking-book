<svg xmlns="http://www.w3.org/2000/svg" width="480" height="299" viewBox="0 0 480 299" role="img" aria-labelledby="title desc">
<title id="title">Visibility changes what is sent</title><desc id="desc">In the toy wall example, the server knows an enemy position but withholds it when the wall blocks the observer’s sightline. When the enemy moves above the wall and the sightline clears, the position enters this client’s observation.</desc>
<metadata>Original geometric artwork authored for Game Hacking Academy, 2026-10-08. Public domain dedication: CC0 1.0 Universal. Source: site/scripts/make-finish-later-art.py. Concept and worked values from site/src/content/docs/pages/15/02.mdx; any separate illustrative example is identified in the caption. No third-party image assets.</metadata>
