<svg xmlns="http://www.w3.org/2000/svg" width="480" height="390" viewBox="0 0 480 390" role="img" aria-labelledby="title desc">
<title id="title">A return address has a real stack slot</title>
<desc id="desc">In an illustrative 32-bit near call, ESP starts at 0x0012FF90. A five-byte call at 0x00401020 pushes return address 0x00401025 at 0x0012FF8C. Saving EBP places the old value 0x0012FFC0 at 0x0012FF88. EBP becomes 0x0012FF88 and sixteen local bytes lower ESP to 0x0012FF78. The epilogue restores EBP; plain RET pops the saved instruction address and returns ESP to 0x0012FF90. No arguments or actual course-game addresses are modeled.</desc>
<metadata>Original geometric teaching artwork authored for Game Hacking Academy, 2026-10-09. Public domain dedication: CC0 1.0 Universal, https://creativecommons.org/publicdomain/zero/1.0/. Concept and illustrative values belong to site/src/content/docs/pages/2/05.mdx. No third-party image assets. Diagram dimensions and placements are schematic.</metadata>
<style>svg{color:var(--ink,CanvasText);background:var(--paper,Canvas)}
text{font-family:system-ui,sans-serif;fill:currentColor;font-size:.9rem}
.title{font-size:1rem;font-weight:700}.key{font-weight:700}.sub{font-size:.82rem}
.mono{font-family:ui-monospace,monospace;font-size:.86rem}
.box{fill:var(--paper,Canvas);stroke:currentColor;stroke-width:.09rem}
.line{fill:none;stroke:currentColor;stroke-width:.1rem}
.dash{fill:none;stroke:currentColor;stroke-width:.09rem;stroke-dasharray:.3rem .2rem}
.hatch{fill:url(#hatch);stroke:currentColor;stroke-width:.09rem}
.halo{paint-order:stroke;stroke:var(--paper,Canvas);stroke-width:.22rem;stroke-linejoin:round}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="currentColor"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" class="line"/></pattern></defs>
<text x="16" y="26" class="title" text-anchor="start">A return address has a real stack slot</text>
<text x="16" y="54" class="sub" text-anchor="start">Illustrative 32-bit EBP frame · addresses in hex</text>
<text x="16" y="85" class="sub" text-anchor="start">address</text>
<text x="168" y="85" class="sub" text-anchor="start">contents while the callee runs</text>
<rect x="152" y="96" width="240" height="38" class="box"/>
<text x="16" y="120" class="mono" text-anchor="start">0012FF90</text>
<text x="166" y="120" class="sub" text-anchor="start">caller’s existing stack</text>
<rect x="152" y="134" width="240" height="38" class="box"/>
<text x="16" y="158" class="mono" text-anchor="start">0012FF8C</text>
<text x="166" y="158" class="mono" text-anchor="start">return: 00401025</text>
<rect x="152" y="172" width="240" height="38" class="box"/>
<text x="16" y="196" class="mono" text-anchor="start">0012FF88</text>
<text x="166" y="196" class="mono" text-anchor="start">old EBP: 0012FFC0</text>
<rect x="152" y="210" width="240" height="60" class="box"/>
<text x="16" y="250" class="mono" text-anchor="start">0012FF78</text>
<text x="166" y="246" class="sub" text-anchor="start">16 bytes of locals</text>
<path d="M454 96V266" class="line" marker-end="url(#arrow)"/>
<text x="454" y="286" class="sub" text-anchor="middle">lower</text>
<text x="406" y="194" class="mono" text-anchor="start">EBP</text>
<path d="M403 188H394" class="line" marker-end="url(#arrow)"/>
<text x="406" y="250" class="mono" text-anchor="start">ESP</text>
<path d="M403 246H394" class="line" marker-end="url(#arrow)"/>
<text x="16" y="311" class="sub" text-anchor="start">Call saves the next instruction address in four bytes.</text>
<text x="16" y="335" class="sub" text-anchor="start">The epilogue releases locals and restores EBP.</text>
<text x="16" y="359" class="mono" text-anchor="start">RET: EIP = 00401025 · ESP = 0012FF90</text>
<text x="16" y="382" class="sub" text-anchor="start">Popping the slot need not erase its old bytes.</text>
</svg>
