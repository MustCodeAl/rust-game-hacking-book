<svg xmlns="http://www.w3.org/2000/svg" width="614" height="190" viewBox="0 0 614 190" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="306.00" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Proxy that gets checked</text><rect x="307.00" y="1" width="306.00" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="314.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Property that actually matters</text><rect x="1.00" y="29" width="306.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Menu button is enabled</text><rect x="307.00" y="29" width="306.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="314.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Engine policy permits the state change</text><rect x="1.00" y="57" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">One field’s checksum matches</text><rect x="307.00" y="57" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="314.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The complete object relation is current</text><text x="314.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">and valid</text><rect x="1.00" y="101" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="119" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">One environment signal is absent</text><rect x="307.00" y="101" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="314.00" y="119" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The requested command satisfies game</text><text x="314.00" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">rules</text><rect x="1.00" y="145" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="163" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">An old object still has a plausible</text><text x="8.00" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">address</text><rect x="307.00" y="145" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="314.00" y="163" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The identity and generation still match</text></svg>