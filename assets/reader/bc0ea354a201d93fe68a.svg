<svg xmlns="http://www.w3.org/2000/svg" width="680" height="166" viewBox="0 0 680 166" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="130.21" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Processing</text><text x="8.00" y="35" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">style</text><rect x="131.21" y="1" width="274.46" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="138.21" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Game-service example</text><rect x="405.67" y="1" width="273.33" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="412.67" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">What it must account for</text><rect x="1.00" y="45" width="130.21" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Stream processi</text><text x="8.00" y="79" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">ng</text><rect x="131.21" y="45" width="274.46" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="138.21" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Update a match’s statistics as</text><text x="138.21" y="79" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">accepted events arrive</text><rect x="405.67" y="45" width="273.33" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="412.67" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Ordering, late events, duplicates,</text><text x="412.67" y="79" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">and how quickly the result is</text><text x="412.67" y="95" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">needed</text><rect x="1.00" y="105" width="130.21" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Batch processin</text><text x="8.00" y="139" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">g</text><rect x="131.21" y="105" width="274.46" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="138.21" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Recompute a leaderboard from a</text><text x="138.21" y="139" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">collected set of finished-match</text><text x="138.21" y="155" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">results</text><rect x="405.67" y="105" width="273.33" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="412.67" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Which results belong to the batch,</text><text x="412.67" y="139" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">when it runs, and how to repeat it</text><text x="412.67" y="155" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">safely</text></svg>