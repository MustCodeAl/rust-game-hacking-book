<svg xmlns="http://www.w3.org/2000/svg" width="680" height="162" viewBox="0 0 680 162" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="107.40" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Policy</text><rect x="108.40" y="1" width="270.81" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="115.40" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Behavior</text><rect x="379.21" y="1" width="299.79" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="386.21" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Suitable use</text><rect x="1.00" y="29" width="107.40" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Allow</text><rect x="108.40" y="29" width="270.81" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="115.40" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Nested calls execute callback again</text><rect x="379.21" y="29" width="299.79" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="386.21" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Callback is pure and recursion is</text><text x="386.21" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">expected</text><rect x="1.00" y="73" width="107.40" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Bypass neste</text><text x="8.00" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">d</text><rect x="108.40" y="73" width="270.81" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="115.40" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Nested call uses original path</text><rect x="379.21" y="73" width="299.79" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="386.21" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Logging or observation that may call</text><text x="386.21" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">related code</text><rect x="1.00" y="117" width="107.40" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Reject</text><rect x="108.40" y="117" width="270.81" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="115.40" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Nested entry returns a defined</text><text x="115.40" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">error</text><rect x="379.21" y="117" width="299.79" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="386.21" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Fixture where recursion is invalid</text></svg>