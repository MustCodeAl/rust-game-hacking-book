<svg xmlns="http://www.w3.org/2000/svg" width="512" height="170" viewBox="0 0 512 170" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="240.30" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">What changed</text><rect x="241.30" y="1" width="269.50" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="248.30" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">What it does not prove</text><rect x="1.00" y="29" width="240.30" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">camera no longer rises</text><rect x="241.30" y="29" width="269.50" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="248.30" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">projectile spread is gone</text><rect x="1.00" y="57" width="240.30" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">weapon model stops moving</text><rect x="241.30" y="57" width="269.50" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="248.30" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">aim direction is unchanged</text><rect x="1.00" y="85" width="240.30" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">pitch write disappears</text><rect x="241.30" y="85" width="269.50" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="248.30" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">no later camera transform adds kick</text><rect x="1.00" y="113" width="240.30" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">repeated shots look similar</text><rect x="241.30" y="113" width="269.50" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="248.30" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">recoil is fully deterministic</text><rect x="1.00" y="141" width="240.30" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="159" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">one weapon uses an offset table</text><rect x="241.30" y="141" width="269.50" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="248.30" y="159" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">every weapon uses that table</text></svg>