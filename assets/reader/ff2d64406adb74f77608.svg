<svg xmlns="http://www.w3.org/2000/svg" style="background-color:var(--diagram-paper, #ffffff)" viewBox="0 0 480 318" focusable="false"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><defs><marker id="scene-chat-client-head-input" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="input" d="M0 0L10 5L0 10z" /></marker><marker id="scene-chat-client-head-state" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="state" d="M0 0L10 5L0 10z" /></marker><marker id="scene-chat-client-head-process" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="process" d="M0 0L10 5L0 10z" /></marker><marker id="scene-chat-client-head-output" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="output" d="M0 0L10 5L0 10z" /></marker><marker id="scene-chat-client-head-caution" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="caution" d="M0 0L10 5L0 10z" /></marker><marker id="scene-chat-client-head-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="muted" d="M0 0L10 5L0 10z" /></marker><marker id="scene-chat-client-head-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" d="M0 0L10 5L0 10z" /></marker></defs><g data-a="incomingTag" data-role="muted" transform="translate(20 24)"><text fill="#11151a" class="scene__label scene__free" font-size="13">Outbound: length + complete gzip payload</text></g><g data-a="header" data-role="input" transform="translate(20 39)" opacity="0"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="94" height="38" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="47" y="19" dy=".35em" text-anchor="middle" font-size="12">4-byte length</text></g><g data-a="compressed" data-role="input" transform="translate(334 39)" opacity="0"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="126" height="38" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="63" y="19" dy=".35em" text-anchor="middle" font-size="12">complete gzip payload</text></g><g data-a="decode" data-role="input" transform="translate(334 39)" opacity="0"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="126" height="38" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="63" y="19" dy=".35em" text-anchor="middle" font-size="13">gunzip + parse</text></g><g data-a="decodeRoute" data-role="process" transform="translate(310 58)" opacity="0"><path stroke="#59636f" fill="none" class="scene__line" data-arrow="1" data-len="20" d="M0 0L20 0" marker-end="url(#scene-chat-client-head-process)" /></g><g data-a="wmlBox" data-role="input" transform="translate(20 105)" opacity="0"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="205" height="89" rx="6" /></g><g data-a="wmlText" transform="translate(266 163)" opacity="0"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="12"><tspan x="0">message → text</tspan><tspan x="0" dy="1.35em">"\wave"</tspan></text></g><g data-a="session" data-role="state" transform="translate(255 105)" opacity="0"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="205" height="38" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="102.5" y="19" dy=".35em" text-anchor="middle" font-size="13">session: in the lobby</text></g><g data-a="event" data-role="output" transform="translate(255 220)" opacity="0"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="205" height="42" rx="5" /><text fill="#11151a" class="scene__label scene__mid scene__mono" x="102.5" y="21" dy=".35em" text-anchor="middle" font-size="12">\wave matches</text></g><g data-a="handler" data-role="process" transform="translate(255 216)" opacity="0"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="205" height="48" rx="5" /><text fill="#11151a" class="scene__label scene__mid scene__mono" x="102.5" y="24" dy=".35em" text-anchor="middle" font-size="12">text == "\wave" ?</text></g><g data-a="reply" data-role="output" transform="translate(119 105)" opacity="0"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="237" height="38" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="118.5" y="19" dy=".35em" text-anchor="middle" font-size="13">Hello! → gzip</text></g><g data-a="outFrame" transform="translate(109 105)"><g data-a="outLength" data-role="output" transform="translate(0 0)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="94" height="38" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="47" y="19" dy=".35em" text-anchor="middle" font-size="12">4-byte length</text></g><g data-a="outPayload" data-role="output" transform="translate(99 0)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="237" height="38" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="118.5" y="19" dy=".35em" text-anchor="middle" font-size="12">gzip WML: Hello!</text></g></g><g data-a="toSocket" data-role="output" transform="translate(20 166)"><path stroke="#59636f" fill="none" class="scene__line" data-arrow="1" data-len="434" d="M0 0L434 0" stroke-dasharray="434" stroke-dashoffset="0" marker-end="url(#scene-chat-client-head-output)" /></g><g data-a="status" data-role="process" transform="translate(20 297)"><text fill="#11151a" class="scene__label scene__free" font-size="13">TCP carries the frame; the peer recovers its boundary again.</text></g></svg>