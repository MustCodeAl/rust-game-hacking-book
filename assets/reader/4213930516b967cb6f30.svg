<svg xmlns="http://www.w3.org/2000/svg" width="527" height="226" viewBox="0 0 527 226" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="262.20" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Test input</text><rect x="263.20" y="1" width="262.20" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="270.20" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Expected failure</text><rect x="1.00" y="29" width="262.20" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Fewer than four bytes</text><rect x="263.20" y="29" width="262.20" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="270.20" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Truncated while reading the length</text><rect x="1.00" y="57" width="262.20" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Length larger than remaining bytes</text><rect x="263.20" y="57" width="262.20" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="270.20" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Truncated while taking the payload</text><rect x="1.00" y="85" width="262.20" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Length above the cap</text><rect x="263.20" y="85" width="262.20" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="270.20" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">TooLarge before decompression</text><rect x="1.00" y="113" width="262.20" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Valid frame plus one extra byte</text><rect x="263.20" y="113" width="262.20" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="270.20" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">TrailingBytes</text><rect x="1.00" y="141" width="262.20" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="159" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Broken gzip checksum</text><rect x="263.20" y="141" width="262.20" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="270.20" y="159" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">InvalidGzip</text><rect x="1.00" y="169" width="262.20" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="187" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Decompressed non-UTF-8 bytes</text><rect x="263.20" y="169" width="262.20" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="270.20" y="187" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">InvalidUtf8</text><rect x="1.00" y="197" width="262.20" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="215" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Quote inside a simple field</text><rect x="263.20" y="197" width="262.20" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="270.20" y="215" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Rejected before serialization</text></svg>