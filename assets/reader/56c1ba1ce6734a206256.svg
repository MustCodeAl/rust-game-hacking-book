, monospace" font-size="12" font-weight="400">2,147,483,647</text><rect x="1.00" y="157" width="79.70" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="175" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">f32</text><rect x="80.70" y="157" width="65.10" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="87.70" y="175" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">4 bytes</text><rect x="145.80" y="157" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="152.80" y="175" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">a number that can have a fractional</text><text x="152.80" y="191" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">part, such as 3.5</text><rect x="1.00" y="201" width="79.70" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="219" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">f64</text><rect x="80.70" y="201" width="65.10" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="87.70" y="219" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">8 bytes</text><rect x="145.80" y="201" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="152.80" y="219" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">the same idea as f32, with more</text><text x="152.80" y="235" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">precision</text><rect x="1.00" y="245" width="79.70" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="263" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">bool</text><rect x="80.70" y="245" width="65.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="87.70" y="263" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">1 byte</text><rect x="145.80" y="245" width="306.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="152.80" y="263" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">0 means false, 1 means true</text></svg>