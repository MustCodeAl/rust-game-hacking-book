ight="400">Secret required</text><rect x="173.02" y="73" width="207.22" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="180.02" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Often no durable secret</text><rect x="380.24" y="73" width="298.76" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="387.24" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Yes</text><rect x="1.00" y="101" width="172.02" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="119" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Repeated values</text><rect x="173.02" y="101" width="207.22" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="180.02" y="119" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">May reveal obvious</text><text x="180.02" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">patterns</text><rect x="380.24" y="101" width="298.76" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="387.24" y="119" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Nonces should make ciphertexts differ</text><rect x="1.00" y="145" width="172.02" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="163" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Modification</text><text x="8.00" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">detection</text><rect x="173.02" y="145" width="207.22" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="180.02" y="163" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Optional ad-hoc tag</text><rect x="380.24" y="145" width="298.76" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="387.24" y="163" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Authentication tag is part of the</text><text x="387.24" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">design</text><rect x="1.00" y="189" width="172.02" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="207" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Analysis result</text><rect x="173.02" y="189" width="207.22" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="180.02" y="207" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Recover the transform</text><rect x="380.24" y="189" width="298.76" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="387.24" y="207" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Identify algorithm, key/nonce</text><text x="387.24" y="223" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">lifecycle, and boundaries</text></svg>