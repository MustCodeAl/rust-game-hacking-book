ospace" font-size="12" font-weight="400">Grid</text><rect x="161.59" y="253" width="161.13" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="168.59" y="271" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">rows and columns</text><rect x="322.72" y="253" width="173.88" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="329.72" y="271" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">map tiles at (row,</text><text x="329.72" y="287" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">column)</text><rect x="496.60" y="253" width="182.40" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="503.60" y="271" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">boundaries must be</text><text x="503.60" y="287" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">checked</text><rect x="1.00" y="297" width="160.59" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="315" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Graph</text><rect x="161.59" y="297" width="161.13" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="168.59" y="315" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">places and their</text><text x="168.59" y="331" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">connections</text><rect x="322.72" y="297" width="173.88" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="329.72" y="315" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">waypoints and</text><text x="329.72" y="331" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">reachable paths</text><rect x="496.60" y="297" width="182.40" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="503.60" y="315" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">you must store and</text><text x="503.60" y="331" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">inspect the connections</text></svg>