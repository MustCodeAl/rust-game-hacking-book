rs,</text><text x="329.72" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">three prices</text><rect x="496.60" y="29" width="182.40" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="503.60" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">its count does not grow</text><rect x="1.00" y="73" width="160.59" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Vector, Vec&lt;T&gt;</text><rect x="161.59" y="73" width="161.13" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="168.59" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">numbered slots that</text><text x="168.59" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">can grow</text><rect x="322.72" y="73" width="173.88" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="329.72" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">players joining or a</text><text x="329.72" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">history of health</text><text x="329.72" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">samples</text><rect x="496.60" y="73" width="182.40" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="503.60" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">removing from the</text><text x="503.60" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">middle shifts later</text><text x="503.60" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">items</text><rect x="1.00" y="133" width="160.59" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Hash map, HashMap&lt;K,</text><text x="8.00" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">V&gt;</text><rect x="161.59" y="133" width="161.13" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="168.59" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">a key pointing to</text><text x="168.59" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">its value</text><rect x="322.72" y="133" width="173.88" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="329.72" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">find Ada’s gold by</text><text x="329.72" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">her name or ID</text><rect x="496.60" y="133" width="182.40" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="503.60" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">a key may be missing;</text><text x="503.60" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">order is not the</text><text x="503.60" y="183" fill="#1c2733" 