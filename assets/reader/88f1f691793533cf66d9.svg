<svg xmlns="http://www.w3.org/2000/svg" width="680" height="266" viewBox="0 0 680 266" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="108.90" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Section</text><rect x="109.90" y="1" width="285.29" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="116.90" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">What belongs there</text><rect x="395.19" y="1" width="283.81" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="402.19" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Who arranges it</text><rect x="1.00" y="29" width="108.90" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">.vector_table</text><rect x="109.90" y="29" width="285.29" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="116.90" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Initial stack value and handler</text><text x="116.90" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">addresses</text><rect x="395.19" y="29" width="283.81" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="402.19" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The linker places it; the loader or</text><text x="402.19" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">programmer supplies the image</text><rect x="1.00" y="73" width="108.90" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">.text</text><rect x="109.90" y="73" width="285.29" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="116.90" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Machine instructions</text><rect x="395.19" y="73" width="283.81" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="402.19" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The linker places executable code in</text><text x="402.19" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">flash for this image</text><rect x="1.00" y="117" width="108.90" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">.rodata</text><rect x="109.90" y="117" width="285.29" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="116.90" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Read-only data, such as message</text><text x="116.90" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">strings</text><rect x="395.19" y="117" width="283.81" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="402.19" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The linker places stored constants</text><text x="402.19" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">in flash</text><rect x="1.00" y="161" width="108.90" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">.data</text><rect x="109.90" y="161" width="285.29" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="116.90" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Writable statics with stored initial</text><text x="116.90" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">values</text><rect x="395.19" y="161" width="283.81" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="402.19" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The linker describes both ranges;</text><text x="402.19" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">reset startup copies initial</text><text x="402.19" y="211" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">contents from flash to RAM</text><rect x="1.00" y="221" width="108.90" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">.bss</text><rect x="109.90" y="221" width="285.29" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="116.90" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Writable statics initially filled</text><text x="116.90" y="255" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">with zero</text><rect x="395.19" y="221" width="283.81" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="402.19" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The linker reserves the range; reset</text><text x="402.19" y="255" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">startup fills it with zero</text></svg>