<svg xmlns="http://www.w3.org/2000/svg" width="527" height="198" viewBox="0 0 527 198" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="524.40" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Finish loading before starting the worker</text><rect x="1.00" y="29" width="269.50" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">1. Request the DLL load</text><rect x="270.50" y="29" width="254.90" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="277.50" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">LoadLibraryW requested</text><rect x="1.00" y="57" width="269.50" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">2. Prepare the module</text><rect x="270.50" y="57" width="254.90" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="277.50" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">sections mapped; imports resolved</text><rect x="1.00" y="85" width="269.50" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">3. Complete the loader notification</text><rect x="270.50" y="85" width="254.90" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="277.50" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">DllMain; loader lock held</text><rect x="1.00" y="113" width="269.50" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">4. Finish the loading operation</text><rect x="270.50" y="113" width="254.90" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="277.50" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">LoadLibraryW returned</text><rect x="1.00" y="141" width="269.50" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="159" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">5. Publish startup once</text><rect x="270.50" y="141" width="254.90" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="277.50" y="159" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">STARTED set; STOP = false</text><rect x="1.00" y="169" width="269.50" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="187" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">6. Run outside the loader callback</text><rect x="270.50" y="169" width="254.90" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="277.50" y="187" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">worker outside loader lock</text></svg>