<svg xmlns="http://www.w3.org/2000/svg" width="681" height="178" viewBox="0 0 681 178" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="184.31" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Example arrangement</text><rect x="185.31" y="1" width="243.84" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="192.31" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Message path</text><rect x="429.15" y="1" width="249.85" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="436.15" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Who calculates the accepted</text><text x="436.15" y="35" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">position here?</text><rect x="1.00" y="45" width="184.31" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Dedicated game server</text><rect x="185.31" y="45" width="243.84" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="192.31" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Each client talks to the server</text><text x="192.31" y="79" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">program.</text><rect x="429.15" y="45" width="249.85" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="436.15" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The server program.</text><rect x="1.00" y="89" width="184.31" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Player hosts the game</text><text x="8.00" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">server</text><rect x="185.31" y="89" width="243.84" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="192.31" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Clients talk to the server on a</text><text x="192.31" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">player’s computer.</text><rect x="429.15" y="89" width="249.85" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="436.15" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">That server program.</text><rect x="1.00" y="133" width="184.31" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Peers exchange inputs</text><rect x="185.31" y="133" width="243.84" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="192.31" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Players exchange the same</text><text x="192.31" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">ordered input history.</text><rect x="429.15" y="133" width="249.85" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="436.15" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Each peer runs the agreed</text><text x="436.15" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">deterministic simulation.</text></svg>