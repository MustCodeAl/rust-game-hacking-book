0z" /></marker></defs><g data-a="source" data-role="muted" transform="translate(24 25)"><text fill="#11151a" class="scene__label scene__free" font-size="13">One observed event</text></g><g data-a="event" data-role="input" transform="translate(24 82)" opacity="0"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="80" height="30" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="40" y="15" dy=".35em" text-anchor="middle" font-size="15">Event A</text></g><g data-a="copy0" data-role="state" transform="translate(330 86)" opacity="0"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="92" height="30" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="46" y="15" dy=".35em" text-anchor="middle" font-size="15">Game: A</text></g><g data-a="copy1" data-role="state" transform="translate(330 86)" opacity="0"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="92" height="30" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="46" y="15" dy=".35em" text-anchor="middle" font-size="15">Plugin: A</text></g><g data-a="copy2" data-role="state" transform="translate(330 86)" opacity="0"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="92" height="30" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="46" y="15" dy=".35em" text-anchor="middle" font-size="15">Report: A</text></g><g data-a="ledger" data-role="output" transform="translate(326 78)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="130" height="58" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="65" y="29" dy=".35em" text-anchor="middle" font-size="15">A, B: two events</text></g><g data-a="next" data-role="input" transform="translate(336 173)" opacity="0"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="80" height="30" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="40" y="15" dy=".35em" text-anchor="middle" font-size="15">Event B</text></g><g data-a="