<svg xmlns="http://www.w3.org/2000/svg" width="680" height="178" viewBox="0 0 680 178" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="210.77" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Model</text><rect x="211.77" y="1" width="232.35" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="218.77" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">A possible game use</text><rect x="444.11" y="1" width="234.89" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="451.11" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">What the structure makes</text><text x="451.11" y="35" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">explicit</text><rect x="1.00" y="45" width="210.77" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Nested document, such as</text><text x="8.00" y="79" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">JSON or XML</text><rect x="211.77" y="45" width="232.35" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="218.77" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">One save with a character and</text><text x="218.77" y="79" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">inventory entries</text><rect x="444.11" y="45" width="234.89" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="451.11" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Containment and named fields</text><rect x="1.00" y="89" width="210.77" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Relational tables</text><rect x="211.77" y="89" width="232.35" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="218.77" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Character rows and item rows</text><text x="218.77" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">linked by owner IDs</text><rect x="444.11" y="89" width="234.89" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="451.11" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Records, keys, and</text><text x="451.11" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">relationships between tables</text><rect x="1.00" y="133" width="210.77" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Graph of nodes and edges</text><rect x="211.77" y="133" width="232.35" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="218.77" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Map locations joined by</text><text x="218.77" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">traversable routes</text><rect x="444.11" y="133" width="234.89" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="451.11" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Connections, and properties of</text><text x="451.11" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">each connection</text></svg>