0 5L0 10z" /></marker></defs><g data-a="screen" data-role="input" transform="translate(20 20)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="210" height="210" rx="8" /></g><g data-a="screenTag" data-role="muted" transform="translate(36 44)"><text fill="#11151a" class="scene__label scene__free" font-size="12">game screen</text></g><g data-a="goldLabel" transform="translate(36 84)"><text fill="#11151a" class="scene__label scene__free" font-size="15">Gold</text></g><g data-a="gold" transform="translate(36 128)"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="40" font-weight="700">475</text></g><g data-a="buy" data-role="process" transform="translate(36 160)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="178" height="48" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="89" y="24" dy=".35em" text-anchor="middle" font-size="15">Buy item (25)</text></g><g data-a="click" data-role="caution" transform="translate(125 184)" opacity="0"><circle stroke="#59636f" fill="#edf2f7" class="scene__rect" r="6" /></g><g data-a="cost" data-role="caution" transform="translate(140 156)" opacity="0"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="15">−25</text></g><g data-a="memory" data-role="state" transform="translate(250 20)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="210" height="210" rx="8" /></g><g data-a="memTag" data-role="muted" transform="translate(266 44)"><text fill="#11151a" class="scene__label scene__free" font-size="12">memory</text></g><g data-a="candTag" data-role="muted" transform="translate(266 78)"><text fill="#11151a" class="scene__label scene__free" font-size="12">one candidate from a scan</text></g><g data-a="cand" data-role="output" transform="translate(266 88)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="150" height="56" rx="5" /><text fill="#11151a" class="scene__label scene__mid scene__mono" x="75" y="28" dy=".3