<svg xmlns="http://www.w3.org/2000/svg" width="577" height="142" viewBox="0 0 577 142" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="138.10" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Time scale</text><rect x="139.10" y="1" width="218.40" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="146.10" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Game time added by the frame</text><rect x="357.50" y="1" width="218.40" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="364.50" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">A 5.0 s cooldown ends after</text><rect x="1.00" y="29" width="138.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">1 (normal)</text><rect x="139.10" y="29" width="218.40" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="146.10" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">16.67 ms</text><rect x="357.50" y="29" width="218.40" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="364.50" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">5.0 ÷ 1 = 5.0 s of real time</text><rect x="1.00" y="57" width="138.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">0.5 (slow motion)</text><rect x="139.10" y="57" width="218.40" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="146.10" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">16.67 × 0.5 = 8.33 ms</text><rect x="357.50" y="57" width="218.40" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="364.50" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">5.0 ÷ 0.5 = 10.0 s</text><rect x="1.00" y="85" width="138.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">2 (fast forward)</text><rect x="139.10" y="85" width="218.40" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="146.10" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">16.67 × 2 = 33.33 ms</text><rect x="357.50" y="85" width="218.40" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="364.50" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">5.0 ÷ 2 = 2.5 s</text><rect x="1.00" y="113" width="138.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">0 (paused)</text><rect x="139.10" y="113" width="218.40" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="146.10" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">0 ms</text><rect x="357.50" y="113" width="218.40" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="364.50" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">never, while paused</text></svg>