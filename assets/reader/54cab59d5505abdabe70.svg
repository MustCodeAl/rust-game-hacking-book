</style><title>Lesson table</title><rect x="1.00" y="1" width="187.59" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Claim</text><rect x="188.59" y="1" width="247.23" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="195.59" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Check</text><rect x="435.82" y="1" width="243.18" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="442.82" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">What the demo run showed</text><rect x="1.00" y="29" width="187.59" height="76" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">+0x14 is the state</text><rect x="188.59" y="29" width="247.23" height="76" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="195.59" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">it changes exactly when the</text><text x="195.59" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">guard’s behavior changes</text><rect x="435.82" y="29" width="243.18" height="76" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="442.82" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">0, then 1 from tick 3 (chase),</text><text x="442.82" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">2 on tick 7 (attack), 3 from</text><text x="442.82" y="79" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">tick 8 (search), 0 from tick</text><text x="442.82" y="95" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">13: settled</text><rect x="1.00" y="105" width="187.59" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">+0x18 is seen_for</text><rect x="188.59" y="105" width="247.23" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="195.59" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">it rises by 1 per tick in</text><text x="195.59" y="139" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">sight, and drops to 0 when</text><text x="195.59" y="155" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">sight is lost</text><rect x="435.82" y="105" width="243.18" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="442.82" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">1 to 7 on ticks 1 to 7, then 0:</text><text x="442.82" y="139" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">settled</text><rect x="1.00" y="165" width="187.59" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="183" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">+0x1C is search_ticks</text><rect x="188.59" y="165" width="247.23" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="195.59" y="183" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">it counts while the guard</text><text x="195.59" y="199" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">searches</text><rect x="435.82" y="165" width="243.18" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="442.82" y="183" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">0 to 4 on ticks 8 to 12:</text><text x="442.82" y="199" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">settled</text><rect x="1.00" y="209" width="187.59" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="227" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">+0x10 is health</text><rect x="188.59" y="209" width="247.23" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="195.59" y="227" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">it falls by the damage when the</text><text x="195.59" y="243" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">guard is hit</text><rect x="435.82" y="209" width="243.18" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="442.82" y="227" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">100 on every tick, but nothing</text><text x="442.82" y="243" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">hit the guard: still open</text><rect x="1.00" y="253" width="187.59" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="271" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">+0x15 to +0x17 are</text><text x="8.00" y="287" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">padding</text><rect x="188.59" y="253" width="247.23" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="195.59" y="271" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">no instruction reads or writes</text><text x="195.59" y="287" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">them</text><rect x="435.82" y="253" width="243.18" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="442.82" y="271" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">not checked yet</text></svg>