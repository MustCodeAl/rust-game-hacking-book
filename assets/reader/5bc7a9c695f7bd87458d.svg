<svg xmlns="http://www.w3.org/2000/svg" width="556" height="190" viewBox="0 0 556 190" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="247.60" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Error</text><rect x="248.60" y="1" width="306.00" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="255.60" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Likely meaning</text><rect x="1.00" y="29" width="247.60" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">noncanonical virtual address</text><rect x="248.60" y="29" width="306.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="255.60" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">typo or wrong architecture assumption</text><rect x="1.00" y="57" width="247.60" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">PML4/PDPT/PD/PT not present</text><rect x="248.60" y="57" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="255.60" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">page absent, wrong CR3, or incomplete</text><text x="255.60" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">capture</text><rect x="1.00" y="101" width="247.60" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="119" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">physical range outside capture</text><rect x="248.60" y="101" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="255.60" y="119" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">corrupt entry or capture omitted that</text><text x="255.60" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">RAM range</text><rect x="1.00" y="145" width="247.60" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="163" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">plausible bytes but wrong object</text><rect x="248.60" y="145" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="255.60" y="163" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">wrong address space, stale pointer, or</text><text x="255.60" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">wrong build model</text></svg>