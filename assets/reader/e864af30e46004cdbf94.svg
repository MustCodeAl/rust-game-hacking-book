<svg xmlns="http://www.w3.org/2000/svg" width="497" height="142" viewBox="0 0 497 142" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="79.70" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Operation</text><rect x="80.70" y="1" width="123.50" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="87.70" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Rust expression</text><rect x="204.20" y="1" width="291.40" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="211.20" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Effect on one selected bit</text><rect x="1.00" y="29" width="79.70" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">AND</text><rect x="80.70" y="29" width="123.50" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="87.70" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">value &amp; mask</text><rect x="204.20" y="29" width="291.40" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="211.20" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Keep only selected 1 bits</text><rect x="1.00" y="57" width="79.70" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">OR</text><rect x="80.70" y="57" width="123.50" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="87.70" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">value | mask</text><rect x="204.20" y="57" width="291.40" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="211.20" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Set selected bits to 1</text><rect x="1.00" y="85" width="79.70" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">XOR</text><rect x="80.70" y="85" width="123.50" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="87.70" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">value ^ mask</text><rect x="204.20" y="85" width="291.40" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="211.20" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Flip selected bits</text><rect x="1.00" y="113" width="79.70" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">NOT</text><rect x="80.70" y="113" width="123.50" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="87.70" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">!value</text><rect x="204.20" y="113" width="291.40" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="211.20" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Flip every bit within the value’s type</text></svg>