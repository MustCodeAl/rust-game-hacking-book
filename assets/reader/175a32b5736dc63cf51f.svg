<svg xmlns="http://www.w3.org/2000/svg" width="483" height="198" viewBox="0 0 483 198" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="480.60" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Follow one imported call before, during, and after the hook</text><rect x="1.00" y="29" width="233.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">1. Identify the import</text><rect x="234.00" y="29" width="247.60" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="241.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">user32.dll!MessageBoxW</text><rect x="1.00" y="57" width="233.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">2. Find the matching slot</text><rect x="234.00" y="57" width="247.60" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="241.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">name index → four-byte IAT slot</text><rect x="1.00" y="85" width="233.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">3. Keep the original route</text><rect x="234.00" y="85" width="247.60" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="241.00" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">saved pointer → real MessageBoxW</text><rect x="1.00" y="113" width="233.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">4. Install the replacement</text><rect x="234.00" y="113" width="247.60" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="241.00" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">IAT slot → hooked_message_box</text><rect x="1.00" y="141" width="233.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="159" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">5. Follow the redirected call</text><rect x="234.00" y="141" width="247.60" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="241.00" y="159" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">replacement → saved original</text><rect x="1.00" y="169" width="233.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="187" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">6. Restore the normal route</text><rect x="234.00" y="169" width="247.60" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="241.00" y="187" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">IAT slot → real MessageBoxW</text></svg>