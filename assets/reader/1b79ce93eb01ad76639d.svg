<svg xmlns="http://www.w3.org/2000/svg" style="background-color:var(--diagram-paper, #ffffff)" viewBox="0 0 480 318" focusable="false"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><defs><marker id="scene-source-to-process-head-input" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="input" d="M0 0L10 5L0 10z" /></marker><marker id="scene-source-to-process-head-state" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="state" d="M0 0L10 5L0 10z" /></marker><marker id="scene-source-to-process-head-process" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="process" d="M0 0L10 5L0 10z" /></marker><marker id="scene-source-to-process-head-output" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="output" d="M0 0L10 5L0 10z" /></marker><marker id="scene-source-to-process-head-caution" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="caution" d="M0 0L10 5L0 10z" /></marker><marker id="scene-source-to-process-head-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="muted" d="M0 0L10 5L0 10z" /></marker><marker id="scene-source-to-process-head-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" d="M0 0L10 5L0 10z" /></marker></defs><g data-a="st0" data-role="state" transform="translate(24 12)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="69" height="28" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="34.5" y="14" dy=".35em" text-anchor="middle" font-size="12">source</text></g><g data-a="st1" data-role="state" transform="translate(97 12)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="69" height="28" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="34.5" y="14" dy=".35em" text-anchor="middle" font-size="12">compile</text></g><g data-a="st2" data-role="state" transform="translate(170 12)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="69" height="28" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="34.5" y="14" dy=".35em" text-anchor="middle" font-size="12">link</text></g><g data-a="st3" data-role="state" transform="translate(243 12)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="69" height="28" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="34.5" y="14" dy=".35em" text-anchor="middle" font-size="12">on disk</text></g><g data-a="st4" data-role="state" transform="translate(316 12)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="69" height="28" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="34.5" y="14" dy=".35em" text-anchor="middle" font-size="12">load</text></g><g data-a="st5" data-role="process" transform="translate(389 12)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="69" height="28" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="34.5" y="14" dy=".35em" text-anchor="middle" font-size="12">run</text></g><g data-a="card" data-role="muted" transform="translate(24 56)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect scene__rect--plain" width="432" height="246" rx="8" /></g><g data-a="hdr" transform="translate(40 86)"><text fill="#11151a" class="scene__label scene__free" font-size="15" font-weight="700">running process</text></g><g data-a="bar1" data-role="process" transform="translate(34 98)" opacity="0"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="412" height="30" rx="4" /></g><g data-a="bar2" data-role="process" transform="translate(34 138)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="412" height="30" rx="4" /></g><g data-a="bar3" data-role="process" transform="translate(34 178)" opacity="0"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="412" height="30" rx="4" /></g><g data-a="l1" transform="translate(44 118)"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="14">sub [ecx+0x30], eax</text></g><g data-a="l2" transform="translate(44 158)" opacity="0"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="14">add [????], 5</text></g><g data-a="l2a" transform="translate(44 158)"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="14">add [</text></g><g data-a="l2n" transform="translate(86 158)"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="14">0x00AF3010</text></g><g data-a="l2b" transform="translate(170 158)"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="14">], 5</text></g><g data-a="l3" transform="translate(44 198)"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="13">loaded at 0x00A50000, not at the preferred base</text></g><g data-a="delta" data-role="caution" transform="translate(300 142)" opacity="0"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="140" height="22" rx="5" /><text fill="#11151a" class="scene__label scene__mid scene__mono" x="70" y="11" dy=".35em" text-anchor="middle" font-size="12">+ 0x00650000</text></g><g data-a="eip" data-role="process" transform="translate(22 153)"><polygon stroke="#59636f" fill="#edf2f7" class="scene__rect" points="0,-7 11,0 0,7" /></g><g data-a="n2" transform="translate(40 232)" opacity="0"><text fill="#11151a" class="scene__label scene__free" font-size="13"><tspan x="0">"health" is gone: only its distance from the object</tspan><tspan x="0" dy="1.35em">base, 0x30 (48 bytes), is left. gold has no address yet.</tspan></text></g><g data-a="n3" transform="translate(40 232)" opacity="0"><text fill="#11151a" class="scene__label scene__free" font-size="13"><tspan x="0">The linker gave gold an address inside the image:</tspan><tspan x="0" dy="1.35em">preferred base 0x00400000 + 0x0A3010 = 0x004A3010.</tspan></text></g><g data-a="n4" transform="translate(40 232)" opacity="0"><text fill="#11151a" class="scene__label scene__free" font-size="13"><tspan x="0">The file records its preferred base and the imports it</tspan><tspan x="0" dy="1.35em">needs. Its addresses assume the image sits at that base.</tspan></text></g><g data-a="n5" transform="translate(40 232)" opacity="0"><text fill="#11151a" class="scene__label scene__free" font-size="13"><tspan x="0">Windows chose 0x00A50000, so every stored address moves</tspan><tspan x="0" dy="1.35em">by 0x00A50000 - 0x00400000 = 0x00650000:</tspan><tspan x="0" dy="1.35em">0x004A3010 + 0x00650000 = 0x00AF3010.</tspan></text></g><g data-a="n6" transform="translate(40 232)"><text fill="#11151a" class="scene__label scene__free" font-size="13"><tspan x="0">Threads now run these instructions at the addresses</tspan><tspan x="0" dy="1.35em">the loader chose, not the ones in the file.</tspan></text></g></svg>