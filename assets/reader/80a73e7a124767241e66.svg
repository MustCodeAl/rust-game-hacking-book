</style><title>Lesson table</title><rect x="1.00" y="1" width="197.84" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Later syntax</text><rect x="198.84" y="1" width="292.10" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="205.84" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Programming idea it expresses</text><rect x="490.94" y="1" width="188.06" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="497.94" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Where it becomes</text><text x="497.94" y="35" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">concrete</text><rect x="1.00" y="45" width="197.84" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">trait MemoryReader { ...</text><text x="8.00" y="79" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">}</text><rect x="198.84" y="45" width="292.10" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="205.84" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">A promise that different readers</text><text x="205.84" y="79" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">provide the same behavior.</text><rect x="490.94" y="45" width="188.06" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="497.94" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Lesson 3.1</text><rect x="1.00" y="89" width="197.84" height="76" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">unsafe { ... }</text><rect x="198.84" y="89" width="292.10" height="76" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="205.84" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Allows operations such as raw-pointer</text><text x="205.84" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">dereferencing; the programmer must</text><text x="205.84" y="139" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">ensure the data is valid, aligned and</text><text x="205.84" y="155" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">accessible for that operation.</text><rect x="490.94" y="89" width="188.06" height="76" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="497.94" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Lesson 3.1</text><rect x="1.00" y="165" width="197.84" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="183" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">extern &quot;system&quot; { ... }</text><rect x="198.84" y="165" width="292.10" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="205.84" y="183" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">A call across the Rust–Windows</text><text x="205.84" y