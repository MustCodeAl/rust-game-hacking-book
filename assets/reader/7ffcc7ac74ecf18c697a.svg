103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">combined movement</text><rect x="1.00" y="113" width="167.30" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">point + point</text><rect x="168.30" y="113" width="298.70" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="175.30" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">usually has no useful geometric meaning</text></svg>