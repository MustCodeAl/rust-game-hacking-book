e="12" font-weight="400">Key positi</text><text x="8.00" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">on</text><rect x="90.22" y="117" width="203.64" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="97.22" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">a scan code</text><rect x="293.86" y="117" width="168.89" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="300.86" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">when that physical</text><text x="300.86" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">key moves</text><rect x="462.75" y="117" width="216.25" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="469.75" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">binding to a letter</text><text x="469.75" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">instead, which breaks on</text><text x="469.75" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">other layouts</text><rect x="1.00" y="177" width="89.22" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Typed text</text><rect x="90.22" y="177" width="203.64" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="97.22" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">a string of characters</text><rect x="293.86" y="