<svg xmlns="http://www.w3.org/2000/svg" width="680" height="274" viewBox="0 0 680 274" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="188.51" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Mechanism</text><rect x="189.51" y="1" width="244.75" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="196.51" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">What makes the patch</text><text x="196.51" y="35" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">indivisible to observers</text><rect x="434.25" y="1" width="244.75" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="441.25" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Important limit</text><rect x="1.00" y="45" width="188.51" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">cooperative safe point</text><rect x="189.51" y="45" width="244.75" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="196.51" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">game-owned worker threads park</text><text x="196.51" y="79" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">at a known boundary before</text><text x="196.51" y="95" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">publication</text><rect x="434.25" y="45" width="244.75" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="441.25" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">only works when you control or</text><text x="441.25" y="79" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">can instrument those workers</text><rect x="1.00" y="105" width="188.51" height="92" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">thread rendezvous</text><rect x="189.51" y="105" width="244.75" height="92" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="196.51" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">peer threads are paused, their</text><text x="196.51" y="139" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">instruction pointers are</text><text x="196.51" y="155" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">checked or moved away from the</text><text x="196.51" y="171" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">patch span, and they resume</text><text x="196.51" y="187" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">only after verification</text><rect x="434.25" y="105" width="244.75" height="92" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="441.25" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">naïve suspension can deadlock</text><text x="441.25" y="139" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">when a stopped thread owns a</text><text x="441.25" y="155" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">lock the installer needs</text><rect x="1.00" y="197" width="188.51" height="76" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="215" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">framework-managed</text><text x="8.00" y="231" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">transaction</text><rect x="189.51" y="197" width="244.75" height="76" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="196.51" y="215" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">a mature detour library</text><text x="196.51" y="231" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">relocates affected instruction</text><text x="196.51" y="247" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">pointers and publishes through</text><text x="196.51" y="263" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">its documented transaction API</text><rect x="434.25" y="197" width="244.75" height="76" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="441.25" y="215" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">the library’s guarantees still</text><text x="441.25" y="231" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">need to match the target</text><text x="441.25" y="247" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">architecture and process</text></svg>