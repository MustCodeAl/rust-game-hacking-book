<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="196.12" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Fact</text><rect x="197.12" y="1" width="229.82" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="204.12" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Question it answers</text><rect x="426.94" y="1" width="252.06" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="433.94" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Important limit</text><rect x="1.00" y="29" width="196.12" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Version label</text><rect x="197.12" y="29" width="229.82" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="204.12" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">What release does the program</text><text x="204.12" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">claim?</text><rect x="426.94" y="29" width="252.06" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="433.94" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Different builds can share it.</text><rect x="1.00" y="73" width="196.12" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Live module path</text><rect x="197.12" y="73" width="229.82" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="204.12" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Which file did this process</text><text x="204.12" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">map?</text><rect x="426.94" y="73" width="252.06" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="433.94" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">A path does not identify its</text><text x="433.94" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">bytes.</text><rect x="1.00" y="117" width="196.12" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Architecture and PE</text><text x="8.00" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">fields</text><rect x="197.12" y="117" width="229.82" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="204.12" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">What layout family is this</text><text x="204.12" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">file?</text><rect x="426.94" y="117" width="252.06" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="433.94" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Many builds share those fields.</text><rect x="1.00" y="161" width="196.12" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">SHA-256 digest</text><rect x="197.12" y="161" width="229.82" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="204.12" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Do all bytes match the</text><text x="204.12" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">baseline?</text><rect x="426.94" y="161" width="252.06" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="433.94" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The baseline must already be</text><text x="433.94" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">trusted.</text><rect x="1.00" y="205" width="196.12" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="223" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Trusted manifest or</text><text x="8.00" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">signature</text><rect x="197.12" y="205" width="229.82" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="204.12" y="223" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Who supplied the expected</text><text x="204.12" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">identity?</text><rect x="426.94" y="205" width="252.06" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="433.94" y="223" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">It does not prove the live file</text><text x="433.94" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">matches.</text></svg>