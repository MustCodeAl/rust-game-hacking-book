<svg xmlns="http://www.w3.org/2000/svg" width="680" height="162" viewBox="0 0 680 162" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="144.47" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Software</text><rect x="145.47" y="1" width="258.39" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="152.47" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Where it runs</text><rect x="403.86" y="1" width="275.14" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="410.86" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">What it does</text><rect x="1.00" y="29" width="144.47" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Game application</text><rect x="145.47" y="29" width="258.39" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="152.47" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The PC’s processor</text><rect x="403.86" y="29" width="275.14" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="410.86" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Turns a recognised button action</text><text x="410.86" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">into a game action</text><rect x="1.00" y="73" width="144.47" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Device driver</text><rect x="145.47" y="73" width="258.39" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="152.47" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The PC’s processor, as part of</text><text x="152.47" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">its OS</text><rect x="403.86" y="73" width="275.14" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="410.86" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Exchanges requests and reports with</text><text x="410.86" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">the controller</text><rect x="1.00" y="117" width="144.47" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Controller</text><text x="8.00" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">firmware</text><rect x="145.47" y="117" width="258.39" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="152.47" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The controller’s own processor</text><rect x="403.86" y="117" width="275.14" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="410.86" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Samples its buttons and prepares</text><text x="410.86" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">the reports</text></svg>