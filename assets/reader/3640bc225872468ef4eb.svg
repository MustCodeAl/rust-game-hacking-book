<svg xmlns="http://www.w3.org/2000/svg" width="665" height="250" viewBox="0 0 665 250" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="211.10" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Instruction</text><rect x="212.10" y="1" width="145.40" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="219.10" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">RAX afterwards</text><rect x="357.50" y="1" width="306.00" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="364.50" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">What happened to the bytes</text><rect x="1.00" y="29" width="211.10" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">mov al, 0xEE</text><rect x="212.10" y="29" width="145.40" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="219.10" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">0x11223344556677EE</text><rect x="357.50" y="29" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="364.50" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Byte 0 was written. Bytes 7 to 1 were</text><text x="364.50" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">not touched.</text><rect x="1.00" y="73" width="211.10" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">mov ah, 0xEE</text><rect x="212.10" y="73" width="145.40" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="219.10" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">0x112233445566EE88</text><rect x="357.50" y="73" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="364.50" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Byte 1 was written. Bytes 7 to 2 and</text><text x="364.50" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">byte 0 were not touched.</text><rect x="1.00" y="117" width="211.10" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">mov ax, 0xEEFF</text><rect x="212.10" y="117" width="145.40" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="219.10" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">0x112233445566EEFF</text><rect x="357.50" y="117" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="364.50" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Bytes 1 to 0 were written. Bytes 7 to 2</text><text x="364.50" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">were not touched.</text><rect x="1.00" y="161" width="211.10" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">mov eax, 0xAABBCCDD</text><rect x="212.10" y="161" width="145.40" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="219.10" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">0x00000000AABBCCDD</text><rect x="357.50" y="161" width="306.00" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="364.50" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Bytes 3 to 0 were written. Bytes 7 to 4</text><text x="364.50" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">were cleared by the zero-extension rule:</text><text x="364.50" y="211" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">11 22 33 44 became 00 00 00 00.</text><rect x="1.00" y="221" width="211.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">mov rax, 0x8899AABBCCDDEEFF</text><rect x="212.10" y="221" width="145.40" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="219.10" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">0x8899AABBCCDDEEFF</text><rect x="357.50" y="221" width="306.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="364.50" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Bytes 7 to 0 were written.</text></svg>