<svg xmlns="http://www.w3.org/2000/svg" width="468" height="114" viewBox="0 0 468 114" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="94.30" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Pass</text><rect x="95.30" y="1" width="276.80" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="102.30" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">What it reads</text><rect x="372.10" y="1" width="94.30" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="379.10" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Bytes read</text><rect x="1.00" y="29" width="94.30" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">first scan</text><rect x="95.30" y="29" width="276.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="102.30" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">every readable byte: 400 × 1,048,576</text><rect x="372.10" y="29" width="94.30" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="379.10" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">419,430,400</text><rect x="1.00" y="57" width="94.30" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">second scan</text><rect x="95.30" y="57" width="276.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="102.30" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">40,000 candidates × 4 bytes</text><rect x="372.10" y="57" width="94.30" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="379.10" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">160,000</text><rect x="1.00" y="85" width="94.30" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">third scan</text><rect x="95.30" y="85" width="276.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="102.30" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">18 candidates × 4 bytes</text><rect x="372.10" y="85" width="94.30" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="379.10" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">72</text></svg>