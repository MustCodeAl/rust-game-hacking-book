<svg xmlns="http://www.w3.org/2000/svg" style="background-color:var(--diagram-paper, #ffffff)" viewBox="0 0 480 334" focusable="false"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
