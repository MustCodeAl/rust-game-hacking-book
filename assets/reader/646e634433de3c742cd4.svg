<svg xmlns="http://www.w3.org/2000/svg" width="680" height="334" viewBox="0 0 680 334" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="187.91" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Intent</text><rect x="188.91" y="1" width="199.25" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="195.91" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Operation</text><rect x="388.16" y="1" width="290.84" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="395.16" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Example</text><rect x="1.00" y="29" width="187.91" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Check any chosen flag</text><rect x="188.91" y="29" width="199.25" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="195.91" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">value &amp; mask != 0</text><rect x="388.16" y="29" width="290.84" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="395.16" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">At least one selected bit is set.</text><rect x="1.00" y="57" width="187.91" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Check all chosen flags</text><rect x="188.91" y="57" width="199.25" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="195.91" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">value &amp; mask == mask</text><rect x="388.16" y="57" width="290.84" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="395.16" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Every selected bit is set.</text><rect x="1.00" y="85" width="187.91" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Set chosen bits</text><rect x="188.91" y="85" width="199.25" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="195.91" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">`value</text><rect x="388.16" y="85" width="290.84" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="395.16" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">mask`</text><rect x="1.00" y="113" width="187.91" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Clear chosen bits</text><rect x="188.91" y="113" width="199.25" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="195.91" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">value &amp; !mask</text><rect x="388.16" y="113" width="290.84" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="395.16" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Invert a mask of the same width</text><text x="395.16" y="147" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">first.</text><rect x="1.00" y="157" width="187.91" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="175" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Toggle chosen bits</text><rect x="188.91" y="157" width="199.25" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="195.91" y="175" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">value ^ mask</text><rect x="388.16" y="157" width="290.84" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="395.16" y="175" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Apply twice to recover the starting</text><text x="395.16" y="191" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">value.</text><rect x="1.00" y="201" width="187.91" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="219" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Move bits left or right</text><rect x="188.91" y="201" width="199.25" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="195.91" y="219" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">&lt;&lt; / &gt;&gt; on unsigned</text><text x="195.91" y="235" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">values</text><rect x="388.16" y="201" width="290.84" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="395.16" y="219" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Outgoing bits are discarded.</text><rect x="1.00" y="245" width="187.91" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="263" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Wrap outgoing bits</text><text x="8.00" y="279" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">around</text><rect x="188.91" y="245" width="199.25" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="195.91" y="263" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">rotate_left /</text><text x="195.91" y="279" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">rotate_right</text><rect x="388.16" y="245" width="290.84" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="395.16" y="263" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Rotation stays inside the type’s</text><text x="395.16" y="279" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">width.</text><rect x="1.00" y="289" width="187.91" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="307" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Decode a packed field</text><rect x="188.91" y="289" width="199.25" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="195.91" y="307" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Mask, then shift</text><rect x="388.16" y="289" width="290.84" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="395.16" y="307" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">A declared field boundary gives the</text><text x="395.16" y="323" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">bits meaning.</text></svg>