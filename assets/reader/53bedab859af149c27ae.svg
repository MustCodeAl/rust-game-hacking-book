<svg xmlns="http://www.w3.org/2000/svg" width="527" height="170" viewBox="0 0 527 170" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="524.40" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">One entity, three observations over two ticks</text><rect x="1.00" y="29" width="276.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">1. Begin with the prior entity state</text><rect x="277.80" y="29" width="247.60" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="284.80" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">entity 7; health 6; Alive</text><rect x="1.00" y="57" width="276.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">2. Record the health write</text><rect x="277.80" y="57" width="247.60" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="284.80" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">seq 41: 6 → 0; tick 900</text><rect x="1.00" y="85" width="276.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">3. Record the mode transition</text><rect x="277.80" y="85" width="247.60" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="284.80" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">seq 42: Alive → Downed; tick 900</text><rect x="1.00" y="113" width="276.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">4. Observe the display copy</text><rect x="277.80" y="113" width="247.60" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="284.80" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">seq 43: health 0; tick 901</text><rect x="1.00" y="141" width="276.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="159" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">5. Compare the recorded sequence</text><rect x="277.80" y="141" width="247.60" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="284.80" y="159" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">health and mode before UI read</text></svg>