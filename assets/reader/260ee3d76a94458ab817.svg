<svg xmlns="http://www.w3.org/2000/svg" width="680" height="194" viewBox="0 0 680 194" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="151.38" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Storage role</text><rect x="152.38" y="1" width="264.03" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="159.38" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Typical contents</text><rect x="416.41" y="1" width="262.59" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="423.41" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Lifetime to check</text><rect x="1.00" y="29" width="151.38" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Thread stack</text><rect x="152.38" y="29" width="264.03" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="159.38" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Active call frames, saved return</text><text x="159.38" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">addresses, some local values</text><rect x="416.41" y="29" width="262.59" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="423.41" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The current frame ends when the</text><text x="423.41" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">function returns; the thread has</text><text x="423.41" y="79" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">its own stack.</text><rect x="1.00" y="89" width="151.38" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Heap allocation</text><rect x="152.38" y="89" width="264.03" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="159.38" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Dynamically allocated objects or</text><text x="159.38" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">buffers</text><rect x="416.41" y="89" width="262.59" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="423.41" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The allocation lasts until its</text><text x="423.41" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">owner releases it, which may be</text><text x="423.41" y="139" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">later than this call.</text><rect x="1.00" y="149" width="151.38" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Static or module</text><text x="8.00" y="183" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">data</text><rect x="152.38" y="149" width="264.03" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="159.38" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Globals, constants, and other</text><text x="159.38" y="183" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">long-lived data</text><rect x="416.41" y="149" width="262.59" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="423.41" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Data remains for the program or</text><text x="423.41" y="183" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">module lifetime.</text></svg>