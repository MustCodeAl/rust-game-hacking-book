<svg xmlns="http://www.w3.org/2000/svg" width="680" height="190" viewBox="0 0 680 190" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="132.24" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Level</text><rect x="133.24" y="1" width="263.18" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="140.24" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Question it can answer</text><rect x="396.43" y="1" width="282.57" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="403.43" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Evidence to keep</text><rect x="1.00" y="29" width="132.24" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Gold write</text><rect x="133.24" y="29" width="263.18" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="140.24" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Which field changed, and by how</text><text x="140.24" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">much?</text><rect x="396.43" y="29" width="282.57" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="403.43" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Receiver address, amount,</text><text x="403.43" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">before/after values</text><rect x="1.00" y="73" width="132.24" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Spending helper</text><rect x="133.24" y="73" width="263.18" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="140.24" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Which check allowed the</text><text x="140.24" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">subtraction?</text><rect x="396.43" y="73" width="282.57" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="403.43" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Taken comparison and its operands</text><rect x="1.00" y="117" width="132.24" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Purchase handler</text><rect x="133.24" y="117" width="263.18" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="140.24" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">What did the amount mean?</text><rect x="396.43" y="117" width="282.57" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="403.43" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Item price passed to the helper</text><rect x="1.00" y="145" width="132.24" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="163" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Action dispatche</text><text x="8.00" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">r</text><rect x="133.24" y="145" width="263.18" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="140.24" y="163" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">What requested this handler?</text><rect x="396.43" y="145" width="282.57" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="403.43" y="163" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Selected command and matching call</text><text x="403.43" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">site</text></svg>