<svg xmlns="http://www.w3.org/2000/svg" width="680" height="418" viewBox="0 0 680 418" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="191.32" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Need</text><rect x="192.32" y="1" width="204.08" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="199.32" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Expression</text><rect x="396.40" y="1" width="282.60" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="403.40" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Boundary to check</text><rect x="1.00" y="29" width="191.32" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Keep selected items</text><rect x="192.32" y="29" width="204.08" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="199.32" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">.filter(predicate)</text><rect x="396.40" y="29" width="282.60" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="403.40" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Predicate borrows its item.</text><rect x="1.00" y="57" width="191.32" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Transform each item</text><rect x="192.32" y="57" width="204.08" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="199.32" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">.map(function)</text><rect x="396.40" y="57" width="282.60" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="403.40" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Runs as the iterator is consumed.</text><rect x="1.00" y="85" width="191.32" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Accumulate an answer</text><rect x="192.32" y="85" width="204.08" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="199.32" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">.fold(start, combine)</text><rect x="396.40" y="85" width="282.60" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="403.40" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Arithmetic must fit or use an</text><text x="403.40" y="119" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">explicit policy.</text><rect x="1.00" y="129" width="191.32" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="147" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Compare neighbors</text><rect x="192.32" y="129" width="204.08" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="199.32" y="147" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">.windows(n)</text><rect x="396.40" y="129" width="282.60" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="403.40" y="147" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">n must be positive; windows overlap.</text><rect x="1.00" y="157" width="191.32" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="175" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Decode fixed records</text><rect x="192.32" y="157" width="204.08" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="199.32" y="175" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">.chunks_exact(n)</text><rect x="396.40" y="157" width="282.60" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="403.40" y="175" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">n must be positive; inspect the</text><text x="403.40" y="191" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">remainder.</text><rect x="1.00" y="201" width="191.32" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="219" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Borrow checked elements</text><rect x="192.32" y="201" width="204.08" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="199.32" y="219" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">.get(index_or_range)</text><rect x="396.40" y="201" width="282.60" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="403.40" y="219" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Returns None outside the bounds.</text><rect x="1.00" y="229" width="191.32" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="247" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Convert an exact field</text><rect x="192.32" y="229" width="204.08" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="199.32" y="247" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">from_le_bytes /</text><text x="199.32" y="263" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">to_le_bytes</text><rect x="396.40" y="229" width="282.60" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="403.40" y="247" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Follow the format’s byte order and</text><text x="403.40" y="263" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">width.</text><rect x="1.00" y="273" width="191.32" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="291" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Reject overflow</text><rect x="192.32" y="273" width="204.08" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="199.32" y="291" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">checked_*</text><rect x="396.40" y="273" width="282.60" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="403.40" y="291" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Caller handles None.</text><rect x="1.00" y="301" width="191.32" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="319" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Cycle through bit</text><text x="8.00" y="335" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">patterns</text><rect x="192.32" y="301" width="204.08" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="199.32" y="319" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">wrapping_*</text><rect x="396.40" y="301" width="282.60" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="403.40" y="319" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Wraparound must be intended.</text><rect x="1.00" y="345" width="191.32" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="363" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Stop at the type limit</text><rect x="192.32" y="345" width="204.08" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="199.32" y="363" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">saturating_*</text><rect x="396.40" y="345" width="282.60" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="403.40" y="363" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The game limit may be smaller.</text><rect x="1.00" y="373" width="191.32" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="391" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Match C layout</text><rect x="192.32" y="373" width="204.08" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="199.32" y="391" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">#[repr(C)]</text><rect x="396.40" y="373" width="282.60" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="403.40" y="391" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Target alignment and padding still</text><text x="403.40" y="407" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">apply.</text></svg>