<svg xmlns="http://www.w3.org/2000/svg" width="680" height="458" viewBox="0 0 680 458" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="226.00" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Question</text><rect x="227.00" y="1" width="226.00" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="234.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Relevant APIs</text><rect x="453.00" y="1" width="226.00" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="460.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Check to make</text><rect x="1.00" y="29" width="226.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Which top-level window</text><text x="8.00" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">belongs to my PID?</text><rect x="227.00" y="29" width="226.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="234.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">EnumWindows, GetWindowThreadP</text><text x="234.00" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">rocessId</text><rect x="453.00" y="29" width="226.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="460.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Match the process, not a</text><text x="460.00" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">changeable title</text><rect x="1.00" y="73" width="226.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Where is the drawable client</text><text x="8.00" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">area on screen?</text><rect x="227.00" y="73" width="226.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="234.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">GetClientRect, ClientToScreen</text><text x="234.00" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">, GetDpiForWindow</text><rect x="453.00" y="73" width="226.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="460.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Recalculate after move,</text><text x="460.00" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">resize, or DPI change</text><rect x="1.00" y="117" width="226.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Is the target active?</text><rect x="227.00" y="117" width="226.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="234.00" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">GetForegroundWindow</text><rect x="453.00" y="117" width="226.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="460.00" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Pause synthetic input when it</text><text x="460.00" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">is not</text><rect x="1.00" y="161" width="226.00" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Which process/module build is</text><text x="8.00" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">this?</text><rect x="227.00" y="161" width="226.00" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="234.00" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">CreateToolhelp32Snapshot,</text><text x="234.00" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Process32FirstW,</text><text x="234.00" y="211" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Module32FirstW</text><rect x="453.00" y="161" width="226.00" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="460.00" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Verify identity before using</text><text x="460.00" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">offsets</text><rect x="1.00" y="221" width="226.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">What access does the tool</text><text x="8.00" y="255" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">truly need?</text><rect x="227.00" y="221" width="226.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="234.00" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">OpenProcess</text><rect x="453.00" y="221" width="226.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="460.00" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Ask for read/query rights</text><text x="460.00" y="255" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">before write rights</text><rect x="1.00" y="265" width="226.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="283" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Can this remote range be</text><text x="8.00" y="299" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">read?</text><rect x="227.00" y="265" width="226.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="234.00" y="283" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">VirtualQueryEx,</text><text x="234.00" y="299" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">ReadProcessMemory</text><rect x="453.00" y="265" width="226.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="460.00" y="283" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Inspect the region, then copy</text><text x="460.00" y="299" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">bounded bytes</text><rect x="1.00" y="309" width="226.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="327" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Did patched code become</text><text x="8.00" y="343" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">executable correctly?</text><rect x="227.00" y="309" width="226.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="234.00" y="327" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">VirtualProtectEx,</text><text x="234.00" y="343" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">FlushInstructionCache</text><rect x="453.00" y="309" width="226.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="460.00" y="327" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Save/restore protection and</text><text x="460.00" y="343" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">verify every byte</text><rect x="1.00" y="353" width="226.00" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="371" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">How do I observe execution?</text><rect x="227.00" y="353" width="226.00" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="234.00" y="371" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">DebugActiveProcess,</text><text x="234.00" y="387" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">WaitForDebugEvent,</text><text x="234.00" y="403" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">ContinueDebugEvent</text><rect x="453.00" y="353" width="226.00" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="460.00" y="371" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Continue every event exactly</text><text x="460.00" y="387" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">once</text><rect x="1.00" y="413" width="226.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="431" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">How do two local components</text><text x="8.00" y="447" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">exchange data?</text><rect x="227.00" y="413" width="226.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="234.00" y="431" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">named pipes, file mappings,</text><text x="234.00" y="447" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">events</text><rect x="453.00" y="413" width="226.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="460.00" y="431" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Frame, authenticate, bound,</text><text x="460.00" y="447" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">and close resources</text></svg>