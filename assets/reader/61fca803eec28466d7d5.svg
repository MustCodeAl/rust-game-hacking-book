<svg xmlns="http://www.w3.org/2000/svg" width="681" height="210" viewBox="0 0 681 210" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="163.39" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Path</text><rect x="164.39" y="1" width="171.54" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="171.39" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">What it really does</text><rect x="335.93" y="1" width="175.88" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="342.93" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Good course use</text><rect x="511.80" y="1" width="167.20" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="518.80" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Common surprise</text><rect x="1.00" y="29" width="163.39" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">GetAsyncKeyState</text><rect x="164.39" y="29" width="171.54" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="171.39" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Samples the current</text><text x="171.39" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">physical key state</text><rect x="335.93" y="29" width="175.88" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="342.93" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Toggle a local tool</text><text x="342.93" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">menu</text><rect x="511.80" y="29" width="167.20" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="518.80" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">It does not wait for</text><text x="518.80" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">an event</text><rect x="1.00" y="73" width="163.39" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">SendInput</text><rect x="164.39" y="73" width="171.54" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="171.39" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Inserts keyboard or</text><text x="171.39" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">mouse events into the</text><text x="171.39" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">system input stream</text><rect x="335.93" y="73" width="175.88" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="342.93" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Drive an offline game</text><text x="342.93" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">while its window is</text><text x="342.93" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">active</text><rect x="511.80" y="73" width="167.20" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="518.80" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">It does not target</text><text x="518.80" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">one HWND</text><rect x="1.00" y="133" width="163.39" height="76" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">SendMessageW /</text><text x="8.00" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">PostMessageW</text><rect x="164.39" y="133" width="171.54" height="76" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="171.39" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Calls or queues a</text><text x="171.39" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">message for a window</text><text x="171.39" y="183" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">procedure</text><rect x="335.93" y="133" width="175.88" height="76" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="342.93" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Control a window you</text><text x="342.93" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">created or a</text><text x="342.93" y="183" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">documented local test</text><text x="342.93" y="199" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">window</text><rect x="511.80" y="133" width="167.20" height="76" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="518.80" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Many games read Raw</text><text x="518.80" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Input or device</text><text x="518.80" y="183" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">state instead</text></svg>