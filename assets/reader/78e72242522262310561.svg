<svg xmlns="http://www.w3.org/2000/svg" width="680" height="306" viewBox="0 0 680 306" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="113.73" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Level</text><rect x="114.73" y="1" width="282.96" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="121.73" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Example</text><rect x="397.69" y="1" width="281.31" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="404.69" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">What shows it</text><rect x="1.00" y="29" width="113.73" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Bytes</text><rect x="114.73" y="29" width="282.96" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="121.73" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Four bytes at this address changed.</text><rect x="397.69" y="29" width="281.31" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="404.69" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Reading the memory before and after.</text><rect x="1.00" y="57" width="113.73" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Instruction</text><rect x="114.73" y="57" width="282.96" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="121.73" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">movss read those four bytes.</text><rect x="397.69" y="57" width="281.31" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="404.69" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Decoded machine code.</text><rect x="1.00" y="85" width="113.73" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Data flow</text><rect x="114.73" y="85" width="282.96" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="121.73" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The value reaches the view-angle</text><text x="121.73" y="119" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">calculation.</text><rect x="397.69" y="85" width="281.31" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="404.69" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Register and memory tracing.</text><rect x="1.00" y="129" width="113.73" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="147" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Field</text><rect x="114.73" y="129" width="282.96" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="121.73" y="147" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Offset +0x40 behaves like yaw.</text><rect x="397.69" y="129" width="281.31" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="404.69" y="147" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Controlled turns across many</text><text x="404.69" y="163" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">instances.</text><rect x="1.00" y="173" width="113.73" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="191" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Object</text><rect x="114.73" y="173" width="282.96" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="121.73" y="191" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Several fields share one stable base</text><text x="121.73" y="207" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">address.</text><rect x="397.69" y="173" width="281.31" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="404.69" y="191" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Repeated base + offset accesses.</text><rect x="1.00" y="217" width="113.73" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="235" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Class behavio</text><text x="8.00" y="251" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">r</text><rect x="114.73" y="217" width="282.96" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="121.73" y="235" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Objects sharing one table dispatch</text><text x="121.73" y="251" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">related methods.</text><rect x="397.69" y="217" width="281.31" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="404.69" y="235" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Checked indirect calls and object</text><text x="404.69" y="251" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">lifetimes.</text><rect x="1.00" y="261" width="113.73" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="279" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Game meaning</text><rect x="114.73" y="261" width="282.96" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="121.73" y="279" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">This is the active player entity.</text><rect x="397.69" y="261" width="281.31" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="404.69" y="279" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Behavior, call context, and</text><text x="404.69" y="295" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">lifecycle tests.</text></svg>