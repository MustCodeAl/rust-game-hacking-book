<svg xmlns="http://www.w3.org/2000/svg" width="681" height="206" viewBox="0 0 681 206" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="170.31" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Style</text><rect x="171.31" y="1" width="257.21" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="178.31" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Main idea</text><rect x="428.52" y="1" width="250.48" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="435.52" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Our purchase example</text><rect x="1.00" y="29" width="170.31" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Procedural or</text><text x="8.00" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">imperative</text><rect x="171.31" y="29" width="257.21" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="178.31" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Write the steps that change state</text><rect x="428.52" y="29" width="250.48" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="435.52" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Check gold, then subtract cost.</text><rect x="1.00" y="73" width="170.31" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Object-oriented</text><rect x="171.31" y="73" width="257.21" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="178.31" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Put related data and behavior</text><text x="178.31" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">together</text><rect x="428.52" y="73" width="250.48" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="435.52" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">A Player has gold and a buy</text><text x="435.52" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">method.</text><rect x="1.00" y="117" width="170.31" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Functional</text><rect x="171.31" y="117" width="257.21" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="178.31" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Calculate an output from inputs</text><text x="178.31" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">without changing hidden state</text><rect x="428.52" y="117" width="250.48" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="435.52" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">spend_if_possible(100, 25)</text><text x="435.52" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">returns 75.</text><rect x="1.00" y="161" width="170.31" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Event-driven</text><rect x="171.31" y="161" width="257.21" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="178.31" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Run a handler when something</text><text x="178.31" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">happens</text><rect x="428.52" y="161" width="250.48" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="435.52" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">A Buy click calls the purchase</text><text x="435.52" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">rule.</text></svg>