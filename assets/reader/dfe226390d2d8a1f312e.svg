</style><title>Lesson table</title><rect x="1.00" y="1" width="225.07" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Need</text><rect x="226.07" y="1" width="227.86" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="233.07" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Pattern</text><rect x="453.93" y="1" width="225.07" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="460.93" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Limit to remember</text><rect x="1.00" y="29" width="225.07" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Release one owned resource</text><text x="8.00" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">at scope exit</text><rect x="226.07" y="29" width="227.86" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="233.07" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">An owner or guard with Drop</text><rect x="453.93" y="29" width="225.07" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="460.93" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Abort and process</text><text x="460.93" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">termination may skip</text><text x="460.93" y="79" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">cleanup.</text><rect x="1.00" y="89" width="225.07" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Temporarily change borrowed</text><text x="8.00" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">local data</text><rect x="226.07" y="89" width="227.86" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="233.07" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">A guard holds &amp;mut T and</text><text x="233.07" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">saved state</text><rect x="453.93" y="89" width="225.07" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="460.93" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Remote writes have</text><text x="460.93" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">additional failure and</text><text x="460.93" y="139" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">concurrency conditions.</text><rect x="1.00" y="149" width="225.07" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Report failed completion</text><rect x="226.07" y="149" width="227.86" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="233.07" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Explicit finish / close /</text><text x="233.07" y="183" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">restore returning Result</text><rect x="453.93" y="149" width="225.07" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="460.93" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Drop itself has no returned</text><text x="460.93" y="183" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">result.</text><rect x="1.00" y="193" width="225.07" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="211" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Let library callers</text><text x="8.00" y="227" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">distinguish causes</text><rect x="226.07" y="193" width="227.86" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="233.07" y="211" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Structured enum, optionally</text><text x="233.07" y="227" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">derived with thiserror</text><rect x="453.93" y="193" width="225.07" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="460.93" y="211" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The public variants become</text><text x="460.93" y="227" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">part of the interface.</text><rect x="1.00" y="237" width="225.07" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="255" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Explain an application</text><text x="8.00" y="271" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">operation</text><rect x="226.07" y="237" width="227.86" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="233.07" y="255" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">anyhow::Context around a</text><text x="233.07" y="271" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Result or Option</text><rect x="453.93" y="237" width="225.07" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="460.93" y="255" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Add useful context while</text><text x="460.93" y="271" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">retaining the original</text><text x="460.93" y="287" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">cause.</text><rect x="1.00" y="297" width="225.07" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="315" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Stop on the first failure</text><rect x="226.07" y="297" width="227.86" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="233.07" y="315" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">?</text><rect x="453.93" y="297" width="225.07" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="460.93" y="315" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Its error must convert to</text><text x="460.93" y="331" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">the function’s return error.</text></svg>