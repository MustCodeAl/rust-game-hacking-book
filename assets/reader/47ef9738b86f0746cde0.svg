<svg xmlns="http://www.w3.org/2000/svg" width="680" height="178" viewBox="0 0 680 178" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="118.94" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">In this exampl</text><text x="8.00" y="35" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">e</text><rect x="119.94" y="1" width="279.53" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="126.94" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Client program</text><rect x="399.47" y="1" width="279.53" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="406.47" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Server program</text><rect x="1.00" y="45" width="118.94" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Input</text><rect x="119.94" y="45" width="279.53" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="126.94" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Notices the north key press and</text><text x="126.94" y="79" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">sends a move request.</text><rect x="399.47" y="45" width="279.53" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="406.47" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Receives the request and identifies</text><text x="406.47" y="79" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">the player who sent it.</text><rect x="1.00" y="89" width="118.94" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Simulation</text><rect x="119.94" y="89" width="279.53" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="126.94" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">May predict movement to make the</text><text x="126.94" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">controls feel responsive.</text><rect x="399.47" y="89" width="279.53" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="406.47" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Checks the destination and updates</text><text x="406.47" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">the match’s stored position.</text><rect x="1.00" y="133" width="118.94" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Display</text><rect x="119.94" y="133" width="279.53" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="126.94" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Draws the player at the latest known</text><text x="126.94" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">or predicted position.</text><rect x="399.47" y="133" width="279.53" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="406.47" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Sends position updates; a dedicated</text><text x="406.47" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">server usually draws no game window.</text></svg>