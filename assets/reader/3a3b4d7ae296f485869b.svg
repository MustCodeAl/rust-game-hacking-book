<svg xmlns="http://www.w3.org/2000/svg" width="680" height="218" viewBox="0 0 680 218" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="245.43" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">View of HI</text><rect x="246.43" y="1" width="138.10" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="253.43" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Representation</text><rect x="384.53" y="1" width="294.47" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="391.53" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">What to count</text><rect x="1.00" y="29" width="245.43" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Unicode code points</text><rect x="246.43" y="29" width="138.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="253.43" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">U+0048 U+0049</text><rect x="384.53" y="29" width="294.47" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="391.53" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Two code points: H and I.</text><rect x="1.00" y="57" width="245.43" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">ASCII / UTF-8 bytes, in hex</text><rect x="246.43" y="57" width="138.10" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="253.43" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">48 49</text><rect x="384.53" y="57" width="294.47" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="391.53" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Two bytes, with decimal values 72 and</text><text x="391.53" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">73.</text><rect x="1.00" y="101" width="245.43" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="119" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Those bytes, in binary</text><rect x="246.43" y="101" width="138.10" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="253.43" y="119" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">01001000 01001001</text><rect x="384.53" y="101" width="294.47" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="391.53" y="119" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Sixteen bits, displayed as two 8-bit</text><text x="391.53" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">bytes.</text><rect x="1.00" y="145" width="245.43" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="163" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">UTF-16LE bytes, in hex</text><rect x="246.43" y="145" width="138.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="253.43" y="163" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">48 00 49 00</text><rect x="384.53" y="145" width="294.47" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="391.53" y="163" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Four bytes for two 16-bit code units.</text><rect x="1.00" y="173" width="245.43" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="191" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Base64 of the ASCII / UTF-8</text><text x="8.00" y="207" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">bytes</text><rect x="246.43" y="173" width="138.10" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="253.43" y="191" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">SEk=</text><rect x="384.53" y="173" width="294.47" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="391.53" y="191" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Four output symbols representing the</text><text x="391.53" y="207" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">original two bytes.</text></svg>