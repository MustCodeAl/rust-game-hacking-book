><g data-a="in" data-role="muted" transform="translate(24 25)"><text fill="#11151a" class="scene__label scene__free" font-size="13">Loading policy</text></g><g data-a="kernel" transform="translate(340 46)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect scene__rect--plain" width="116" height="148" rx="6" /></g><g data-a="kl" data-role="muted" transform="translate(360 36)"><text fill="#11151a" class="scene__label scene__free" font-size="13">Kernel</text></g><g data-a="gate" data-role="caution" transform="translate(306 46)"><path stroke="#59636f" fill="none" class="scene__line" data-len="148" d="M0 0L0 148" style="stroke-width:3px" /></g><g data-a="bad" data-role="muted" transform="translate(148 65)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="150" height="32" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="75" y="16" dy=".35em" text-anchor="middle" font-size="15">Signed, vulnerable</text></g><g data-a="good" data-role="state" transform="translate(349 151)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="98" height="32" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="49" y="16" dy=".35em" text-anchor="middle" font-size="15">Loaded</text></g><g data-a="policy" data-role="process" transform="translate(193 108)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="108" height="30" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="54" y="15" dy=".35em" text-anchor="middle" font-size="15">Allowed</text></g><g data-a="reason" data-role="muted" transform="translate(24 221)"><text fill="#11151a" class="scene__label scene__free" font-size="13">A signature identifies a publisher; it does not prove bug-free code.</text></g></svg>