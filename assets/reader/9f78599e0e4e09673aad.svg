<svg xmlns="http://www.w3.org/2000/svg" width="680" height="162" viewBox="0 0 680 162" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="252.22" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Question</text><rect x="253.22" y="1" width="248.29" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="260.22" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Kind of result</text><rect x="501.51" y="1" width="177.49" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="508.51" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Answer for Ada and Bo</text><rect x="1.00" y="29" width="252.22" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Can Bo afford the item?</text><rect x="253.22" y="29" width="248.29" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="260.22" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Decision: a yes/no answer</text><rect x="501.51" y="29" width="177.49" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="508.51" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">No, because 15 is</text><text x="508.51" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">below 25.</text><rect x="1.00" y="73" width="252.22" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">How many players can afford it?</text><rect x="253.22" y="73" width="248.29" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="260.22" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Count: the number that meet a</text><text x="260.22" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">condition</text><rect x="501.51" y="73" width="177.49" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="508.51" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">One: Ada.</text><rect x="1.00" y="117" width="252.22" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">What is the least or greatest</text><text x="8.00" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">gold amount?</text><rect x="253.22" y="117" width="248.29" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="260.22" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Minimum or maximum: an extreme</text><text x="260.22" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">value</text><rect x="501.51" y="117" width="177.49" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="508.51" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Minimum 15; maximum</text><text x="508.51" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">75.</text></svg>