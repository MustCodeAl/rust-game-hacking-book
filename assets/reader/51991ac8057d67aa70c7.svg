<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="177.73" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Failure</text><rect x="178.73" y="1" width="253.86" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="185.73" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">What it means</text><rect x="432.59" y="1" width="246.41" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="439.59" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Correct response</text><rect x="1.00" y="29" width="177.73" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Player root is null</text><rect x="178.73" y="29" width="253.86" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="185.73" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">No supported local match is</text><text x="185.73" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">ready</text><rect x="432.59" y="29" width="246.41" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="439.59" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Start the match; do not invent</text><text x="439.59" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">an address</text><rect x="1.00" y="73" width="177.73" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Snapshot keeps</text><text x="8.00" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">changing</text><rect x="178.73" y="73" width="253.86" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="185.73" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The pointer path changes between</text><text x="185.73" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">captures</text><rect x="432.59" y="73" width="246.41" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="439.59" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Stop after the retry cap</text><rect x="1.00" y="117" width="177.73" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Architecture is not</text><text x="8.00" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">32-bit</text><rect x="178.73" y="117" width="253.86" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="185.73" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">This profile does not describe</text><text x="185.73" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">the target</text><rect x="432.59" y="117" width="246.41" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="439.59" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Refuse the run</text><rect x="1.00" y="161" width="177.73" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">State differs before</text><text x="8.00" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">write</text><rect x="178.73" y="161" width="253.86" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="185.73" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The earlier snapshot is out of</text><text x="185.73" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">date</text><rect x="432.59" y="161" width="246.41" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="439.59" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Write nothing and capture again</text><rect x="1.00" y="205" width="177.73" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="223" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Read-back differs</text><rect x="178.73" y="205" width="253.86" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="185.73" y="223" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The requested postcondition was</text><text x="185.73" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">not reached</text><rect x="432.59" y="205" width="246.41" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="439.59" y="223" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Report failure; do not print</text><text x="439.59" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">success</text></svg>