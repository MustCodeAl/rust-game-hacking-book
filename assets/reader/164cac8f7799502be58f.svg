<svg xmlns="http://www.w3.org/2000/svg" width="468" height="198" viewBox="0 0 468 198" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="466.00" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Follow the 19-byte GSAV save through its loader checks</text><rect x="1.00" y="29" width="254.90" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">1. Read the complete file</text><rect x="255.90" y="29" width="211.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="262.90" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">19 bytes</text><rect x="1.00" y="57" width="254.90" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">2. Check magic and version</text><rect x="255.90" y="57" width="211.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="262.90" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">GSAV; version = 1</text><rect x="1.00" y="85" width="254.90" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">3. Bound the variable-length name</text><rect x="255.90" y="85" width="211.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="262.90" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">12 + 3 + 4 = 19</text><rect x="1.00" y="113" width="254.90" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">4. Compute the checksum</text><rect x="255.90" y="113" width="211.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="262.90" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">sum(bytes 0–14) = 842</text><rect x="1.00" y="141" width="254.90" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="159" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">5. Compare the stored total</text><rect x="255.90" y="141" width="211.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="262.90" y="159" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">4A 03 00 00 → 842</text><rect x="1.00" y="169" width="254.90" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="187" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">6. Decode the accepted record</text><rect x="255.90" y="169" width="211.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="262.90" y="187" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Nia: level 3, gold 250</text></svg>