<svg xmlns="http://www.w3.org/2000/svg" style="background-color:var(--diagram-paper, #ffffff)" viewBox="0 0 480 392" focusable="false"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><defs><marker id="scene-meaning-to-bytes-head-input" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="input" d="M0 0L10 5L0 10z" /></marker><marker id="scene-meaning-to-bytes-head-state" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="state" d="M0 0L10 5L0 10z" /></marker><marker id="scene-meaning-to-bytes-head-process" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="process" d="M0 0L10 5L0 10z" /></marker><marker id="scene-meaning-to-bytes-head-output" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="output" d="M0 0L10 5L0 10z" /></marker><marker id="scene-meaning-to-bytes-head-caution" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="caution" d="M0 0L10 5L0 10z" /></marker><marker id="scene-meaning-to-bytes-head-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="muted" d="M0 0L10 5L0 10z" /></marker><marker id="scene-meaning-to-bytes-head-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" d="M0 0L10 5L0 10z" /></marker></defs><g data-a="idea" transform="translate(24 30)"><text fill="#11151a" class="scene__label scene__free" font-size="15">World idea: a character owns coins it can spend.</text></g><g data-a="modelTag" data-role="muted" transform="translate(24 78)"><text fill="#11151a" class="scene__label scene__free" font-size="13">game-data model: the parts the rules need</text></g><g data-a="c17" data-role="state" transform="translate(24 88)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="204" height="42" rx="5" /><text fill="#11151a" class="scene__label scene__mid scene__mono" x="102" y="21" dy=".35em" text-anchor="middle" font-size="15">player ID = 17</text></g><g data-a="c76" data-role="state" transform="translate(252 88)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="204" height="42" rx="5" /><text fill="#11151a" class="scene__label scene__mid scene__mono" x="102" y="21" dy=".35em" text-anchor="middle" font-size="15">gold = 76</text></g><g data-a="fmtTag" data-role="muted" transform="translate(24 184)"><text fill="#11151a" class="scene__label scene__free" font-size="13">format: the player ID first, then the gold, one byte each</text></g><g data-a="s0" data-role="process" transform="translate(24 194)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect scene__rect--ghost" width="204" height="52" rx="6" /></g><g data-a="s1" data-role="process" transform="translate(252 194)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect scene__rect--ghost" width="204" height="52" rx="6" /></g><g data-a="s0n" data-role="muted" transform="translate(126 262)"><text fill="#11151a" class="scene__label scene__free" text-anchor="middle" font-size="13">byte 0: player ID</text></g><g data-a="s1n" data-role="muted" transform="translate(354 262)"><text fill="#11151a" class="scene__label scene__free" text-anchor="middle" font-size="13">byte 1: gold</text></g><g data-a="v0" data-role="output" transform="translate(94 204)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="64" height="36" rx="5" /><text fill="#11151a" class="scene__label scene__mid scene__mono" x="32" y="18" dy=".35em" text-anchor="middle" font-size="18">0x11</text></g><g data-a="v1" data-role="output" transform="translate(322 204)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="64" height="36" rx="5" /><text fill="#11151a" class="scene__label scene__mid scene__mono" x="32" y="18" dy=".35em" text-anchor="middle" font-size="18">0x4C</text></g><g data-a="d0" transform="translate(24 306)"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="14">17 = 1 × 16 + 1, so the byte is 0x11</text></g><g data-a="d1" transform="translate(24 332)"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="14">76 = 4 × 16 + 12, and 12 is C, so the byte is 0x4C</text></g><g data-a="out" data-role="output" transform="translate(24 368)"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="16">saved bytes: 11 4C</text></g></svg>