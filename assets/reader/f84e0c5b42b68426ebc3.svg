<svg xmlns="http://www.w3.org/2000/svg" width="483" height="414" viewBox="0 0 483 414" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="174.60" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Need</text><rect x="175.60" y="1" width="306.00" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="182.60" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Read the instruction this way</text><rect x="1.00" y="29" width="174.60" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Copy a value</text><rect x="175.60" y="29" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="182.60" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">mov writes a destination; source and</text><text x="182.60" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">flags survive.</text><rect x="1.00" y="73" width="174.60" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Calculate a location</text><rect x="175.60" y="73" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="182.60" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">lea computes an address without reading</text><text x="182.60" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">the field.</text><rect x="1.00" y="117" width="174.60" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Update a total</text><rect x="175.60" y="117" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="182.60" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">add/sub write a result and fresh</text><text x="182.60" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">arithmetic flags.</text><rect x="1.00" y="161" width="174.60" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Count by one</text><rect x="175.60" y="161" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="182.60" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">inc/dec update most arithmetic flags but</text><text x="182.60" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">preserve CF.</text><rect x="1.00" y="205" width="174.60" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="223" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Multiply signed values</text><rect x="175.60" y="205" width="306.00" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="182.60" y="223" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">imul forms choose implicit or explicit</text><text x="182.60" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">destinations; CF/OF report signed</text><text x="182.60" y="255" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">truncation.</text><rect x="1.00" y="265" width="174.60" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="283" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Divide signed values</text><rect x="175.60" y="265" width="306.00" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="182.60" y="283" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">idiv r/m32 uses edx:eax, returns</text><text x="182.60" y="299" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">quotient/remainder, and may raise divide</text><text x="182.60" y="315" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">error.</text><rect x="1.00" y="325" width="174.60" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="343" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Widen a field</text><rect x="175.60" y="325" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="182.60" y="343" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">movzx fills with zeros; movsx repeats</text><text x="182.60" y="359" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">the sign bit.</text><rect x="1.00" y="369" width="174.60" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="387" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Interpret a boundary</text><rect x="175.60" y="369" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="182.60" y="387" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">CF is unsigned carry/borrow; OF is</text><text x="182.60" y="403" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">signed overflow.</text></svg>