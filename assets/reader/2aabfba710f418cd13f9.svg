ce, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Rejects the wrong shape early.</text><rect x="1.00" y="349" width="181.91" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="367" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Ask about a pattern</text><rect x="182.91" y="349" width="249.33" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="189.91" y="367" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">matches!(value, pattern)</text><rect x="432.24" y="349" width="246.76" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="439.24" y="367" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Produces bool.</text><rect x="1.00" y="377" width="181.91" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="395" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Refine an arm</text><rect x="182.91" y="377" width="249.33" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="189.91" y="395" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">pattern if condition =&gt; ...</text><rect x="432.24" y="377" width="246.76" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="439.24" y="395" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Checks the guard before</text><text x="439.24" y="411" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">selecting the arm.</text></svg>