65"/><text x="189.91" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">result.map_err(f)</text><rect x="432.24" y="161" width="246.76" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="439.24" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Runs f only for Err.</text><rect x="1.00" y="189" width="181.91" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="207" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Chain fallible work</text><rect x="182.91" y="189" width="249.33" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="189.91" y="207" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">result.and_then(f)</text><rect x="432.24" y="189" width="246.76" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="439.24" y="207" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">f returns Result.</text><rect x="1.00" y="217" width="181.91" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="235" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Leave on failure</text><rect x="182.91" y="217" width="249.33" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="189.91" y="235" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">result?</text><rect x="432.24" y="217" width="246.76" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="439.24" y="235" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Continues