1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Immediate response to local input</text><rect x="415.90" y="57" width="262.20" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="422.90" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Last locally simulated command</text><rect x="1.00" y="85" width="160.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Interpolated state</text><rect x="161.00" y="85" width="254.90" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="168.00" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Smooth display of remote objects</text><rect x="415.90" y="85" width="262.20" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="422.90" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Render timestamp between snapshots</text><rect x="1.00" y="113" width="160.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Historical state</text><rect x="161.00" y="113" width="254.90" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="168.00" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Rewind or lag-compensation query</text><rect x="415.90" y="113" width="262.20" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="422.90" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fon