<svg xmlns="http://www.w3.org/2000/svg" style="background-color:var(--diagram-paper, #ffffff)" viewBox="0 0 480 456" focusable="false"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><defs><marker id="scene-pe-header-walk-head-input" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="input" d="M0 0L10 5L0 10z" /></marker><marker id="scene-pe-header-walk-head-state" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="state" d="M0 0L10 5L0 10z" /></marker><marker id="scene-pe-header-walk-head-process" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="process" d="M0 0L10 5L0 10z" /></marker><marker id="scene-pe-header-walk-head-output" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="output" d="M0 0L10 5L0 10z" /></marker><marker id="scene-pe-header-walk-head-caution" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="caution" d="M0 0L10 5L0 10z" /></marker><marker id="scene-pe-header-walk-head-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="muted" d="M0 0L10 5L0 10z" /></marker><marker id="scene-pe-header-walk-head-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" d="M0 0L10 5L0 10z" /></marker></defs><g data-a="fileTag" data-role="muted" transform="translate(24 38)"><text fill="#11151a" class="scene__label scene__free" font-size="12">the EXE file on disk, with file offsets</text></g><g data-a="dos" data-role="state" transform="translate(24 64)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="100" height="46" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="50" y="23" dy=".35em" text-anchor="middle" font-size="12">DOS header</text></g><g data-a="sig" data-role="state" transform="translate(124 64)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="36" height="46" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="18" y="23" dy=".35em" text-anchor="middle" font-size="12">PE</text></g><g data-a="coff" data-role="state" transform="translate(160 64)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="66" height="46" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="33" y="23" dy=".35em" text-anchor="middle" font-size="12">COFF</text></g><g data-a="opt" data-role="state" transform="translate(226 64)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="128" height="46" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="64" y="23" dy=".35em" text-anchor="middle" font-size="12">optional header</text></g><g data-a="sec" data-role="output" transform="translate(354 64)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="102" height="46" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="51" y="23" dy=".35em" text-anchor="middle" font-size="12">section table</text></g><g data-a="dosAt" data-role="muted" transform="translate(26 58)"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="10">0x00</text></g><g data-a="sigAt" data-role="muted" transform="translate(126 58)"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="10">0x80</text></g><g data-a="coffAt" data-role="muted" transform="translate(162 58)"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="10">0x84</text></g><g data-a="optAt" data-role="muted" transform="translate(228 58)"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="10">0x98</text></g><g data-a="secAt" data-role="muted" transform="translate(356 58)"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="10">0x178</text></g><g data-a="cur" data-role="process" transform="translate(397 160)"><polygon stroke="#59636f" fill="#edf2f7" class="scene__rect" points="0,0 16,0 8,-12" /></g><g data-a="mz" data-role="input" transform="translate(28 118)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="44" height="22" rx="5" /><text fill="#11151a" class="scene__label scene__mid scene__mono" x="22" y="11" dy=".35em" text-anchor="middle" font-size="12">MZ</text></g><g data-a="mzTag" data-role="muted" transform="translate(78 133)"><text fill="#11151a" class="scene__label scene__free" font-size="11">the first two bytes</text></g><g data-a="rowA" data-role="output" transform="translate(360 168)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="90" height="22" rx="5" /><text fill="#11151a" class="scene__label scene__mid scene__mono" x="45" y="11" dy=".35em" text-anchor="middle" font-size="10">.text  0x178</text></g><g data-a="rowB" data-role="output" transform="translate(360 194)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="90" height="22" rx="5" /><text fill="#11151a" class="scene__label scene__mid scene__mono" x="45" y="11" dy=".35em" text-anchor="middle" font-size="10">.rdata 0x1A0</text></g><g data-a="rowC" data-role="output" transform="translate(360 220)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="90" height="22" rx="5" /><text fill="#11151a" class="scene__label scene__mid scene__mono" x="45" y="11" dy=".35em" text-anchor="middle" font-size="10">.data  0x1C8</text></g><g data-a="f0" transform="translate(24 276)"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="12">MZ: the first two bytes of the file</text></g><g data-a="f1" transform="translate(24 300)"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="12">e_lfanew at 0x3C = 0x80, so the PE signature is at 0x80</text></g><g data-a="f2" transform="translate(24 324)"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="12">bytes at 0x80 are "PE\0\0": the signature checks out</text></g><g data-a="f3" transform="translate(24 348)"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="12">COFF header at 0x80 + 4 = 0x84</text></g><g data-a="f4" transform="translate(24 372)"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="12">machine 0x014C (32-bit x86), 3 sections</text></g><g data-a="f5" transform="translate(24 396)"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="12">optional header at 0x84 + 20 = 0x98; magic 0x10B means PE32</text></g><g data-a="f6" transform="translate(24 420)"><text fill="#11151a" class="scene__label scene__free scene__mono" font-size="12">section table at 0x98 + 0xE0 = 0x178; rows are 0x28 bytes</text></g></svg>