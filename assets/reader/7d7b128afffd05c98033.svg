<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="122.39" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Part</text><rect x="123.39" y="1" width="295.68" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="130.39" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Plain-English meaning</text><rect x="419.08" y="1" width="259.92" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="426.08" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Usually stable?</text><rect x="1.00" y="29" width="122.39" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Opcode</text><rect x="123.39" y="29" width="295.68" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="130.39" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Which operation to perform, such as</text><text x="130.39" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">subtract or call</text><rect x="419.08" y="29" width="259.92" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="426.08" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Often</text><rect x="1.00" y="73" width="122.39" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">ModR/M and SIB</text><rect x="123.39" y="73" width="295.68" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="130.39" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Which registers and addressing shape</text><text x="130.39" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">to use</text><rect x="419.08" y="73" width="259.92" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="426.08" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Often</text><rect x="1.00" y="117" width="122.39" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Displacement</text><rect x="123.39" y="117" width="295.68" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="130.39" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">A field offset or distance from</text><text x="130.39" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">another address</text><rect x="419.08" y="117" width="259.92" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="426.08" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Sometimes</text><rect x="1.00" y="161" width="122.39" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Immediate</text><rect x="123.39" y="161" width="295.68" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="130.39" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">A number stored directly inside the</text><text x="130.39" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">instruction</text><rect x="419.08" y="161" width="259.92" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="426.08" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Depends on what the number</text><text x="426.08" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">controls</text><rect x="1.00" y="205" width="122.39" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="223" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Relative</text><text x="8.00" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">target</text><rect x="123.39" y="205" width="295.68" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="130.39" y="223" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">How far a call or jump travels</text><rect x="419.08" y="205" width="259.92" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="426.08" y="223" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Often changes when code moves</text></svg>