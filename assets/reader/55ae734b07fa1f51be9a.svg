ace" font-size="12" font-weight="400">Represent data, such as Base64 or UTF-8</text><rect x="1.00" y="57" width="87.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Hash</text><rect x="88.00" y="57" width="108.90" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="95.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">No</text><rect x="196.90" y="57" width="130.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="203.90" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">No</text><rect x="327.70" y="57" width="306.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="334.70" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Produce a fixed-size fingerprint</text><rect x="1.00" y="85" width="87.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">MAC</text><rect x="88.00" y="85" width="108.90" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="95.00" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">No</text><rect x="196.90" y="85" width="130.80" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="203.90" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Yes</text><rect x="327.70" y="85" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="334.70" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Detect changes made without the secret</text><text x="334.70" y="119" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">key</text><rect x="1.00" y="129" width="87.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="147" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Encryption</text><rect x="88.00" y="129" width="108.90" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="95.00" y="147" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Yes, with key</text><rect x="196.90" y="129" width="130.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="203.90" y="147" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Yes</text><rect x="327.70" y="129" width="306.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="334.70" y="147" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Hide the plaintext</text><rect x="1.00" y="157" width="87.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="175" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">AEAD</text><rect x="88.00" y="157" width="108.90" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="95.00" y="175" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Yes, with key</text><rect x="196.90" y="157" width="130.80" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="203.90" y="175" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Yes</text><rect x="327.70" y="157" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="334.70" y="175" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Hide plaintext and authenticate it and</text><text x="334.70" y="191" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">its context</text></svg>