process" transform="translate(224 0)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="31" height="30" rx="5" /><text fill="#11151a" class="scene__label scene__mid scene__mono" x="15.5" y="15" dy=".35em" text-anchor="middle" font-size="12">7</text></g><g data-a="low.8" data-role="process" transform="translate(256 0)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="31" height="30" rx="5" /><text fill="#11151a" class="scene__label scene__mid scene__mono" x="15.5" y="15" dy=".35em" text-anchor="middle" font-size="12">8</text></g><g data-a="low.9" data-role="process" transform="translate(288 0)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="31" height="30" rx="5" /><text fill="#11151a" class="scene__label scene__mid scene__mono" x="15.5" y="15" dy=".35em" text-anchor="middle" font-size="12">9</text></g><g data-a="low.10" data-role="process" transform="translate(320 0)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="31" height="30" rx="5" /><text fill="#11151a" class="scene__label scene__mid scene__mono" x="15.5" y="15" dy=".35em" text-anchor="middle" font-size="12">10</text></g><g data-a="low.11" data-role="process" transform="translate(352 0)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="31" height="30" rx="5" /><text fill="#11151a" class="scene__label scene__mid scene__mono" x="15.5" y="15" dy=".35em" text-anchor="middle" font-size="12">11</text></g></g><g data-a="wrapRoute" data-role="process" transform="translate(0 0)"><path stroke="#59636f" fill="none" class="scene__line" data-arrow="1" data-len="525" d="M438 77L466 77L466 113L38 113L38 136" stroke-dasharray="525" stroke-dashoffset="0" marker-end="url(#scene-checked-range-overflow-head-process)" /></g><g data-a="wrapLabel" data-role="muted" transform="translate(235 107)"><text fill="#11151a" class="scene__label scene__free" font-size="11">past MAX → back to 0</text></g><g data-a="cursor" data-role="caution" transform="translat