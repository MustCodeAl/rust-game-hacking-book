<svg xmlns="http://www.w3.org/2000/svg" width="490" height="186" viewBox="0 0 490 186" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="181.90" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Measurement</text><rect x="182.90" y="1" width="306.00" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="189.90" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Useful interpretation</text><rect x="1.00" y="29" width="181.90" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Median</text><rect x="182.90" y="29" width="306.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="189.90" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Typical sample duration</text><rect x="1.00" y="57" width="181.90" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">95th or 99th percentile</text><rect x="182.90" y="57" width="306.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="189.90" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Ordinary tail latency</text><rect x="1.00" y="85" width="181.90" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Maximum</text><rect x="182.90" y="85" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="189.90" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">One extreme event; inspect rather than</text><text x="189.90" y="119" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">generalize</text><rect x="1.00" y="129" width="181.90" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="147" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Repeated outliers</text><rect x="182.90" y="129" width="306.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="189.90" y="147" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Evidence that the environment changed</text><rect x="1.00" y="157" width="181.90" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="175" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Game invariant failure</text><rect x="182.90" y="157" width="306.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="189.90" y="175" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Evidence that game state became invalid</text></svg>