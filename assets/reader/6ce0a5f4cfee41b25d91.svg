<svg xmlns="http://www.w3.org/2000/svg" width="680" height="266" viewBox="0 0 680 266" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="223.00" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Question</text><rect x="224.00" y="1" width="227.50" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="231.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Typical PC</text><rect x="451.50" y="1" width="227.50" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="458.50" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Typical console</text><rect x="1.00" y="29" width="223.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Who decides which code may</text><text x="8.00" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">run?</text><rect x="224.00" y="29" width="227.50" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="231.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">the owner, as administrator</text><rect x="451.50" y="29" width="227.50" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="458.50" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">the platform holder, through</text><text x="458.50" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">signatures</text><rect x="1.00" y="73" width="223.00" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Where does trust start?</text><rect x="224.00" y="73" width="227.50" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="231.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">firmware whose Secure Boot</text><text x="231.00" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">keys the owner can change or</text><text x="231.00" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">switch off</text><rect x="451.50" y="73" width="227.50" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="458.50" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">a boot ROM and a fused key</text><text x="458.50" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">hash that nobody can change</text><rect x="1.00" y="133" width="223.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Can the owner debug a</text><text x="8.00" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">running game?</text><rect x="224.00" y="133" width="227.50" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="231.00" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">yes, as Chapters 2 and 5 do</text><rect x="451.50" y="133" width="227.50" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="458.50" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">no; that needs a development</text><text x="458.50" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">kit</text><rect x="1.00" y="177" width="223.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Who holds the storage keys?</text><rect x="224.00" y="177" width="227.50" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="231.00" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">the owner, if the disk is</text><text x="231.00" y="211" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">encrypted at all</text><rect x="451.50" y="177" width="227.50" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="458.50" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">the security processor, never</text><text x="458.50" y="211" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">software</text><rect x="1.00" y="221" width="223.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Can old system software be</text><text x="8.00" y="255" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">reinstalled?</text><rect x="224.00" y="221" width="227.50" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="231.00" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">usually</text><rect x="451.50" y="221" width="227.50" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="458.50" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">no; anti-rollback fuses</text><text x="458.50" y="255" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">refuse it</text></svg>