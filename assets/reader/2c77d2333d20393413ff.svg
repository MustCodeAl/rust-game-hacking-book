<svg xmlns="http://www.w3.org/2000/svg" width="680" height="146" viewBox="0 0 680 146" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="263.15" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Pattern behavior</text><rect x="264.15" y="1" width="148.94" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="271.15" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Meaning</text><rect x="413.09" y="1" width="265.91" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="420.09" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Correct response</text><rect x="1.00" y="29" width="263.15" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">one match only in the design build</text><rect x="264.15" y="29" width="148.94" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="271.15" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">may be overfitted</text><rect x="413.09" y="29" width="265.91" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="420.09" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">compare another build you actually</text><text x="420.09" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">intend to support</text><rect x="1.00" y="73" width="263.15" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">many matches in the design build</text><rect x="264.15" y="73" width="148.94" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="271.15" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">under-specified</text><rect x="413.09" y="73" width="265.91" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="420.09" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">add stable decoded context</text><rect x="1.00" y="101" width="263.15" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="119" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">one decoded candidate in every</text><text x="8.00" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">declared profile</text><rect x="264.15" y="101" width="148.94" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="271.15" y="119" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">appropriately</text><text x="271.15" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">scoped</text><rect x="413.09" y="101" width="265.91" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="420.09" y="119" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">keep each build fingerprint and</text><text x="420.09" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">semantic check</text></svg>