egular, Consolas, monospace" font-size="12" font-weight="400">0x11</text><rect x="350.20" y="57" width="72.40" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="357.20" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">0x11</text><rect x="1.00" y="85" width="276.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Windows virtual-key code it produces</text><rect x="277.80" y="85" width="72.40" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="284.80" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">0x57 (W)</text><rect x="350.20" y="85" width="72.40" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="357.20" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">0x5A (Z)</text></svg>