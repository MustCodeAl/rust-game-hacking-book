<svg xmlns="http://www.w3.org/2000/svg" width="680" height="234" viewBox="0 0 680 234" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="299.50" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Starting state</text><rect x="300.50" y="1" width="299.50" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="307.50" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Path with TMS at 1</text><rect x="600.00" y="1" width="79.00" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="607.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Clocks</text><rect x="1.00" y="29" width="299.50" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Select-IR-Scan</text><rect x="300.50" y="29" width="299.50" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="307.50" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">straight to Test-Logic-Reset</text><rect x="600.00" y="29" width="79.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="607.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">1</text><rect x="1.00" y="57" width="299.50" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Select-DR-Scan</text><rect x="300.50" y="57" width="299.50" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="307.50" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Select-IR-Scan, then as above</text><rect x="600.00" y="57" width="79.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="607.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">1 + 1 =</text><text x="607.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">2</text><rect x="1.00" y="101" width="299.50" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="119" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Run-Test/Idle, Update-DR, or Update-IR</text><rect x="300.50" y="101" width="299.50" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="307.50" y="119" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Select-DR-Scan, then as above</text><rect x="600.00" y="101" width="79.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="607.00" y="119" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">1 + 2 =</text><text x="607.00" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">3</text><rect x="1.00" y="145" width="299.50" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="163" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Exit1 or Exit2, in either column</text><rect x="300.50" y="145" width="299.50" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="307.50" y="163" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">that column’s Update, then as above</text><rect x="600.00" y="145" width="79.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="607.00" y="163" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">1 + 3 =</text><text x="607.00" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">4</text><rect x="1.00" y="189" width="299.50" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="207" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Capture, Shift, or Pause, in either</text><text x="8.00" y="223" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">column</text><rect x="300.50" y="189" width="299.50" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="307.50" y="207" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Exit1 from Capture or Shift, Exit2 from</text><text x="307.50" y="223" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Pause, then as above</text><rect x="600.00" y="189" width="79.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="607.00" y="207" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">1 + 4 =</text><text x="607.00" y="223" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">5</text></svg>