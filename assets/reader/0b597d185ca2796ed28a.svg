<svg xmlns="http://www.w3.org/2000/svg" style="background-color:var(--diagram-paper, #ffffff)" viewBox="0 0 480 240" focusable="false"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><defs><marker id="scene-validated-pickup-head-input" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="input" d="M0 0L10 5L0 10z" /></marker><marker id="scene-validated-pickup-head-state" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="state" d="M0 0L10 5L0 10z" /></marker><marker id="scene-validated-pickup-head-process" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="process" d="M0 0L10 5L0 10z" /></marker><marker id="scene-validated-pickup-head-output" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="output" d="M0 0L10 5L0 10z" /></marker><marker id="scene-validated-pickup-head-caution" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="caution" d="M0 0L10 5L0 10z" /></marker><marker id="scene-validated-pickup-head-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="muted" d="M0 0L10 5L0 10z" /></marker><marker id="scene-validated-pickup-head-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" d="M0 0L10 5L0 10z" /></marker></defs><g data-a="requests" data-role="muted" transform="translate(24 25)"><text fill="#11151a" class="scene__label scene__free" font-size="13">Retrying the same pickup</text></g><g data-a="first" data-role="input" transform="translate(146 61)" opacity="0"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="120" height="30" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="60" y="15" dy=".35em" text-anchor="middle" font-size="15">Pickup C</text></g><g data-a="retry" data-role="muted" transform="translate(146 151)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="120" height="30" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="60" y="15" dy=".35em" text-anchor="middle" font-size="15">Pickup C</text></g><g data-a="gate" data-role="process" transform="translate(269 44)"><path stroke="#59636f" fill="none" class="scene__line" data-len="152" d="M0 0L0 152" style="stroke-width:3px" /></g><g data-a="coin" data-role="output" transform="translate(214 109)" opacity="0"><circle stroke="#59636f" fill="#edf2f7" class="scene__rect" r="7" /></g><g data-a="score" data-role="state" transform="translate(324 54)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="132" height="36" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="66" y="18" dy=".35em" text-anchor="middle" font-size="15">Score: 1</text></g><g data-a="ledger" data-role="plain" transform="translate(306 130)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="150" height="40" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="75" y="20" dy=".35em" text-anchor="middle" font-size="15">C: already applied</text></g><g data-a="result" data-role="muted" transform="translate(24 220)"><text fill="#11151a" class="scene__label scene__free" font-size="13">One object is consumed once, even if its request is retried.</text></g></svg>