eight="400">What transition is</text><text x="8.00" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">requested?</text><rect x="187.29" y="73" width="243.78" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="194.29" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Apply 5 damage</text><rect x="431.07" y="73" width="247.93" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="438.07" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Install a detour</text><rect x="1.00" y="117" width="186.29" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">What must stay true?</text><rect x="187.29" y="117" width="243.78" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="194.29" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Health remains between 0 and</text><text x="194.29" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">100</text><rect x="431.07" y="117" width="247.93" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="438.07" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">A call sees a complete original</text><text x="438.07" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">path or a complete hook path</text><rect x="1.00" y="161" width="186.29" height="76" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Where is the control?</text><rect x="187.29" y="161" width="243.78" height="76" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="194.29" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The damage routine before</text><text x="194.29" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">changing simulation health</text><rect x="431.07" y="161" width="247.93" height="76" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="438.07" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Version check, instruction</text><text x="438.07" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">preparation, and coordinated</text><text x="438.07" y="211" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">publication before calls enter</text><text x="438.07" y="227" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">the detour</text><rect x="1.00" y="237" width="186.29" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="255" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">What can a detector</text><text x="8.00" y="271" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">report?</text><rect x="187.29" y="237" width="243.78" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="194.29" y="255" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">A snapshot finds health outside</text><text x="194.29" y="271" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">the bound</text><rect x="431.07" y="237" width="247.93" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="438.07" y="255" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">A byte or lifecycle check finds</text><text x="438.07" y="271" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">an incomplete installation</text></svg>