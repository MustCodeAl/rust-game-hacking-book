<svg xmlns="http://www.w3.org/2000/svg" width="680" height="242" viewBox="0 0 680 242" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="122.70" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Windows spelli</text><text x="8.00" y="35" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">ng</text><rect x="123.70" y="1" width="277.65" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="130.70" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">What it means at the boundary</text><rect x="401.35" y="1" width="277.65" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="408.35" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Rust reading rule</text><rect x="1.00" y="45" width="122.70" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">DWORD</text><rect x="123.70" y="45" width="277.65" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="130.70" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Unsigned 32-bit integer, even in a</text><text x="130.70" y="79" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">64-bit process</text><rect x="401.35" y="45" width="277.65" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="408.35" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Usually u32; it does not grow into</text><text x="408.35" y="79" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">usize.</text><rect x="1.00" y="89" width="122.70" height="92" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">BOOL</text><rect x="123.70" y="89" width="277.65" height="92" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="130.70" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Signed 32-bit integer Boolean value</text><rect x="401.35" y="89" width="277.65" height="92" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="408.35" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Raw i32, or the binding’s projected</text><text x="408.35" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">type or result; Rust bool has a</text><text x="408.35" y="139" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">different representation. For</text><text x="408.35" y="155" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Boolean truth, test nonzero rather</text><text x="408.35" y="171" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">than equality to 1.</text><rect x="1.00" y="181" width="122.70" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="199" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">HANDLE</text><rect x="123.70" y="181" width="277.65" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="130.70" y="199" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Opaque, pointer-sized object handle</text><rect x="401.35" y="181" width="277.65" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="408.35" y="199" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Use the binding’s handle type; it is</text><text x="408.35" y="215" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">not a Rust reference that you may</text><text x="408.35" y="231" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">dereference.</text></svg>