<svg xmlns="http://www.w3.org/2000/svg" width="410" height="198" viewBox="0 0 410 198" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="407.60" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Follow one label anchor from the world to the screen</text><rect x="1.00" y="29" width="203.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">1. World point</text><rect x="204.80" y="29" width="203.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="211.80" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">world (x, y, z, 1)</text><rect x="1.00" y="57" width="203.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">2. View transform</text><rect x="204.80" y="57" width="203.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="211.80" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">camera coordinates</text><rect x="1.00" y="85" width="203.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">3. Projection transform</text><rect x="204.80" y="85" width="203.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="211.80" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">clip (x, y, z, w)</text><rect x="1.00" y="113" width="203.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">4. Visibility check</text><rect x="204.80" y="113" width="203.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="211.80" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">point inside clip bounds</text><rect x="1.00" y="141" width="203.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="159" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">5. Perspective divide</text><rect x="204.80" y="141" width="203.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="211.80" y="159" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">NDC (x/w, y/w, z/w)</text><rect x="1.00" y="169" width="203.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="187" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">6. Viewport pixels</text><rect x="204.80" y="169" width="203.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="211.80" y="187" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">screen (pixel_x, pixel_y)</text></svg>