text x="211.80" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">gameplay trajectory</text><rect x="1.00" y="113" width="203.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">weapon-model transform</text><rect x="204.80" y="113" width="233.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="211.80" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">view-model animation</text><rect x="1.00" y="141" width="203.80" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="159" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">kick accumulator over time</text><rect x="204.80" y="141" width="233.00" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="211.80" y="159" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">recovery state</text></svg>