<svg xmlns="http://www.w3.org/2000/svg" style="background-color:var(--diagram-paper, #ffffff)" viewBox="0 0 480 240" focusable="false"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><defs><marker id="scene-server-visibility-filter-head-input" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="input" d="M0 0L10 5L0 10z" /></marker><marker id="scene-server-visibility-filter-head-state" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="state" d="M0 0L10 5L0 10z" /></marker><marker id="scene-server-visibility-filter-head-process" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="process" d="M0 0L10 5L0 10z" /></marker><marker id="scene-server-visibility-filter-head-output" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="output" d="M0 0L10 5L0 10z" /></marker><marker id="scene-server-visibility-filter-head-caution" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="caution" d="M0 0L10 5L0 10z" /></marker><marker id="scene-server-visibility-filter-head-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" data-role="muted" d="M0 0L10 5L0 10z" /></marker><marker id="scene-server-visibility-filter-head-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path stroke="#59636f" fill="#59636f" class="scene__tip" d="M0 0L10 5L0 10z" /></marker></defs><g data-a="world" transform="translate(16 42)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect scene__rect--plain" width="216" height="148" rx="6" /></g><g data-a="view" transform="translate(252 42)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect scene__rect--plain" width="212" height="148" rx="6" /></g><g data-a="wl" data-role="muted" transform="translate(24 25)"><text fill="#11151a" class="scene__label scene__free" font-size="13">Server world</text></g><g data-a="cl" data-role="muted" transform="translate(260 25)"><text fill="#11151a" class="scene__label scene__free" font-size="13">Client observation</text></g><g data-a="observer" data-role="input" transform="translate(52 120)"><circle stroke="#59636f" fill="#edf2f7" class="scene__rect" r="7" /></g><g data-a="enemy" data-role="caution" transform="translate(146 52)"><circle stroke="#59636f" fill="#edf2f7" class="scene__rect" r="7" /></g><g data-a="wall" data-role="muted" transform="translate(108 84)"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="16" height="54" rx="6" /></g><g data-a="blocked" data-role="caution" transform="translate(52 120)" opacity="0"><path stroke="#59636f" fill="none" class="scene__line" data-len="55" d="M0 0L55 0" style="stroke-width:2px" /></g><g data-a="clear" data-role="output" transform="translate(52 120)"><path stroke="#59636f" fill="none" class="scene__line" data-len="116.02" d="M0 0L94 -68" style="stroke-width:2px" /></g><g data-a="seen" data-role="caution" transform="translate(382 52)"><circle stroke="#59636f" fill="#edf2f7" class="scene__rect" r="7" /></g><g data-a="packet" data-role="state" transform="translate(362 153)" opacity="0"><rect stroke="#59636f" fill="#edf2f7" class="scene__rect" width="72" height="26" rx="5" /><text fill="#11151a" class="scene__label scene__mid" x="36" y="13" dy=".35em" text-anchor="middle" font-size="15">Position</text></g><g data-a="status" data-role="muted" transform="translate(260 215)"><text fill="#11151a" class="scene__label scene__free" font-size="13">Relevant position received</text></g></svg>