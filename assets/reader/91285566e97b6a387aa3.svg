ffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">1</text><rect x="51.50" y="45" width="174.65" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="58.50" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">20.00</text><rect x="226.15" y="45" width="179.02" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="233.15" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">0 + 20.00 = 20.00</text><rect x="405.17" y="45" width="161.26" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="412.17" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">1</text><rect x="566.43" y="45" width="112.57" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="573.43" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">20.00 − 16.67</text><text x="573.43" y="79" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">= 3.33</text><rect x="1.00" y="89" width="50.50" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">2</text><rect x="51.50" y="89" width="174.65" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="58.50" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">20.00</text><rect x="226.15" y="89" width="179.02" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="233.15" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">3.33 + 20.00 = 23.33</text><rect x="405.17" y="89" width="161.26" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="412.17" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">1</text><rect x="566.43" y="89" width="112.57" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="573.43" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">23.33 − 16.67</text><text x="573.43" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">= 6.67</text><rect x="1.00" y="133" width="50.50" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">3</text><rect x="51.50" y="133" width="174.65" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="58.50" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">30.00</text><rect x="226.15" y="133" width="179.02" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="233.15" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">6.67 + 30.00 = 36.67</text><rect x="405.17" y="133" width="161.26" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="412.17" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">2</text><rect x="566.43" y="133" width="112.57" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="573.43" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">36.67 − 33.33</text><text x="573.43" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">= 3.33</text></svg>