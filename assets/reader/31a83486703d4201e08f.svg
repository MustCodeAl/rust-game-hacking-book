<svg xmlns="http://www.w3.org/2000/svg" width="498" height="198" viewBox="0 0 498 198" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="495.20" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">A four-byte read crosses the privilege boundary</text><rect x="1.00" y="29" width="284.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">1. Submit the user-mode request</text><rect x="285.10" y="29" width="211.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="292.10" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">4 bytes at 0x00501000</text><rect x="1.00" y="57" width="284.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">2. Follow the application wrappers</text><rect x="285.10" y="57" width="211.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="292.10" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">ring 3; NtReadVirtualMemory</text><rect x="1.00" y="85" width="284.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">3. Enter the prepared kernel path</text><rect x="285.10" y="85" width="211.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="292.10" y="103" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">ring 0; kernel dispatch</text><rect x="1.00" y="113" width="284.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">4. Validate ranges and authority</text><rect x="285.10" y="113" width="211.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="292.10" y="131" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">0x1010 &amp; 0x0010 = 0x0010</text><rect x="1.00" y="141" width="284.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="159" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">5. Copy in the correct address spaces</text><rect x="285.10" y="141" width="211.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="292.10" y="159" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">game memory → tool buffer</text><rect x="1.00" y="169" width="284.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="187" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">6. Return and check the result</text><rect x="285.10" y="169" width="211.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="292.10" y="187" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">ring 3; check bytes read</text></svg>