<svg xmlns="http://www.w3.org/2000/svg" width="680" height="266" viewBox="0 0 680 266" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="94.30" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Contract</text><rect x="95.30" y="1" width="291.85" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="102.30" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">What must remain true</text><rect x="387.15" y="1" width="291.85" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="394.15" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Typical failure</text><rect x="1.00" y="29" width="94.30" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Instruction</text><rect x="95.30" y="29" width="291.85" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="102.30" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Whole instructions are displaced and</text><text x="102.30" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">relocated correctly</text><rect x="387.15" y="29" width="291.85" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="394.15" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Return lands inside an instruction</text><rect x="1.00" y="73" width="94.30" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">ABI</text><rect x="95.30" y="73" width="291.85" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="102.30" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Required registers, stack alignment,</text><text x="102.30" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">unwind expectations, and return values</text><text x="102.30" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">survive</text><rect x="387.15" y="73" width="291.85" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="394.15" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Caller receives corrupted state</text><rect x="1.00" y="133" width="94.30" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Identity</text><rect x="95.30" y="133" width="291.85" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="102.30" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Expected module build and original</text><text x="102.30" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">bytes match</text><rect x="387.15" y="133" width="291.85" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="394.15" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Patch targets a different function</text><text x="394.15" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">version</text><rect x="1.00" y="177" width="94.30" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Concurrency</text><rect x="95.30" y="177" width="291.85" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="102.30" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">No thread executes a partly written or</text><text x="102.30" y="211" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">already freed path</text><rect x="387.15" y="177" width="291.85" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="394.15" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Intermittent crash during</text><text x="394.15" y="211" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">install/remove</text><rect x="1.00" y="221" width="94.30" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Lifetime</text><rect x="95.30" y="221" width="291.85" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="102.30" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Callback state and trampoline outlive</text><text x="102.30" y="255" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">every user</text><rect x="387.15" y="221" width="291.85" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="394.15" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Removal frees memory while a callback</text><text x="394.15" y="255" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">runs</text></svg>