<svg xmlns="http://www.w3.org/2000/svg" width="512" height="86" viewBox="0 0 512 86" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="196.50" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Arrangement</text><rect x="197.50" y="1" width="174.60" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="204.50" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Time per frame</text><rect x="372.10" y="1" width="138.10" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="379.10" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Frames per second</text><rect x="1.00" y="29" width="196.50" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">one stage after the other</text><rect x="197.50" y="29" width="174.60" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="204.50" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">6 + 8 = 14 ms</text><rect x="372.10" y="29" width="138.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="379.10" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">1000 ÷ 14 = 71</text><rect x="1.00" y="57" width="196.50" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">overlapped</text><rect x="197.50" y="57" width="174.60" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="204.50" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">the slower stage, 8 ms</text><rect x="372.10" y="57" width="138.10" height="28" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="379.10" y="75" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">1000 ÷ 8 = 125</text></svg>