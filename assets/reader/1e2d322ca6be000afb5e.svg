<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="187.27" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">What you found</text><rect x="188.27" y="1" width="242.38" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="195.27" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Safe to reuse?</text><rect x="430.65" y="1" width="248.35" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="437.65" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Why</text><rect x="1.00" y="29" width="187.27" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">A raw address from one</text><text x="8.00" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">run</text><rect x="188.27" y="29" width="242.38" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="195.27" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">No reliable reuse after a</text><text x="195.27" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">restart</text><rect x="430.65" y="29" width="248.35" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="437.65" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The module or object may have a</text><text x="437.65" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">different base</text><rect x="1.00" y="73" width="187.27" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">An offset from the</text><text x="8.00" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">module base</text><rect x="188.27" y="73" width="242.38" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="195.27" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Usually after a restart of the</text><text x="195.27" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">same build</text><rect x="430.65" y="73" width="248.35" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="437.65" y="91" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The linker fixed its place</text><text x="437.65" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">within that image</text><rect x="1.00" y="117" width="187.27" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">A field offset like</text><text x="8.00" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">+0x30</text><rect x="188.27" y="117" width="242.38" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="195.27" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Usually for objects of that</text><text x="195.27" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">type in the same build</text><rect x="430.65" y="117" width="248.35" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="437.65" y="135" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The compiler chose the layout</text><rect x="1.00" y="161" width="187.27" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">A byte pattern</text><rect x="188.27" y="161" width="242.38" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="195.27" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Verify it in each build</text><rect x="430.65" y="161" width="248.35" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="437.65" y="179" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Compilation or linking can</text><text x="437.65" y="195" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">change its bytes</text><rect x="1.00" y="205" width="187.27" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="223" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">“Health is 48 bytes in”</text><rect x="188.27" y="205" width="242.38" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="195.27" y="223" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Recheck after a rebuild</text><rect x="430.65" y="205" width="248.35" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="437.65" y="223" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">A new field earlier in the</text><text x="437.65" y="239" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">structure may shift it</text></svg>