ith different</text><text x="320.70" y="251" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">names.</text><rect x="1.00" y="261" width="181.90" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="279" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">+0x338</text><rect x="182.90" y="261" width="130.80" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="189.90" y="279" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Dead flag (u32)</text><rect x="313.70" y="261" width="306.00" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="320.70" y="279" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Observe zero while alive and a changed</text><text x="320.70" y="295" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">flag after death.</text></svg>