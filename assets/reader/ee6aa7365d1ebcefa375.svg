<svg xmlns="http://www.w3.org/2000/svg" width="680" height="386" viewBox="0 0 680 386" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="106.04" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Defensive</text><text x="8.00" y="35" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">gap</text><rect x="107.04" y="1" width="285.98" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="114.04" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">What the control wrongly assumed</text><rect x="393.02" y="1" width="285.98" height="44" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="400.02" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Safer lab test</text><rect x="1.00" y="45" width="106.04" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Coverage gap</text><rect x="107.04" y="45" width="285.98" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="114.04" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Every execution, input, and memory</text><text x="114.04" y="79" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">path passes the point it observes</text><rect x="393.02" y="45" width="285.98" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="400.02" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Send labeled events through toy paths</text><text x="400.02" y="79" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">and compare logs</text><rect x="1.00" y="89" width="106.04" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Identity gap</text><rect x="107.04" y="89" width="285.98" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="114.04" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">The name, signer, PID, or handle it</text><text x="114.04" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">trusted cannot change</text><rect x="393.02" y="89" width="285.98" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="400.02" y="107" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Restart/rebuild the toy target and</text><text x="400.02" y="123" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">verify identity is re-evaluated</text><rect x="1.00" y="133" width="106.04" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Time gap</text><rect x="107.04" y="133" width="285.98" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="114.04" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Trusted state stays the same between</text><text x="114.04" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">the check and the use</text><rect x="393.02" y="133" width="285.98" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="400.02" y="151" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Pause between validation and use,</text><text x="400.02" y="167" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">mutate a fixture, and expect</text><text x="400.02" y="183" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">rejection</text><rect x="1.00" y="193" width="106.04" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="211" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Parser gap</text><rect x="107.04" y="193" width="285.98" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="114.04" y="211" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Producer and consumer agree about</text><text x="114.04" y="227" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">lengths and encodings</text><rect x="393.02" y="193" width="285.98" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="400.02" y="211" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Feed a corpus of bounded malformed</text><text x="400.02" y="227" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">fixtures into both parsers</text><rect x="1.00" y="237" width="106.04" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="255" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Privilege</text><text x="8.00" y="271" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">gap</text><rect x="107.04" y="237" width="285.98" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="114.04" y="255" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Requests reaching a higher-privilege</text><text x="114.04" y="271" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">component are already safe to accept</text><rect x="393.02" y="237" width="285.98" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="400.02" y="255" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Exercise a fake broker with</text><text x="400.02" y="271" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">least-privilege test tokens</text><rect x="1.00" y="281" width="106.04" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="299" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Telemetry</text><text x="8.00" y="315" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">gap</text><rect x="107.04" y="281" width="285.98" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="114.04" y="299" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">A blocked action needs no event of</text><text x="114.04" y="315" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">its own</text><rect x="393.02" y="281" width="285.98" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="400.02" y="299" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Assert that every allow, deny,</text><text x="400.02" y="315" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">timeout, and parse failure has an</text><text x="400.02" y="331" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">event</text><rect x="1.00" y="341" width="106.04" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="359" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Recovery gap</text><rect x="107.04" y="341" width="285.98" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="114.04" y="359" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">A crash cannot leave hooks, input,</text><text x="114.04" y="375" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">bytes, or handles in a bad state</text><rect x="393.02" y="341" width="285.98" height="44" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="400.02" y="359" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">Inject worker errors and verify</text><text x="400.02" y="375" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">reverse-order cleanup</text></svg>