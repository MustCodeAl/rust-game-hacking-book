<svg xmlns="http://www.w3.org/2000/svg" width="614" height="550" viewBox="0 0 614 550" role="img" aria-label="Lesson table"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><title>Lesson table</title><rect x="1.00" y="1" width="138.10" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Bytes</text><rect x="139.10" y="1" width="167.30" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="146.10" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">Assembly</text><rect x="306.40" y="1" width="306.00" height="28" fill="#e7eef4" stroke="#c8d3dd" stroke-width="0.65"/><text x="313.40" y="19" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">How the bytes read</text><rect x="1.00" y="29" width="138.10" height="92" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">8B 45 08</text><rect x="139.10" y="29" width="167.30" height="92" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="146.10" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">mov eax, [ebp+8]</text><rect x="306.40" y="29" width="306.00" height="92" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="313.40" y="47" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">8B is MOV r32, r/m32: reg is the</text><text x="313.40" y="63" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">destination and r/m is the source.</text><text x="313.40" y="79" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">ModR/M 45 = 01 000 101: mod 01 (memory),</text><text x="313.40" y="95" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">reg 000 = EAX or /0, r/m 101 gives</text><text x="313.40" y="111" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">[EBP]+disp8.</text><rect x="1.00" y="121" width="138.10" height="92" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="139" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">89 D8</text><rect x="139.10" y="121" width="167.30" height="92" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="146.10" y="139" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">mov eax, ebx</text><rect x="306.40" y="121" width="306.00" height="92" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="313.40" y="139" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">89 is MOV r/m32, r32: r/m is the</text><text x="313.40" y="155" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">destination and reg is the source.</text><text x="313.40" y="171" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">ModR/M D8 = 11 011 000: mod 11</text><text x="313.40" y="187" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">(register), reg 011 = EBX or /3, r/m 000</text><text x="313.40" y="203" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">names EAX.</text><rect x="1.00" y="213" width="138.10" height="76" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="231" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">83 C0 01</text><rect x="139.10" y="213" width="167.30" height="76" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="146.10" y="231" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">add eax, 1</text><rect x="306.40" y="213" width="306.00" height="76" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="313.40" y="231" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">83 /digit imm8: the reg field picks the</text><text x="313.40" y="247" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">operation, so /0 is ADD. ModR/M C0 = 11</text><text x="313.40" y="263" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">000 000: mod 11 (register), reg 000 =</text><text x="313.40" y="279" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">EAX or /0, r/m 000 names EAX.</text><rect x="1.00" y="289" width="138.10" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="307" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">83 E8 01</text><rect x="139.10" y="289" width="167.30" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="146.10" y="307" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">sub eax, 1</text><rect x="306.40" y="289" width="306.00" height="60" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="313.40" y="307" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">83 /digit imm8: /5 is SUB. ModR/M E8 =</text><text x="313.40" y="323" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">11 101 000: mod 11 (register), reg 101 =</text><text x="313.40" y="339" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">EBP or /5, r/m 000 names EAX.</text><rect x="1.00" y="349" width="138.10" height="108" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="367" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">8B 04 24</text><rect x="139.10" y="349" width="167.30" height="108" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="146.10" y="367" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">mov eax, [esp]</text><rect x="306.40" y="349" width="306.00" height="108" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="313.40" y="367" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">8B is MOV r32, r/m32. The SIB byte 24</text><text x="313.40" y="383" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">supplies the base. ModR/M 04 = 00 000</text><text x="313.40" y="399" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">100: mod 00 (memory), reg 000 = EAX or</text><text x="313.40" y="415" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">/0, r/m 100 gives [--][--]. SIB 24 = 00</text><text x="313.40" y="431" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">100 100: scale 1, no index, base ESP, so</text><text x="313.40" y="447" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">the address is [ESP].</text><rect x="1.00" y="457" width="138.10" height="92" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="8.00" y="475" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">8B 05 78 56 34 12</text><rect x="139.10" y="457" width="167.30" height="92" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="146.10" y="475" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">mov eax, [0x12345678]</text><rect x="306.40" y="457" width="306.00" height="92" fill="#ffffff" stroke="#c8d3dd" stroke-width="0.65"/><text x="313.40" y="475" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">8B is MOV r32, r/m32. The four</text><text x="313.40" y="491" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">displacement bytes are little-endian: 78</text><text x="313.40" y="507" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">56 34 12 is 0x12345678. ModR/M 05 = 00</text><text x="313.40" y="523" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">000 101: mod 00 (memory), reg 000 = EAX</text><text x="313.40" y="539" fill="#1c2733" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400">or /0, r/m 101 gives disp32.</text></svg>