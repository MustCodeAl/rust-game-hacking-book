<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" style="background:#fff"><style>
svg{background:#fff;color:#11151a;font-family:system-ui,sans-serif}
[data-role]{--r:#59636f}[data-role="input"],[data-role="state"]{--r:#235b94}[data-role="process"]{--r:#704098}[data-role="output"]{--r:#28693b}[data-role="caution"]{--r:#9b371f}[data-role="muted"]{--r:#59636f}
.scene__rect{fill:color-mix(in srgb,var(--r) 10%,#fff);stroke:var(--r);stroke-width:1.5}.scene__rect--ghost{fill:none;stroke-dasharray:4 3}.scene__rect--plain{fill:#fff}.scene__label{fill:#11151a}.scene__mono{font-family:monospace}.scene__free{fill:var(--r)}.scene__line{fill:none;stroke:var(--r);stroke-width:2}.scene__tip{fill:var(--r)}
.nodeLabel,.edgeLabel{color:#11151a!important}.labelBkg{fill:#fff!important}
</style><rect x="3" y="4" width="214" height="56" rx="3" fill="#f2f5f8" stroke="#59636f"/><text x="110" y="20" text-anchor="middle" font-family="monospace" font-size="10" fill="#59636f">Position column</text><text x="110" y="36" text-anchor="middle" font-family="monospace" font-size="12" fill="#11151a">10,000 × 8 bytes = 80,000</text><text x="110" y="52" text-anchor="middle" font-family="monospace" font-size="12" fill="#11151a">bytes, one run</text><rect x="3" y="68" width="214" height="56" rx="3" fill="#f2f5f8" stroke="#59636f"/><text x="110" y="84" text-anchor="middle" font-family="monospace" font-size="10" fill="#59636f">Velocity column</text><text x="110" y="100" text-anchor="middle" font-family="monospace" font-size="12" fill="#11151a">10,000 × 8 bytes = 80,000</text><text x="110" y="116" text-anchor="middle" font-family="monospace" font-size="12" fill="#11151a">bytes, one run</text><rect x="3" y="132" width="214" height="56" rx="3" fill="#f2f5f8" stroke="#59636f"/><text x="110" y="148" text-anchor="middle" font-family="monospace" font-size="10" fill="#59636f">Health column</text><text x="110" y="164" text-anchor="middle" font-family="monospace" font-size="12" fill="#11151a">10,000 × 4 bytes = 40,000</text><text x="110" y="180" text-anchor="middle" font-family="monospace" font-size="12" fill="#11151a">bytes, one run</text></svg>