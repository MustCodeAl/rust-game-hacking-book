[package]
name = "gha-firmware-labs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "A small bare-metal Cortex-M3 firmware lesson for QEMU"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lamp-firmware"
path = "src/main.rs"
test = false
bench = false

[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m-rt = "=0.7.7"
cortex-m-semihosting = "=0.6.0"

[lints.rust]
unsafe_code = "forbid"
