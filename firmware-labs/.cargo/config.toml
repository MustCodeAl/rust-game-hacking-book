[build]
# Cortex-M3 instructions, no guest operating system, software floating point.
target = "thumbv7m-none-eabi"

[target.thumbv7m-none-eabi]
# cortex-m-rt supplies link.x, which includes our board-specific memory.x.
rustflags = ["-C", "link-arg=-Tlink.x"]

# Cargo appends the executable's path after -kernel. This runner is for QEMU,
# not for programming a physical board.
runner = [
    "qemu-system-arm",
    "-cpu", "cortex-m3",
    "-machine", "lm3s6965evb",
    "-nographic",
    "-semihosting-config", "enable=on,target=native",
    "-kernel",
]
