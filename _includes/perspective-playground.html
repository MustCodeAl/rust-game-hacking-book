<section class="projection-lab" data-projection-lab aria-labelledby="projection-lab-title">
  <header class="projection-lab__header">
    <div>
      <span>Interactive projection model</span>
      <h3 id="projection-lab-title">Move one camera-space point through perspective</h3>
    </div>
    <p>Convention: the camera looks along <code>+Z</code>, <code>+X</code> points right, <code>+Y</code> points up, and the viewport is 1280 × 720.</p>
  </header>

  <div class="projection-lab__controls">
    <label>
      <span>Right / left <output data-projection-output="x">2.0</output></span>
      <input data-projection-input="x" type="range" min="-10" max="10" step="0.1" value="2">
    </label>
    <label>
      <span>Up / down <output data-projection-output="y">1.0</output></span>
      <input data-projection-input="y" type="range" min="-6" max="6" step="0.1" value="1">
    </label>
    <label>
      <span>Forward depth <output data-projection-output="z">8.0</output></span>
      <input data-projection-input="z" type="range" min="0.2" max="20" step="0.1" value="8">
    </label>
    <label>
      <span>Vertical field of view <output data-projection-output="fov">70°</output></span>
      <input data-projection-input="fov" type="range" min="35" max="110" step="1" value="70">
    </label>
  </div>

  <div class="projection-lab__visuals">
    <figure>
      <figcaption>Top view of the camera frustum</figcaption>
      <svg data-projection-frustum viewBox="0 0 440 230" role="img" aria-labelledby="projection-frustum-title projection-frustum-desc">
        <title id="projection-frustum-title">Camera frustum viewed from above</title>
        <desc id="projection-frustum-desc">The camera sits at the left. Two rays widen with depth, and a movable point can be inside or outside those rays.</desc>
        <line class="projection-lab__axis" x1="44" y1="115" x2="412" y2="115"></line>
        <line class="projection-lab__frustum-edge" data-frustum-edge="top" x1="44" y1="115" x2="412" y2="30"></line>
        <line class="projection-lab__frustum-edge" data-frustum-edge="bottom" x1="44" y1="115" x2="412" y2="200"></line>
        <line class="projection-lab__near" x1="50" y1="108" x2="50" y2="122"></line>
        <path class="projection-lab__camera" d="M20 101 L44 115 L20 129 Z"></path>
        <circle class="projection-lab__point" data-frustum-point cx="190" cy="94" r="7"></circle>
        <text x="14" y="151">camera</text>
        <text x="380" y="108">+Z</text>
        <text data-frustum-point-label x="199" y="87">point</text>
      </svg>
    </figure>

    <figure>
      <figcaption>Viewport after the perspective divide</figcaption>
      <svg data-projection-screen viewBox="0 0 400 230" role="img" aria-labelledby="projection-screen-title projection-screen-desc">
        <title id="projection-screen-title">Projected point on a sixteen by nine viewport</title>
        <desc id="projection-screen-desc">A movable point is plotted on a rectangular screen after conversion from normalized device coordinates.</desc>
        <rect class="projection-lab__viewport" x="26" y="12" width="348" height="196"></rect>
        <line class="projection-lab__axis" x1="200" y1="12" x2="200" y2="208"></line>
        <line class="projection-lab__axis" x1="26" y1="110" x2="374" y2="110"></line>
        <circle class="projection-lab__point" data-screen-point cx="249" cy="93" r="8"></circle>
        <text x="31" y="29">(0, 0)</text>
        <text x="303" y="201">(1280, 720)</text>
        <text data-screen-point-label x="261" y="87">(—, —)</text>
      </svg>
    </figure>
  </div>

  <div class="projection-lab__result" aria-live="polite">
    <strong data-projection-status>Inside the view</strong>
    <span data-projection-math></span>
  </div>
</section>
