<button
  class="print-pdf-button{% if include.compact %} print-pdf-button--compact{% endif %}"
  type="button"
  data-print-book
  {% if page.url == "/" %}data-print-entire-book="{{ site.baseurl }}/print/?autoprint=1"{% endif %}
  aria-label="Print this lesson or save it as a PDF"
  title="Print this lesson or save it as a PDF"
>
  <span aria-hidden="true">🖨️</span>
  <span class="print-pdf-button__label">{% if page.url == "/" %}Print whole book{% else %}Print / save PDF{% endif %}</span>
</button>
