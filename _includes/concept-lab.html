{% assign lab_label = include.label | default: "Interactive concept lab" %}
<section
  class="concept-lab"
  id="{{ include.id | default: include.lab | escape }}"
  data-concept-lab="{{ include.lab }}"
  data-concept-id="{{ include.id | default: include.lab }}"
  aria-label="{{ lab_label }}"
>
  <p class="concept-lab__fallback">This interactive lab needs JavaScript. The lesson text around it still explains the same idea.</p>
</section>
