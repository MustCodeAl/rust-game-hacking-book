{% assign theme_menu_id = include.id | default: "academy-theme-menu" %}
<div class="theme-switcher{% if include.compact %} theme-switcher--compact{% endif %}" data-theme-switcher>
    <button
        class="theme-switcher__toggle"
        type="button"
        aria-expanded="false"
        aria-controls="{{ theme_menu_id }}"
    >
        <span class="theme-switcher__glyph" aria-hidden="true">◐</span>
        <span class="theme-switcher__toggle-label">Reader theme</span>
        <strong data-theme-label>Paper</strong>
    </button>
    <div class="theme-switcher__menu" id="{{ theme_menu_id }}" hidden>
        <p>Choose a reading palette</p>
        <div class="theme-switcher__choices" role="list" aria-label="Reader themes">
            <button type="button" data-theme-choice="paper" aria-pressed="true">
                <span class="theme-swatch theme-swatch--paper" aria-hidden="true"></span>
                <span><strong>Paper</strong><small>Warm field notes</small></span>
            </button>
            <button type="button" data-theme-choice="purple" aria-pressed="false">
                <span class="theme-swatch theme-swatch--purple" aria-hidden="true"></span>
                <span><strong>Purple</strong><small>Original dark Academy</small></span>
            </button>
            <button type="button" data-theme-choice="midnight" aria-pressed="false">
                <span class="theme-swatch theme-swatch--midnight" aria-hidden="true"></span>
                <span><strong>Midnight</strong><small>Blue terminal glow</small></span>
            </button>
            <button type="button" data-theme-choice="forest" aria-pressed="false">
                <span class="theme-swatch theme-swatch--forest" aria-hidden="true"></span>
                <span><strong>Forest</strong><small>Low-glare green</small></span>
            </button>
            <button type="button" data-theme-choice="contrast" aria-pressed="false">
                <span class="theme-swatch theme-swatch--contrast" aria-hidden="true"></span>
                <span><strong>Contrast</strong><small>Black, white, yellow</small></span>
            </button>
        </div>
        <small class="theme-switcher__shortcut">Shortcut: Alt + T cycles themes</small>
    </div>
</div>
