{% assign theme_menu_id = include.id | default: "academy-theme-menu" %}
<div class="theme-switcher{% if include.compact %} theme-switcher--compact{% endif %}" data-theme-switcher>
    <button
        class="theme-switcher__toggle"
        type="button"
        aria-expanded="false"
        aria-controls="{{ theme_menu_id }}"
    >
        <span class="theme-switcher__glyph" aria-hidden="true">◐</span>
        <span class="theme-switcher__toggle-label">Reader theme</span>
        <strong class="theme-switcher__current">
            <span data-theme-label>Paper</span><span aria-hidden="true"> · </span><span data-mode-label>Light</span>
        </strong>
    </button>
    <div class="theme-switcher__menu" id="{{ theme_menu_id }}" hidden>
        <div class="theme-switcher__menu-heading">
            <span aria-hidden="true">🎨</span>
            <span><strong>Appearance</strong><small>Page, code, and readability</small></span>
        </div>

        <div class="theme-switcher__section">
            <p>Page brightness</p>
            <div class="theme-switcher__modes" role="group" aria-label="Reader brightness">
                <button type="button" data-mode-choice="light" aria-pressed="true"><span aria-hidden="true">☀️</span> Light</button>
                <button type="button" data-mode-choice="dark" aria-pressed="false"><span aria-hidden="true">🌙</span> Dark</button>
            </div>
        </div>

        <div class="theme-switcher__section">
            <p>Page background</p>
            <div class="theme-switcher__backgrounds" role="group" aria-label="Page background color">
                <button type="button" data-background-choice="theme" aria-pressed="true"><span class="background-dot background-dot--theme" aria-hidden="true"></span>Theme</button>
                <button type="button" data-background-choice="warm" aria-pressed="false"><span class="background-dot background-dot--warm" aria-hidden="true"></span>Warm</button>
                <button type="button" data-background-choice="cool" aria-pressed="false"><span class="background-dot background-dot--cool" aria-hidden="true"></span>Cool</button>
                <button type="button" data-background-choice="rose" aria-pressed="false"><span class="background-dot background-dot--rose" aria-hidden="true"></span>Rose</button>
                <button type="button" data-background-choice="neutral" aria-pressed="false"><span class="background-dot background-dot--neutral" aria-hidden="true"></span>Neutral</button>
            </div>
        </div>

        <div class="theme-switcher__section">
            <p>Code brightness</p>
            <div class="theme-switcher__modes theme-switcher__modes--code" role="group" aria-label="Code-block brightness">
                <button type="button" data-code-mode-choice="dark" aria-pressed="true"><span aria-hidden="true">⌨️</span> Dark</button>
                <button type="button" data-code-mode-choice="light" aria-pressed="false"><span aria-hidden="true">📄</span> Light</button>
            </div>
        </div>

        <div class="theme-switcher__section">
            <p>Syntax colors</p>
            <div class="theme-switcher__modes theme-switcher__modes--palette" role="group" aria-label="Syntax color palette">
                <button type="button" data-syntax-palette-choice="academy" aria-pressed="true">Academy</button>
                <button type="button" data-syntax-palette-choice="cyber" aria-pressed="false">Cyber</button>
                <button type="button" data-syntax-palette-choice="aurora" aria-pressed="false">Aurora</button>
                <button type="button" data-syntax-palette-choice="solar" aria-pressed="false">Solar</button>
                <button type="button" data-syntax-palette-choice="ocean" aria-pressed="false">Ocean</button>
                <button type="button" data-syntax-palette-choice="mono" aria-pressed="false">Mono</button>
            </div>
        </div>

        <div class="theme-switcher__section theme-switcher__section--toggles">
            <div><p>Semantic colors</p><div class="theme-switcher__modes" role="group" aria-label="Semantic highlighting"><button type="button" data-semantic-choice="on" aria-pressed="true"><span aria-hidden="true">🧠</span> On</button><button type="button" data-semantic-choice="off" aria-pressed="false">Off</button></div></div>
            <div><p>Ligatures</p><div class="theme-switcher__modes" role="group" aria-label="Programming ligatures"><button type="button" data-ligature-choice="on" aria-pressed="false"><span aria-hidden="true">=&gt;</span> On</button><button type="button" data-ligature-choice="off" aria-pressed="true">Off</button></div></div>
        </div>

        <div class="theme-switcher__section">
            <p>Reading palette</p>
            <div class="theme-switcher__choices" role="list" aria-label="Reader themes">
                <button type="button" data-theme-choice="paper" aria-pressed="true"><span class="theme-swatch theme-swatch--paper" aria-hidden="true"></span><span><strong>Paper</strong><small>Warm field notes</small></span></button>
                <button type="button" data-theme-choice="purple" aria-pressed="false"><span class="theme-swatch theme-swatch--purple" aria-hidden="true"></span><span><strong>Purple</strong><small>Original dark Academy</small></span></button>
                <button type="button" data-theme-choice="midnight" aria-pressed="false"><span class="theme-swatch theme-swatch--midnight" aria-hidden="true"></span><span><strong>Midnight</strong><small>Blue terminal glow</small></span></button>
                <button type="button" data-theme-choice="forest" aria-pressed="false"><span class="theme-swatch theme-swatch--forest" aria-hidden="true"></span><span><strong>Forest</strong><small>Low-glare green</small></span></button>
                <button type="button" data-theme-choice="contrast" aria-pressed="false"><span class="theme-swatch theme-swatch--contrast" aria-hidden="true"></span><span><strong>Contrast</strong><small>Black, white, yellow</small></span></button>
            </div>
        </div>

        <button class="theme-switcher__reset" type="button" data-theme-reset>Reset appearance</button>
        <small class="theme-switcher__shortcut">Alt + T palette · Alt + D page · Alt + C code · Alt + S syntax</small>
    </div>
</div>
