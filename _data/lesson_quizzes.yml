"1.1":
  id: "source-grounded-question"
  title: "Study without inventing"
  prompt: "You meet an unfamiliar claim about a game structure. What should you do before trying to answer a study question about it?"
  options: "Look up the relevant source, hide it, then explain the supported meaning from memory||Guess from the field name and sound confident||Copy the source while reading it without testing recall||Ask an AI without supplying the source or target version"
  answer: "0"
  explanation: "Source-grounded recall begins with evidence. After reading the relevant part, hide it and reconstruct the meaning; then compare and correct the answer immediately."

"1.7":
  id: "safe-lab-snapshot"
  title: "Protect the experiment"
  prompt: "Why take a virtual-machine snapshot before a memory or debugger lab?"
  options: "It creates a known recovery point after mistakes or crashes||It makes every address stay fixed||It gives the guest unlimited permissions||It prevents the game from changing state"
  answer: "0"
  explanation: "A snapshot captures a controlled machine state that can be restored. It does not freeze future addresses or remove normal operating-system protections."

"1.8":
  id: "first-scan-filter"
  title: "Use a controlled change"
  prompt: "A first scan finds many addresses containing 100. The visible gold changes to 75. Which addresses should the next scan inspect?"
  options: "Only the first scan's candidates, keeping those that now contain 75||Every address in the process again||Only executable memory||Only the lowest address from the first scan"
  answer: "0"
  explanation: "A value scan is an iterative filtering algorithm. Each controlled observation narrows the existing candidate set instead of forgetting the earlier evidence."

"1.5":
  id: "abstraction-boundary"
  title: "Control complexity"
  prompt: "What is the main benefit of placing raw memory reads behind a small `ProcessReader` interface?"
  options: "It separates operating-system details from higher-level algorithms||It makes remote memory type-safe automatically||It disables address-space randomization||It guarantees every read succeeds"
  answer: "0"
  explanation: "An abstraction gives one boundary for permissions, errors, and validation. Scanners and game-specific logic can then work with a smaller, clearer contract."

"2.1":
  id: "debugger-breakpoint-purpose"
  title: "Explain the pause"
  prompt: "What useful fact does a breakpoint provide during a controlled game experiment?"
  options: "Which instruction was about to execute when the chosen condition occurred||The permanent address of every object||The original source-code variable name||Proof that the paused instruction caused every related behavior"
  answer: "0"
  explanation: "A breakpoint gives a precise observation point. Repeating the same controlled action builds evidence connecting that instruction to the behavior."

"2.4":
  id: "data-breakpoint-scope"
  title: "Watch the data, not one function"
  prompt: "Why use a hardware write breakpoint on the gold address?"
  options: "It can reveal any instruction that writes the watched bytes||It permanently patches the subtraction instruction||It converts the gold value into a pointer||It pauses only when a specific function is called"
  answer: "0"
  explanation: "A data breakpoint watches an address range. Different code paths can trigger it, which makes it useful when you know the changing data before you know the responsible instruction."

"2.5":
  id: "call-stack-causality"
  title: "Climb toward the cause"
  prompt: "How does the call stack help trace a low-level gold write back toward a menu action?"
  options: "Return addresses show the chain of callers that led to the current function||It stores every gold value used since launch||It contains the source code for each function||It records all CPU instructions permanently"
  answer: "0"
  explanation: "Stack frames and return addresses describe active function calls. Walking upward moves from the immediate write toward the higher-level decision that requested it."

"2.7":
  id: "detour-return-boundary"
  title: "Return safely"
  prompt: "After a temporary detour runs, where should execution normally return?"
  options: "The first whole instruction after the bytes displaced by the detour||The middle of the overwritten instruction||The executable's file header||The beginning of the current stack frame"
  answer: "0"
  explanation: "Variable-length x86 instructions must be decoded as complete units. Returning into the middle changes how the remaining bytes are interpreted."

"2.9":
  id: "pointer-path-proof"
  title: "Prove stability"
  prompt: "What is the strongest evidence that a pointer path is useful?"
  options: "The module-relative root and dereference steps resolve the intended object across several clean restarts||The final address is numerically small||The chain worked once without notes||Every link uses the same offset"
  answer: "0"
  explanation: "Restart testing separates a reusable path from one lucky allocation. Record the module base, offsets, dereferences, and target build for every trial."

"3.3":
  id: "object-layout-evidence"
  title: "Separate an address from an offset"
  prompt: "A player object begins at `0x12340000`, and a method reads yaw from `[ecx+0x40]` while `ecx` holds that object. Which address contains yaw?"
  options: "`0x12340040`||`0x00000040`||`0x123399C0`||The vtable's first function address"
  answer: "0"
  explanation: "The object base is the starting address and `0x40` is the byte distance to the member, so the field address is `0x12340000 + 0x40 = 0x12340040`."

"8.1":
  id: "dllmain-loader-lock"
  title: "Respect loader lock"
  prompt: "Why should `DllMain` do as little work as possible?"
  options: "Windows calls it while loader bookkeeping is locked, so complex work can deadlock||DLL code cannot create functions||The CPU has no stack during process attach||Rust code cannot run inside a DLL"
  answer: "0"
  explanation: "Loader notifications run under strict constraints. A small entry point should record state or start a carefully designed next stage, leaving normal work outside loader lock."

"8.3":
  id: "reversible-patch-transaction"
  title: "Treat a patch as a transaction"
  prompt: "Which sequence makes an in-process detour responsibly reversible?"
  options: "Verify expected bytes, save originals, write the complete patch, then restore those originals on shutdown||Write first and inspect later||Patch every matching address||Restore with zero bytes"
  answer: "0"
  explanation: "A patch temporarily replaces program state. Verification prevents wrong-build edits, saved bytes enable exact restoration, and whole-instruction boundaries preserve decoding."

"3.7":
  id: "text-encoding-boundary"
  title: "Interpret text bytes"
  prompt: "Why is finding readable text in memory not enough to identify a complete string?"
  options: "You must also know its encoding, length rule or terminator, and lifetime||All text is encrypted in memory||Every character occupies four bytes||Strings never move after allocation"
  answer: "0"
  explanation: "Bytes become text only under an encoding and boundary rule. FFI code must also respect whether the memory remains valid while another API reads it."

"4.3":
  id: "fog-grid-index"
  title: "Locate one tile"
  prompt: "A row-major visibility map is `width` tiles wide. Which formula finds tile `(x, y)` in a flat array?"
  options: "y × width + x||x × height + y||width ÷ y + x||x + y"
  answer: "0"
  explanation: "Each completed row contributes `width` elements. Adding `x` then selects the column within row `y`."

"4.4":
  id: "macro-state-machine"
  title: "Make automation explainable"
  prompt: "Why model an offline macro as named states and guarded transitions?"
  options: "The current action, allowed next actions, and stop behavior become explicit and testable||It makes input timing unnecessary||It guarantees the game accepts every action||It removes the need to observe game state"
  answer: "0"
  explanation: "A finite-state machine turns an implicit loop into inspectable rules. That makes timeouts, cancellation, and unexpected observations easier to handle safely."

"4.5":
  id: "bot-snapshot-separation"
  title: "Separate observation from decision"
  prompt: "Why should a coordinate bot first copy game data into a validated snapshot?"
  options: "Decision logic can work on one bounded, internally consistent model||The snapshot becomes a live pointer into the game||Copying makes coordinates permanent||The bot no longer needs stop conditions"
  answer: "0"
  explanation: "Remote state can change during a read. A validated snapshot gives movement code a clear input and keeps memory-access failures out of steering logic."

"5.2":
  id: "render-flag-branch"
  title: "Trace a graphics decision"
  prompt: "A render flag is most useful when you can connect it to what?"
  options: "A conditional branch whose two paths produce different drawing behavior||A random writable address||The largest OpenGL parameter||A file that never loads"
  answer: "0"
  explanation: "The flag is data; the branch supplies behavior. Repeatedly toggling one known setting helps prove which code reads it and how rendering changes."

"5.3":
  id: "draw-wrapper-contract"
  title: "Preserve the call contract"
  prompt: "What must an observational wrapper around an OpenGL draw call do after recording bounded metadata?"
  options: "Forward the call with the original calling convention, parameters, and required state||Replace every texture||Skip the real draw||Keep graphics state changed permanently"
  answer: "0"
  explanation: "A transparent observer preserves the function contract. Otherwise the measurement changes the scene and can no longer be trusted."

"5.4":
  id: "render-category-experiment"
  title: "Design a visual experiment"
  prompt: "Why temporarily color one suspected render category at a time?"
  options: "One controlled change links a recorded call pattern to a visible model group||Different colors reveal source variable names||Color disables depth testing automatically||The GPU stores permanent category labels"
  answer: "0"
  explanation: "Classification requires evidence. A reversible one-variable experiment makes the visible effect attributable to the selected predicate."

"5.5":
  id: "crosshair-result-lifetime"
  title: "Validate the target result"
  prompt: "Before acting on the game's target-under-crosshair result, what should a tool check?"
  options: "That the identifier is valid for the current frame and still refers to an allowed target||That it has the highest address||That it never changes||That the renderer is paused"
  answer: "0"
  explanation: "Selection results are time-sensitive game state. Validate identity, lifetime, and local rules immediately before using them."

"5.7":
  id: "recoil-as-data"
  title: "Model camera motion"
  prompt: "Why record recoil as a time series instead of one final camera angle?"
  options: "The samples reveal the impulse, recovery, timing, and damping behavior||One final angle contains every intermediate state||Time series remove floating-point error||The camera never updates between frames"
  answer: "0"
  explanation: "Recoil is a dynamic system. Sampling over time exposes how the game adds an impulse and gradually returns the camera."

"5.8":
  id: "radar-filter-predicate"
  title: "Recover the filtering rule"
  prompt: "What is the best way to infer why one entity appears on radar and another does not?"
  options: "Compare entities that differ in one relevant property and trace the branch using that property||Patch every conditional jump||Assume distance is always the only rule||Read only the final screen pixels"
  answer: "0"
  explanation: "Controlled comparisons reveal a predicate. Team, visibility, alive state, range, and update timing are candidate inputs that should be tested separately."

"8.8":
  id: "shared-frame-snapshot"
  title: "Unify feature inputs"
  prompt: "Why should several diagnostic features consume one shared frame snapshot?"
  options: "They make decisions from the same moment and avoid duplicate remote reads||They all receive mutable game pointers||It removes every synchronization problem||It makes rendering independent of coordinates"
  answer: "0"
  explanation: "A shared immutable snapshot improves consistency, bounds memory traffic, and gives all features the same validated view of the frame."

"6.2":
  id: "protocol-controlled-capture"
  title: "Find message structure"
  prompt: "Which capture method best reveals how one local game action is encoded?"
  options: "Record a quiet baseline, perform exactly one action, then compare the changed bytes and timing||Capture hours of unrelated traffic||Assume each TCP read is one message||Edit packets before understanding them"
  answer: "0"
  explanation: "A controlled capture reduces noise and supports cause-and-effect reasoning. TCP still requires you to infer framing because reads do not preserve application messages."

"6.5":
  id: "chat-bot-parser-boundary"
  title: "Treat protocol input as untrusted"
  prompt: "What should a local chat bot do before acting on a decoded command?"
  options: "Validate framing, size, syntax, and the small set of allowed commands||Execute the message as a shell command||Trust any declared payload length||Keep references into a receive buffer forever"
  answer: "0"
  explanation: "Network data is untrusted even in a lab. Bounded parsing and an explicit command enum keep data from turning into unintended behavior."

"6.6":
  id: "proxy-transparency"
  title: "Preserve both byte streams"
  prompt: "What makes a local TCP relay transparent?"
  options: "It forwards bytes in both directions, handles partial I/O and half-closes, and does not silently rewrite data||It calls `recv` only once||It converts TCP into UDP||It assumes both peers close simultaneously"
  answer: "0"
  explanation: "TCP is a bidirectional stream. Correct relays loop over partial reads/writes and propagate shutdown without inventing message boundaries."

"8.2":
  id: "injector-aslr-resolution"
  title: "Account for separate address spaces"
  prompt: "Why should an injector avoid assuming that one local function pointer is valid in the target process?"
  options: "ASLR and architecture differences can give modules different live addresses||Function pointers are text strings||Every process shares one address space||Windows removes module exports after startup"
  answer: "0"
  explanation: "Processes have separate virtual address spaces. Resolve the target module and export using assumptions proven for that architecture and build."

"7.6":
  id: "disassembler-instruction-length"
  title: "Advance by decoded length"
  prompt: "Why must a disassembler advance by the decoder's reported instruction length?"
  options: "x86 instructions use variable numbers of bytes||Every opcode is followed by text||Instructions always align to 16 bytes||The PE header stores one global instruction size"
  answer: "0"
  explanation: "Prefixes, opcodes, ModR/M, SIB, displacements, and immediates make x86 instructions variable-length. One wrong boundary corrupts every later decode."

"7.8":
  id: "call-logger-bounded-buffer"
  title: "Keep observation bounded"
  prompt: "Why should a call logger use a fixed-size or capped buffer?"
  options: "A hot call site could otherwise consume memory and disturb the program being measured||A cap makes every call unique||Buffers prevent threads from running||Logging requires executable memory"
  answer: "0"
  explanation: "Instrumentation must control its own cost. Bounded storage, sampling, and dropped-event counters make overhead visible and predictable."

"7.2":
  id: "rva-live-address"
  title: "Relocate the symbol"
  prompt: "A symbol has RVA `0x2500` and the module loaded at `0x7FF600000000`. How is its live address found?"
  options: "Add the RVA to the live module base||Subtract the base from the RVA||Use the file offset as an absolute pointer||Multiply the two numbers"
  answer: "0"
  explanation: "An RVA is a distance from the image base. ASLR changes the live base, while the RVA remains tied to that exact module build."

"8.4":
  id: "iat-hook-restoration"
  title: "Understand the import slot"
  prompt: "What does an Import Address Table slot normally contain after the loader finishes?"
  options: "The resolved address of an imported function||The DLL's entire machine code||A source-code function name only||The process security token"
  answer: "0"
  explanation: "Call sites can load the resolved pointer from the IAT. A reversible lab hook saves that exact pointer, replaces one owned slot, and restores it afterward."

"11.5":
  id: "kernel-boundary-impact"
  title: "Respect privilege boundaries"
  prompt: "Why do ordinary game-analysis labs stay in user mode?"
  options: "A user-mode mistake is contained more narrowly than a privileged driver failure||User mode has no access controls||Kernel code cannot inspect memory||Drivers automatically make experiments reproducible"
  answer: "0"
  explanation: "Kernel code shares system-wide privilege and failure impact. User mode provides a safer boundary for learning, testing, and recovery."

"4.2":
  id: "snapshot-evidence-authority"
  title: "Promote observations carefully"
  prompt: "When should a captured remote address gain authority to become a write destination?"
  options: "Only after the target profile, full object path, current value, and fresh precondition still agree||As soon as the address is nonzero||Whenever the same number appears elsewhere in memory||After the tool requests full process access"
  answer: "0"
  explanation: "An address is run-specific evidence, not permanent identity. A guarded action revalidates the target and object immediately before the narrow write, then checks the postcondition."

"8.5":
  id: "parallel-scanner-determinism"
  title: "Separate scheduling from results"
  prompt: "Why sort addresses after parallel scanner workers finish?"
  options: "Worker completion order is nondeterministic, while stable result order improves tests and review||Sorting makes an ambiguous pattern unique||Windows requires addresses in ascending order||Sorting changes remote pages to read-only"
  answer: "0"
  explanation: "Concurrency may change which worker reports first even when the bytes are identical. Sorting restores deterministic presentation; it does not repair weak evidence or alter the target."

"4.8":
  id: "telemetry-event-ownership"
  title: "Move only owned facts"
  prompt: "What should a debugger copy into an asynchronous telemetry event?"
  options: "Small validated values such as timestamps, thread IDs, and module-relative addresses||A borrowed pointer into the current DEBUG_EVENT union||The live process handle for the writer to close||An unlimited copy of arbitrary stack memory"
  answer: "0"
  explanation: "The event-handling scope owns temporary Windows data and must continue promptly. Compact owned facts can safely outlive that scope and be formatted by another thread."

"9.1":
  id: "disk-versus-memory"
  title: "Choose the simpler data source"
  prompt: "When is a game file a better analysis target than live process memory?"
  options: "When the needed state already has a documented or discoverable on-disk representation||When the file changes every CPU instruction||When only registers contain the data||When the game has no storage format"
  answer: "0"
  explanation: "Files are stable snapshots that can be copied, diffed, parsed, versioned, and restored. Prefer them when they answer the same question with less moving state."

"9.2":
  id: "atomic-save-replacement"
  title: "Avoid a half-written save"
  prompt: "Which update strategy best protects a save file if the program crashes during writing?"
  options: "Write and validate a temporary file, then atomically replace the destination||Overwrite random fields in place||Delete the original before parsing||Write without checking lengths"
  answer: "0"
  explanation: "A temporary file keeps the original intact until a complete replacement is ready. Backups and post-write validation add further recovery points."

"9.3":
  id: "texture-format-contract"
  title: "Preserve the asset contract"
  prompt: "Why can a visually correct replacement texture still fail to load?"
  options: "Its dimensions, pixel format, compression, mipmaps, or path may violate the engine's expected contract||Images cannot be replaced in open-source games||Texture files contain live pointers||The GPU accepts only one color"
  answer: "0"
  explanation: "Asset loaders depend on structure as well as appearance. Match the original metadata and change one property at a time."

"9.4":
  id: "data-driven-mod-schema"
  title: "Validate structured game data"
  prompt: "What should a small unit-definition linter check before the game loads the mod?"
  options: "Required fields, types, ranges, identifiers, and referenced assets||The current process address of every unit||Only the file's color||Whether all numbers are identical"
  answer: "0"
  explanation: "A schema turns implicit engine expectations into explicit checks. It catches malformed data before a vague runtime failure."

"10.1":
  id: "process-versus-program"
  title: "Separate file from execution"
  prompt: "Which item exists only after Windows creates a running process?"
  options: "A virtual address space with threads, handles, stacks, and mapped modules||The executable's bytes on disk||The PE section table in the file||The filename extension"
  answer: "0"
  explanation: "A program file is input to process creation. Windows maps it, resolves imports, creates execution state, and adds private memory not present on disk."

"10.3":
  id: "least-privilege-handle"
  title: "Request the smallest capability"
  prompt: "A tool only needs to list a process's mapped regions. What access principle should guide `OpenProcess`?"
  options: "Request only the query rights required for that operation||Request full access in case it is useful later||Request write and remote-thread rights||Disable the target's DACL"
  answer: "0"
  explanation: "Least privilege narrows accidental capability, documents intent, and makes failures easier to reason about."

"7.9":
  id: "etw-event-correlation"
  title: "Correlate events over time"
  prompt: "What makes ETW useful for investigating a short game-performance problem?"
  options: "Timestamped events from system and application providers can be correlated on one timeline||It permanently pauses every thread||It reveals all source code||It rewrites slow functions automatically"
  answer: "0"
  explanation: "ETW records structured events with timing and provider identity. A short controlled trace helps connect CPU, file, process, and scheduling activity."

"10.2":
  id: "build-hash-identity"
  title: "Tie notes to exact bytes"
  prompt: "Why record executable hashes beside RVAs and byte patterns?"
  options: "The notes can refuse to apply when the target build's bytes differ||A hash makes ASLR stop||Hashes reveal every function name||The digest grants process permissions"
  answer: "0"
  explanation: "Offsets and signatures are build-dependent evidence. A cryptographic digest identifies the exact file those observations came from."

"10.8":
  id: "minidump-snapshot"
  title: "Interpret a crash dump"
  prompt: "What is a minidump?"
  options: "A selected snapshot of process state captured at one moment||A live connection to a running process||A complete copy of every disk sector||A debugger breakpoint stored in hardware"
  answer: "0"
  explanation: "Dump contents depend on capture flags. Threads, modules, contexts, and chosen memory ranges describe the captured instant, not future execution."

"10.4":
  id: "handle-single-owner"
  title: "Prevent resource leaks"
  prompt: "What invariant should a safe wrapper maintain for an owned Windows handle?"
  options: "Exactly one owner closes a valid handle exactly once||Every function closes the handle it receives||The numeric handle value never changes||Handles remain open until Windows shuts down"
  answer: "0"
  explanation: "Single ownership prevents both leaks and double-close bugs. Borrowed handles need a different type because they do not own cleanup."

"10.6":
  id: "thread-context-meaning"
  title: "Read execution state"
  prompt: "What does a captured thread context describe?"
  options: "Register state including the current instruction and stack locations||Every instruction the thread will execute||The full contents of every process||Only the thread's name"
  answer: "0"
  explanation: "A context is one instant of CPU-visible thread state. Combining it with stack memory and module symbols helps reconstruct active calls."

"11.2":
  id: "loader-lock-deadlock"
  title: "Avoid startup deadlocks"
  prompt: "Why is loading another DLL or waiting for worker synchronization dangerous inside `DllMain`?"
  options: "The loader may already hold locks that the nested operation or worker needs||DLLs have no access to synchronization objects||Threads cannot exist in a process with a DLL||The PE format forbids function calls during startup"
  answer: "0"
  explanation: "Waiting or re-entering loader work while loader lock is held can create a circular dependency. Keep notifications minimal and initialize later."

"11.1":
  id: "dll-inventory-baseline"
  title: "Explain a changed module list"
  prompt: "A new DLL appears in a game's module inventory. What should you check first?"
  options: "Its full path, hash, signer or source, load timing, and whether the baseline expected it||Delete it immediately||Assume its short filename proves identity||Patch its entry point"
  answer: "0"
  explanation: "A module name alone is weak evidence. Provenance, exact bytes, path, and reproducible baseline differences support a defensible conclusion."

"10.7":
  id: "api-stack-boundary"
  title: "Follow the abstraction layers"
  prompt: "What happens conceptually when a user-mode API needs the Windows kernel to perform privileged work?"
  options: "A controlled system-call transition enters a kernel service, then returns a result to user mode||The caller becomes a permanent kernel thread||The process maps all kernel memory||The API edits the executable on disk"
  answer: "0"
  explanation: "Win32 and native API layers prepare arguments before a processor-supported privilege transition reaches a kernel service. The boundary is controlled, not a shared address space."

"7.3":
  id: "export-rva-mapping"
  title: "Map an exported function"
  prompt: "When parsing a DLL on disk, why can an export RVA not always be used as a file offset?"
  options: "RVA describes the loaded image, so the containing section's virtual and raw ranges must be mapped||RVA values are encrypted||Exports exist only in RAM||Every section begins at file offset zero"
  answer: "0"
  explanation: "PE sections can have different raw-file and virtual positions. Bounded section mapping converts an RVA into the correct file location."

"6.7":
  id: "shared-memory-synchronization"
  title: "Coordinate shared state"
  prompt: "Why does shared memory still need a synchronization or publication rule?"
  options: "Two processes can otherwise observe partially updated length and payload fields||Mapped bytes are automatically immutable||Both processes always map the view at one address||A file mapping preserves message boundaries"
  answer: "0"
  explanation: "Shared storage does not make a multi-field update atomic. A mutex, event, sequence counter, or carefully designed atomic protocol defines when data is complete."

"9.7":
  id: "hash-versus-signature"
  title: "Ask the right trust question"
  prompt: "What can an Authenticode signature tell you that a standalone SHA-256 hash cannot?"
  options: "Whether the bytes match a publisher signature evaluated under a Windows trust policy||Whether the program contains no vulnerabilities||Whether the file will never change||Whether every antivirus engine approves it"
  answer: "0"
  explanation: "A hash identifies exact bytes. Authenticode additionally connects a digest to signing identity and certificate policy, without proving the software is bug-free."

"3.8":
  id: "dll-function-contract"
  title: "Prove the ABI before calling"
  prompt: "Which evidence is most important before converting a `GetProcAddress` result into a Rust function pointer?"
  options: "Argument locations, calling convention, return use, ownership, and behavior at several call sites||The export name's letter count||The DLL icon||Whether the address is numerically large"
  answer: "0"
  explanation: "A raw export address has no Rust type. The conversion is sound only when machine evidence and documentation establish the complete call contract."

"4.6":
  id: "bfs-shortest-route"
  title: "Choose a search rule"
  prompt: "Why does breadth-first search find a shortest route on a grid where every legal move has equal cost?"
  options: "It explores nodes in increasing number of steps from the start||It always moves toward the goal coordinates||It reads every tile at once||It ignores walls"
  answer: "0"
  explanation: "A FIFO frontier visits every distance-one node before distance-two nodes, so the first reached goal uses the fewest equal-cost edges."

"4.7":
  id: "event-from-snapshots"
  title: "React once"
  prompt: "Why diff two accepted snapshots before sending them to a bot state machine?"
  options: "The diff turns repeated polled values into meaningful one-time change events||It makes remote memory permanent||It removes the need for timeouts||It presses input automatically"
  answer: "0"
  explanation: "A snapshot states what is true now; a diff identifies what changed, preventing one transition from firing on every poll."

"6.4":
  id: "protocol-state-legality"
  title: "Validate order as well as bytes"
  prompt: "A chat frame parses correctly but arrives before the protocol greeting. What should the session parser do?"
  options: "Reject an illegal state transition||Accept it because the bytes are valid||Execute the text||Reset the frame length to zero"
  answer: "0"
  explanation: "Framing and field parsing prove message shape. A protocol state machine separately decides whether that message is legal at this point in the conversation."

"9.5":
  id: "archive-enclosed-path"
  title: "Keep extraction contained"
  prompt: "What must be true of every archive entry before a mod installer writes it?"
  options: "Its validated relative path remains beneath the chosen staging root||Its name contains a file extension||It uses forward slashes||It replaces an existing game file"
  answer: "0"
  explanation: "Absolute paths and parent traversal can escape the destination. Enclosed relative paths plus size and file-type policies keep extraction bounded."

"9.6":
  id: "mod-uninstall-hash"
  title: "Preserve later work"
  prompt: "Why should an uninstaller compare the current file with the mod's recorded installed hash?"
  options: "If someone changed it later, blindly deleting or restoring would erase their newer work||A hash grants delete permission||The comparison makes backups unnecessary||Hashes preserve directory order"
  answer: "0"
  explanation: "The installed digest is an optimistic concurrency check. A mismatch means the file no longer belongs solely to the recorded mod transaction."

"11.3":
  id: "optional-api-fallback"
  title: "Treat absence as a state"
  prompt: "What should a runtime API resolver do when an optional export is not present?"
  options: "Return `None` and use the documented lower-capability fallback||Call address zero||Guess a similarly named export||Patch the system DLL"
  answer: "0"
  explanation: "Optional lookup needs an explicit missing case. A known fallback preserves compatibility without inventing a function contract."

"12.1":
  id: "lua-host-boundary"
  title: "Find the authority"
  prompt: "In an embedded Lua design, who decides which game operations a script can request?"
  options: "The compiled host that constructs the script API||The Lua file extension||The first global variable||The operating system's current theme"
  answer: "0"
  explanation: "The host owns the interpreter and chooses which functions and values enter the environment, making that API the capability boundary."

"12.2":
  id: "lua-sequence-index"
  title: "Translate the index"
  prompt: "Rust vector element `0` becomes which conventional Lua sequence key?"
  options: "1||0||-1||nil"
  answer: "0"
  explanation: "Rust collections are zero-indexed while Lua sequences conventionally start at one, so the host adds one during conversion."

"12.3":
  id: "lua-library-capabilities"
  title: "Load only what is needed"
  prompt: "Why does the Rust host load table, string, and math libraries but omit Lua's I/O, OS, debug, and package libraries?"
  options: "The lesson scripts receive a smaller, documented capability set||Lua requires exactly three libraries||The omitted libraries are not part of Lua||It makes scripts compile as Rust"
  answer: "0"
  explanation: "Library selection does not create a complete sandbox, but it avoids granting unrelated filesystem, process, debugging, or module-loading capabilities."

"12.4":
  id: "snapshot-not-pointer"
  title: "Keep pointers in Rust"
  prompt: "Why should a Lua observer receive copied entity snapshots rather than target-process addresses?"
  options: "Rust can own layout validation and scripts cannot keep or misuse stale remote pointers||Lua cannot store integers||Snapshots never change||Pointers work only on networks"
  answer: "0"
  explanation: "A domain snapshot keeps architecture, permissions, bounds, and lifetimes inside the typed host while giving scripts the meaning they need."

"12.5":
  id: "lua-action-confirmation"
  title: "Wait for evidence"
  prompt: "After a Lua bot requests one action, why should it enter a wait state?"
  options: "It should observe confirmation or timeout before requesting the action again||Lua can execute only one function||The snapshot becomes writable||Waiting changes the calling convention"
  answer: "0"
  explanation: "A pending state prevents duplicate input and makes success, failure, cancellation, and timeout explicit."

"12.6":
  id: "lua-budget-layers"
  title: "Limit different resources"
  prompt: "Why is an instruction budget not a complete Lua sandbox?"
  options: "Memory, wall time, Rust callbacks, host capabilities, and action rates need separate controls||Lua instructions never run||The hook grants file access||A budget disables all errors"
  answer: "0"
  explanation: "Instruction hooks address runaway bytecode. A robust host layers limited libraries, bounded callbacks, memory and time limits, validation, and cancellation."

"12.7":
  id: "lua-vm-instruction-pointer"
  title: "Follow the virtual machine"
  prompt: "What does the tiny Lua VM's instruction pointer identify?"
  options: "The next bytecode instruction||The next x86 instruction in Windows||The first table key||The amount of heap memory"
  answer: "0"
  explanation: "The processor has a native instruction pointer, while an interpreter keeps a separate index into its bytecode program."

"12.8":
  id: "lua-gc-cycle"
  title: "Find the lifetime problem"
  prompt: "Why can plain strong reference counting leak two Lua tables that point to each other?"
  options: "Each table keeps the other's strong count above zero after outside references disappear||Tables cannot contain other tables||Reference counts work only for strings||Lua never frees values"
  answer: "0"
  explanation: "A cycle can keep its own strong counts alive. A tracing collector or another cycle strategy is needed for a general interpreter."

"12.9":
  id: "lua-close-upvalue"
  title: "Let a local escape"
  prompt: "What must happen to an upvalue that still refers to a local when the local's call frame returns?"
  options: "Move it into storage that remains owned by the closure||Turn it into a raw stack pointer||Delete every closure||Convert it to a global string"
  answer: "0"
  explanation: "Closing the upvalue preserves the captured value after its original stack slot stops belonging to an active frame."

"3.4":
  id: "oop-pattern-evidence"
  title: "Separate clue from conclusion"
  prompt: "Which observation most strongly supports a suspected C++ vptr?"
  options: "The object starts with a pointer to a read-only table whose entries lead to executable methods||The object's first byte is nonzero||The object is on the heap||A nearby string contains the word player"
  answer: "0"
  explanation: "A pointer chain from object to read-only function table to executable methods matches common virtual-dispatch behavior. It is evidence, not the original class name."

"3.5":
  id: "handle-generation-purpose"
  title: "Reject a stale identity"
  prompt: "What does the generation part of an index-plus-generation handle prove?"
  options: "The slot still represents the same logical object generation||The object has a permanent address||The container is encrypted||The handle owns the process"
  answer: "0"
  explanation: "A reused slot increments its generation, so an older handle cannot silently resolve to a different object."

"3.6":
  id: "obfuscation-inverse-test"
  title: "Test the transformation"
  prompt: "What property should a reversible toy value transform satisfy over many inputs?"
  options: "decode(encode(value, key), key) equals value||The encoded value always equals zero||The key is stored beside every value||One sample happens to decode plausibly"
  answer: "0"
  explanation: "A round-trip property checks that the proposed inverse really undoes the complete transform rather than fitting one coincidence."

"9.8":
  id: "aead-associated-data"
  title: "Protect the context"
  prompt: "What does AEAD associated data provide?"
  options: "Authentication for readable context such as slot and format identifiers||Encryption without a key||Automatic key storage||Compression of ciphertext"
  answer: "0"
  explanation: "Associated data remains visible but is covered by authentication, so changing the context makes decryption fail."

"11.6":
  id: "dma-address-map"
  title: "Choose the right map"
  prompt: "Why is a process virtual pointer not automatically an offset in a physical RAM capture?"
  options: "Page tables translate each address space's virtual pages to physical locations||DMA captures contain only source code||Virtual addresses are always 32-bit||Physical RAM has no addresses"
  answer: "0"
  explanation: "The capture is organized by physical address. The matching CR3 and page tables connect a process's virtual address to that physical location."

"11.7":
  id: "dma-page-crossing"
  title: "Read across a boundary"
  prompt: "Why must a virtual-memory reader translate again after crossing a page boundary?"
  options: "The next virtual page may map to a completely different physical page||Every page uses another CPU architecture||The CR3 changes after each byte||Page boundaries end the capture file"
  answer: "0"
  explanation: "Virtual adjacency does not guarantee physical adjacency. Each crossed page needs its own validated translation."

"11.8":
  id: "dma-evidence-validation"
  title: "Strengthen the evidence"
  prompt: "What makes an offline object interpretation stronger than one plausible health number?"
  options: "Independent invariants such as vtable regions, finite positions, bounded names, and valid container relationships all agree||The address is numerically large||The capture file has a short name||The hexdump uses colored text"
  answer: "0"
  explanation: "Several unrelated checks agreeing makes coincidence or a wrong address-space model much less likely."

"1.2":
  id: "game-frame-cycle"
  title: "Follow one frame"
  prompt: "What usually happens once per game frame?"
  options: "Collect input, update state, and render an image||Reinstall the operating system||Allocate all physical memory||Rewrite the executable file"
  answer: "0"
  explanation: "A game loop repeatedly gathers input, advances the model, and draws the current result."

"1.4":
  id: "data-needs-meaning"
  title: "Give bytes meaning"
  prompt: "What turns four raw bytes into a useful game value?"
  options: "A type and the code that uses the value||The monitor resolution||The filename alone||A permanent address"
  answer: "0"
  explanation: "Bytes have no field labels. Types, surrounding structure, and behavior supply their interpretation."

"1.6":
  id: "controlled-experiment"
  title: "Change one variable"
  prompt: "Why should a memory experiment change one game behavior at a time?"
  options: "The observed byte difference has a clearer possible cause||It freezes every process||It makes an address stable forever||It removes the need to repeat the test"
  answer: "0"
  explanation: "A controlled change narrows cause and effect; repetition then tests whether the relationship is real."

"1.3":
  id: "memory-hierarchy-reason"
  title: "Choose a storage layer"
  prompt: "Why does a computer use registers, caches, RAM, and storage instead of one kind of memory?"
  options: "The layers trade speed, size, cost, and persistence||Each program requires a different alphabet||Only disks can store integers||RAM has no addresses"
  answer: "0"
  explanation: "Fast storage is small and expensive, while larger persistent storage is slower, so systems combine several layers."

"2.2":
  id: "assembly-load-store"
  title: "Read the instruction"
  prompt: "In `mov eax, [rcx+8]`, what do the brackets mean?"
  options: "Read the value stored in memory at address rcx plus 8||Add eight CPU cores||Jump to another function||Store the text rcx"
  answer: "0"
  explanation: "Brackets indicate a memory operand. The CPU calculates the address, then loads the bytes found there."

"2.3":
  id: "breakpoint-purpose"
  title: "Pause for evidence"
  prompt: "What is the main purpose of a breakpoint in a reversing experiment?"
  options: "Pause one execution path so registers, memory, and the call stack can be inspected||Permanently change the game||Encrypt an instruction||Make a pointer valid"
  answer: "0"
  explanation: "A breakpoint creates a controlled observation moment without making the paused state permanent."

"2.6":
  id: "detour-return-boundary"
  title: "Return safely"
  prompt: "Where should a code-cave detour return after replaying displaced behavior?"
  options: "The first complete original instruction after the overwritten region||The middle of an overwritten instruction||Address zero||The process entry point"
  answer: "0"
  explanation: "Returning at a verified instruction boundary preserves the decoder's byte stream and original control flow."

"2.8":
  id: "aslr-rva"
  title: "Describe a moving address"
  prompt: "What location description normally survives ASLR for one exact module build?"
  options: "Current module base plus a build-specific RVA||One absolute address copied from yesterday||The window title||The process ID"
  answer: "0"
  explanation: "ASLR moves the base, while an RVA identifies a distance inside that same module build."

"3.1":
  id: "rust-unsafe-boundary"
  title: "Contain the assumption"
  prompt: "Why should raw-pointer and Win32 FFI work live in a small Rust boundary?"
  options: "The assumptions can be documented once and callers can use checked types||Unsafe code becomes automatically correct||Windows APIs stop returning errors||Pointers gain permanent lifetimes"
  answer: "0"
  explanation: "A narrow boundary makes validity rules reviewable and keeps most of the program in ordinary safe Rust."

"3.2":
  id: "external-tool-copy"
  title: "Respect the process boundary"
  prompt: "What should an external Rust observer do with a target-process field?"
  options: "Copy bounded bytes through the operating-system API into a local typed value||Create a local reference directly to the remote address||Assume every read is complete||Request write access for every observation"
  answer: "0"
  explanation: "Another process owns the address. A checked copy keeps that boundary and its failure modes explicit."

"4.1":
  id: "strategy-snapshot-model"
  title: "Observe before deciding"
  prompt: "Why should a strategy-game observer build one validated snapshot before running rules?"
  options: "The rules receive a coherent domain model instead of scattered changing reads||It makes the game server trust the tool||It removes map boundaries||Snapshots never become stale"
  answer: "0"
  explanation: "Collection and validation belong in one layer; strategy can then work with meaningful bounded data."

"5.1":
  id: "vector-direction"
  title: "Picture the vector"
  prompt: "What does target position minus observer position produce?"
  options: "A displacement pointing from observer to target||The target's process ID||A screen pixel automatically||The map file size"
  answer: "0"
  explanation: "Subtracting positions removes the shared origin and leaves direction plus distance between the points."

"5.6":
  id: "target-selection-score"
  title: "Choose a target deliberately"
  prompt: "Why use an explicit target score instead of selecting the first entity in memory?"
  options: "Distance, angle, visibility, team, and validity can be compared by documented rules||Memory order always matches screen order||The first address is the closest||A score changes server authority"
  answer: "0"
  explanation: "An explicit score makes selection predictable, testable, and independent of arbitrary container order."

"5.9":
  id: "projection-w-check"
  title: "Reject points behind the camera"
  prompt: "Why check clip-space w before the perspective divide?"
  options: "A zero or wrong-sign w can describe a point on or behind the camera plane||It selects the game process||It verifies a PE header||It converts degrees to radians"
  answer: "0"
  explanation: "Dividing blindly can create infinities or mirrored screen coordinates for points that should not be drawn."

"8.7":
  id: "menu-worker-boundary"
  title: "Keep painting separate from side effects"
  prompt: "Why should an egui menu send an owned Settings command instead of writing game memory directly during every UI frame?"
  options: "Repainting stays side-effect free and one worker owns validated handles and cleanup||egui cannot display booleans||Channels make every pointer permanent||A worker disables Windows access checks"
  answer: "0"
  explanation: "Immediate-mode UI runs repeatedly. Sending deliberate snapshots prevents repeated writes and keeps low-level ownership in one reviewable worker."

"6.1":
  id: "server-authority"
  title: "Find the official state"
  prompt: "In a typical multiplayer design, why can a client-side visual value disagree with the final result?"
  options: "The server usually owns the authoritative shared state||Network packets contain no values||The GPU decides game rules||Every client shares one address space"
  answer: "0"
  explanation: "Clients predict and render, while the authoritative server validates and resolves shared outcomes."

"6.3":
  id: "parse-validate-rebuild"
  title: "Preserve message structure"
  prompt: "What should a safe message rewriter do before changing one field?"
  options: "Validate framing, lengths, message type, and field bounds||Treat the byte stream as a shell command||Assume one read equals one message||Discard unknown bytes silently"
  answer: "0"
  explanation: "Parsing proves where the field begins and ends; rebuilding must preserve every surrounding protocol rule."

"7.4":
  id: "pattern-wildcard-purpose"
  title: "Match stable bytes"
  prompt: "Why does a byte pattern use wildcards for some positions?"
  options: "Addresses or displacements may vary while surrounding opcode structure stays meaningful||Wildcards make every file match||The CPU ignores wildcard bytes||They disable ASLR"
  answer: "0"
  explanation: "A good signature anchors stable context and treats relocation-sensitive bytes as unknown."

"7.5":
  id: "memory-scan-refinement"
  title: "Narrow the candidates"
  prompt: "Why compare scan candidates after a controlled value change?"
  options: "Candidates that follow the expected transition are stronger than values that matched once||It writes every candidate||It finds source variable names||It makes heap addresses permanent"
  answer: "0"
  explanation: "Successive predicates turn one common value match into repeatable behavioral evidence."

"7.7":
  id: "debug-event-loop"
  title: "Continue every event"
  prompt: "What must a minimal Windows debugger do after processing a debug event?"
  options: "Continue it with an appropriate status and close event-owned handles when required||Leave the thread paused forever||Rewrite the executable||Convert the event to a network packet"
  answer: "0"
  explanation: "Debugging is a protocol with the operating system; every event needs correct handling, continuation, and cleanup."

"7.1":
  id: "pe-rva-file-offset"
  title: "Use the correct coordinate system"
  prompt: "Why is a PE RVA not always the same number as a file offset?"
  options: "Sections can have different virtual addresses and raw-file positions||RVA means process ID||Files have no headers||Windows stores all sections at zero"
  answer: "0"
  explanation: "The section table maps locations in the loaded image to locations in the on-disk file."

"10.5":
  id: "memory-map-regions"
  title: "Read the map before the bytes"
  prompt: "What does a virtual-memory region query tell an observer before it reads?"
  options: "Whether the range is committed and its current protection and type||The original source field name||The user's password||The target's next network message"
  answer: "0"
  explanation: "Region metadata lets the tool skip unmapped, guarded, or inappropriate pages and report why."

"11.4":
  id: "toy-evasion-invariant"
  title: "Repair the shared effect"
  prompt: "A read-only toy policy blocks WriteMemory but accepts ApplyPatch even though both change state. What is the strongest repair?"
  options: "Classify commands by effect and authorize the shared state-changing boundary||Add one more forbidden string||Hide ApplyPatch from the menu||Log only successful commands"
  answer: "0"
  explanation: "Names are inputs; the protected invariant belongs at the common effect. An exhaustive enum match and regression test keep new state-changing variants covered."

"6.8":
  id: "pipe-frame-boundary"
  title: "Separate pipe messages"
  prompt: "Why put an explicit length before a named-pipe payload?"
  options: "The receiver can collect exactly one bounded frame even when reads split or combine bytes||The length grants administrator rights||Pipes execute the payload||It replaces access control"
  answer: "0"
  explanation: "A byte stream does not preserve application message boundaries, so framing tells the parser how many bytes belong together."

"8.6":
  id: "windows-input-paths"
  title: "Choose the actual input path"
  prompt: "Which statement correctly distinguishes SendInput from SendMessageW?"
  options: "SendInput inserts system input events, while SendMessageW calls a window procedure and may be ignored by games using device input||SendMessageW always emulates a physical keyboard||SendInput targets exactly one HWND||Both functions change remote memory"
  answer: "0"
  explanation: "They use different Windows paths. A window message is not a stronger form of device input, and neither API guarantees that a particular game consumes it."

"13.1":
  id: "advanced-invariant-evidence"
  title: "Separate evidence from the invariant"
  prompt: "A write breakpoint shows one instruction storing a health-like value. What is the strongest conclusion supported by that observation alone?"
  options: "The instruction wrote the watched bytes during this run, but its semantic role and authority still need repeated evidence||The instruction permanently owns health in every build||The stored value must be authoritative server state||The instruction caused every later animation"
  answer: "0"
  explanation: "A breakpoint provides a precise observation, not a complete causal model. Controlled changes, state transitions, restarts, and competing hypotheses turn that observation into stronger evidence."

"13.2":
  id: "advanced-integrity-boundary"
  title: "Check what the effect consumes"
  prompt: "A checksum validates a display cache, but the guarded operation changes a separate simulation object. What is the central design failure?"
  options: "The check and effect use different sources of truth||The checksum is written in hexadecimal||The display cache is stored in RAM||The operation returns an enum"
  answer: "0"
  explanation: "Integrity evidence must describe the same identity and state consumed by the effect. A valid copy does not prove that a different canonical object is valid or fresh."

"13.3":
  id: "advanced-anti-debug-signal"
  title: "Interpret an environmental signal"
  prompt: "Why is one long timing sample weak evidence of debugger activity?"
  options: "Preemption, power management, virtualization, page faults, and load can create the same delay||Monotonic clocks never measure elapsed time||A debugger always makes execution faster||Timing samples contain no numbers"
  answer: "0"
  explanation: "A delay is a signal, not intent. A measured baseline, repeated samples, explicit state transitions, and independent game-state validation make the result interpretable."

"13.4":
  id: "advanced-obfuscation-inverse"
  title: "Invert the transform"
  prompt: "The encoder computes `(value ^ key).rotate_left(7)`. Which decoder restores the value?"
  options: "`encoded.rotate_right(7) ^ key`||`encoded.rotate_left(7) ^ key`||`encoded + key + 7`||`encoded ^ 7`"
  answer: "0"
  explanation: "Invert a composition in reverse order: undo the left rotation with a right rotation, then undo XOR by applying the same key again."

"13.5":
  id: "advanced-hook-draining"
  title: "Remove a hook without a lifetime race"
  prompt: "Why enter a Draining phase before restoring bytes and freeing a trampoline?"
  options: "It stops new callback work and lets active callbacks finish while their code and state are still alive||It makes every x86 instruction one byte long||It disables all process threads permanently||It removes the need to save original bytes"
  answer: "0"
  explanation: "Removal is a concurrency transition. Code and callback state must outlive every active user; otherwise a thread can return through memory that has already been released."

"13.6":
  id: "advanced-layout-cross-validation"
  title: "Accept a recovered field carefully"
  prompt: "Which evidence most strongly supports an offset as a health field in a new build?"
  options: "A damage path stores there, controlled health changes match, range relations hold, and the identity path is stable across restarts||The offset contains one small integer||The offset is close to the old build's offset||A memory viewer colors it green"
  answer: "0"
  explanation: "Independent static, dynamic, relational, and identity evidence cross-validates the field. One plausible number is only a candidate."

"13.7":
  id: "advanced-telemetry-contradiction"
  title: "Detect a control contradiction"
  prompt: "Which event pair directly contradicts a guarded-operation invariant?"
  options: "A denied decision followed by a changed effect with the same correlation ID||Two ordinary snapshots with different timestamps||An allowed decision followed by an unchanged optional effect||A queue reporting zero dropped events"
  answer: "0"
  explanation: "A shared correlation ID connects the refusal to the effect. If state changes anyway, the decision and effect boundary disagree."

"13.8":
  id: "advanced-bypass-boundary"
  title: "Repair the property, not the proxy"
  prompt: "A health command is accepted whenever an observer flag is absent, even when health exceeds its maximum. What is the strongest repair?"
  options: "Validate the health range at the command's effect boundary and record the environment signal separately||Add a second spelling for the observer flag||Hide the health field from the menu||Increase the timing threshold"
  answer: "0"
  explanation: "The environment signal is only diagnostic evidence. The health relation belongs at the state-changing boundary and must hold whether the signal is present or absent."

"13.9":
  id: "bypass-fail-open-outcomes"
  title: "Count the outcomes"
  prompt: "An asset gate calls `verify(...)` which returns `Result<bool, VerifyError>`, then uses `.unwrap_or(true)`. Why does this weaken the control more than a weak hash would?"
  options: "It turns 'verification could not run' into 'verification passed', so making the manifest unreadable is easier than forging a matching file||It makes the hash comparison slower||It prevents the manifest from ever being read||It only affects assets larger than the buffer"
  answer: "0"
  explanation: "There are three outcomes, not two: matched, did not match, and could not tell. Folding the error case into success means an attacker can delete, lock, or truncate the manifest instead of defeating the hash. Fail closed, and keep the unavailable case distinct from the mismatch case so a human can tell a changed file from broken verification."

"10.9":
  id: "runtime-identification-first"
  title: "Which collector moves objects?"
  prompt: "Two games are both described as 'managed and garbage collected': one is Unity on the Mono backend, the other runs on .NET CoreCLR. Which statement is accurate?"
  options: "Unity's Boehm collector does not move objects, so an address stays valid for the object's lifetime, while CoreCLR's compacting collector can relocate a surviving object||Both collectors relocate objects, so no address is ever durable||Neither collector relocates objects, so addresses behave exactly as in a native game||Only 32-bit runtimes relocate objects"
  answer: "0"
  explanation: "'Managed' does not decide whether an address is durable; the specific collector does. Unity's Mono uses the non-moving Boehm collector, which is why fixed addresses and pointer chains behave much as they do in native games. CoreCLR uses a generational compacting collector that relocates survivors, so there you need a stable reference such as a handle or a re-lookup rather than a remembered address."

"5.10":
  id: "dxgi-present-vtable-index"
  title: "Derive the slot"
  prompt: "`IDXGISwapChain` inherits IUnknown (3 methods), then IDXGIObject (4 methods), then IDXGIDeviceSubObject (1 method), and declares `Present` first. Which vtable index is `Present`, and why does that reasoning matter?"
  options: "Index 8, because a vtable lists inherited methods first in inheritance order, so the derivation can be repeated for any method instead of trusting a copied number||Index 0, because Present is the interface's own first method||Index 3, because IUnknown occupies the first three slots and everything else follows immediately||Index 8, but only in 32-bit processes"
  answer: "0"
  explanation: "3 + 4 + 1 = 8. The value matters less than the method: counting inherited interfaces in order lets you derive ResizeBuffers, DrawIndexed, or any other slot yourself, and tells you at once when a list found online is describing a different interface. Slot width does change with pointer size, but the index does not."

"5.11":
  id: "d3d-draw-count-units"
  title: "Count the right thing"
  prompt: "A filter written for Direct3D 11 keys on `index_count == 900`. Ported to Direct3D 9's `DrawIndexedPrimitive`, it matches nothing. What is the most likely cause?"
  options: "Direct3D 9 passes `primitive_count`, which counts primitives rather than indices, so a 900-index triangle list arrives as 300||Direct3D 9 does not support indexed drawing||The index buffer is bound differently, so counts are always zero||Direct3D 9 reports counts only after the frame is presented"
  answer: "0"
  explanation: "For a triangle list the two differ by a factor of three. Direct3D 11's `DrawIndexed` takes an index count; Direct3D 9's `DrawIndexedPrimitive` takes a primitive count. Confirm which unit an argument carries before porting a threshold, and note that `base_vertex_location` is signed in Direct3D 11 for the same care-with-units reason."
